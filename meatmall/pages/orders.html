<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>주문 내역 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{font-size:.9375rem}.app-wrap{background:var(--light-bg)}
.filter-bar{display:flex;gap:6px;padding:11px 14px;overflow-x:auto;scrollbar-width:none;background:var(--white);border-bottom:1px solid rgba(201,168,76,.2)}
.filter-bar::-webkit-scrollbar{display:none}
.fpill{flex-shrink:0;padding:6px 14px;border:1.5px solid #ddd;border-radius:999px;font-size:.8125rem;font-weight:600;color:var(--gray-txt);cursor:pointer;background:var(--white);transition:all .15s;white-space:nowrap}
.fpill.on{border-color:var(--gold);background:#FFFBF2;color:var(--gold);font-weight:800}
.fpill:active,.oabtn:active{opacity:.9;transform:scale(.98)}
.ord-card{background:var(--white);border:1.5px solid var(--gold);border-radius:var(--r-md);margin:8px 14px;overflow:hidden;box-shadow:0 2px 12px rgba(201,168,76,.1)}
.ord-head{display:flex;align-items:center;justify-content:space-between;padding:18px;background:linear-gradient(135deg,#FFFBF2,#FFF6E0);border-bottom:1px solid rgba(201,168,76,.2)}
.ord-num{font-size:.8125rem;font-weight:700;color:var(--gold)}
.ord-date{font-size:.8125rem;color:var(--gray-txt);margin-top:2px}
.ord-item-row{display:flex;gap:10px;padding:18px;border-bottom:1px solid rgba(201,168,76,.1)}
.ord-thumb{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0}
.ord-item-name{font-size:.9375rem;font-weight:600;color:var(--dark-txt);margin-bottom:3px}
.ord-item-meta{font-size:.8125rem;color:var(--gray-txt)}
.ord-item-price{font-size:1.3125rem;font-weight:800;color:var(--gold);flex-shrink:0}
.vb-notice{background:#FFFBF2;border-left:3px solid var(--gold);padding:10px 18px;font-size:.8125rem;color:#78350F;line-height:1.75}
.dep-badge{background:rgba(201,168,76,.15);color:var(--gold);font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--gold-bdr);display:inline-flex;align-items:center;gap:3px}
.ord-foot{display:flex;align-items:center;justify-content:space-between;padding:18px;background:#FAFAF7;flex-wrap:wrap;gap:8px}
.oabtn{font-size:.9375rem;font-weight:700;padding:6px 11px;border-radius:16px;cursor:pointer;border:none;transition:opacity .15s,transform .15s}
.oabtn-g{background:var(--gold);color:var(--black)}
.oabtn-o{background:var(--white);color:var(--gold);border:1.5px solid var(--gold)!important}
.oabtn-gray{background:var(--white);color:var(--gray-txt);border:1.5px solid #ddd!important}
.empty-box{text-align:center;padding:72px 24px;color:var(--gray-txt)}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="hdr">
    <button class="hdr-btn" onclick="history.back()">←</button>
    <div class="hdr-logo" style="font-size:.82rem;position:absolute;left:52px;font-family:\'Noto Serif KR\',serif;color:var(--gold);letter-spacing:.04em" onclick="go(\'../index.html\')">정육본가</div>
    <div class="hdr-title">주문 내역</div>
    <button class="hdr-btn" id="admin-btn" onclick="go('../admin/dashboard.html')" style="display:none">⚙️</button>
  </header>

  <div class="filter-bar">
    <div class="fpill on" onclick="filt('',this)">전체</div>
    <div class="fpill" onclick="filt('preparing',this)">준비중</div>
    <div class="fpill" onclick="filt('shipping',this)">배송중</div>
    <div class="fpill" onclick="filt('delivered',this)">완료</div>
    <div class="fpill" onclick="filt('cancelled',this)">취소</div>
  </div>

  <div id="ord-list" style="padding:4px 0 8px">
    <div style="text-align:center;padding:40px;color:var(--gray-txt)">🔄 불러오는 중...</div>
  </div>
  <div style="height:64px"></div>

  <nav class="nav-lt">
    <div class="nav-i" onclick="go('../index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈</div></div>
    <div class="nav-i" onclick="go('../pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육</div></div>
    <div class="nav-i" onclick="go('../pages/cart.html')"><div class="nav-ico">🛒</div><div class="nav-lbl">장바구니</div></div>
    <div class="nav-i on"><div class="nav-ico">📦</div><div class="nav-lbl">주문</div></div>
    <div class="nav-i" onclick="go('../pages/mypage.html')"><div class="nav-ico">👤</div><div class="nav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-wrap" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API='https://api.meatbonga.com/api';
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
function toast(m){const t=document.getElementById('toast-wrap');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
Store.load();showAdminBtn();
function getToken(){return localStorage.getItem('mm_access_token')||localStorage.getItem('mm_token')||null}
const SL={pending:'결제대기',pending_deposit:'준비중',awaiting_deposit:'준비중',preparing:'준비중',shipping:'배송중',delivered:'배송완료',cancelled:'취소됨',refunded:'환불완료'};
const SC={pending:'chip-gray',pending_deposit:'chip-gold',awaiting_deposit:'chip-gold',preparing:'chip-gold',shipping:'chip-blue',delivered:'chip-green',cancelled:'chip-red',refunded:'chip-red'};
const PL={CARD:'카드',KAKAO:'카카오페이',NAVER:'네이버페이',TOSS:'토스페이',VBANK:'무통장',PHONE:'휴대폰'};
let cur='';
async function load(){
  const token=getToken();if(!token){toast('로그인 필요');setTimeout(()=>go('../login.html'),800);return}
  document.getElementById('ord-list').innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-txt)">🔄 불러오는 중...</div>';
  try{
    let orders=[];
    if(cur==='preparing'){
      const [r1,r2]=await Promise.all([
        fetch(`${API}/payment/orders?page=1&limit=20&status=preparing`,{headers:{Authorization:'Bearer '+token},credentials:'include'}),
        fetch(`${API}/payment/orders?page=1&limit=20&status=pending_deposit`,{headers:{Authorization:'Bearer '+token},credentials:'include'})
      ]);
      const [d1,d2]=await Promise.all([r1.json(),r2.json()]);
      orders=[...(d1.orders||[]),...(d2.orders||[])].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    }else{
      let url=`${API}/payment/orders?page=1&limit=30`;if(cur)url+=`&status=${cur}`;
      const r=await fetch(url,{headers:{Authorization:'Bearer '+token},credentials:'include'});
      if(r.status===401){go('../login.html');return}
      const d=await r.json();if(!r.ok)throw new Error(d.error||'오류');
      orders=d.orders||[];
    }
    render(orders);
  }catch(e){document.getElementById('ord-list').innerHTML=`<div class="empty-box"><div style="font-size:2.5rem;margin-bottom:12px">😢</div><div>${e.message}</div><button onclick="load()" style="margin-top:14px;padding:8px 20px;background:var(--gold);color:var(--black);border:none;border-radius:16px;font-size:.9375rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s">다시 시도</button></div>`}
}
function render(orders){
  const list=document.getElementById('ord-list');
  if(!orders.length){list.innerHTML=`<div class="empty-box"><div style="font-size:3rem;margin-bottom:14px">📦</div><div style="margin-bottom:18px">${cur==='preparing'?'준비중인 주문이 없습니다':'아직 주문 내역이 없습니다'}</div><button onclick="go('../index.html')" style="padding:10px 24px;background:var(--gold);color:var(--black);border:none;border-radius:16px;font-size:.9375rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s">쇼핑하러 가기</button></div>`;return}
  list.innerHTML=orders.map(o=>{
    const d=new Date(o.created_at),ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const isVW=o.payment_method==='VBANK'&&(o.payment_status==='awaiting_deposit'||o.status==='pending_deposit');
    const items=o.order_items||[],first=items[0],more=items.length-1;
    const isSh=o.status==='shipping',isDone=o.status==='delivered',isCancel=['pending','preparing'].includes(o.status)&&o.payment_status==='paid';
    return `<div class="ord-card">
    <div class="ord-head">
      <div><div class="ord-num">주문번호 ${o.order_number}</div><div class="ord-date">${ds}</div></div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="chip ${SC[o.status]||'chip-gray'}">${SL[o.status]||o.status}</span>
        ${isVW?'<span class="dep-badge">🏦 입금대기중</span>':''}
      </div>
    </div>
    ${isVW?`<div class="vb-notice">입금계좌 <strong>${o.bank_name||'기업은행'} · (주)정육본가</strong> · 입금자명 <strong>${o.depositor_name||'미등록'}</strong><br>입금금액 <strong style="color:var(--gold)">${fmt(o.final_amount)}원</strong>${o.deposit_deadline?` · 기한 <strong style="color:#DC2626">${new Date(o.deposit_deadline).toLocaleDateString('ko-KR')}</strong>`:''}</div>`:''}
    ${first?`<div class="ord-item-row"><div class="ord-thumb">🥩</div><div style="flex:1;min-width:0"><div class="ord-item-name">${first.name}${more>0?` 외 ${more}건`:''}</div><div class="ord-item-meta">수량 ${first.qty}개${first.option?' · '+first.option:''}</div></div><div class="ord-item-price">${fmt(first.subtotal||first.price*first.qty)}원</div></div>`:''}
    <div class="ord-foot">
      <div style="font-size:.9375rem;font-weight:700;color:var(--dark-txt)">총 <strong style="color:var(--gold);font-size:1.3125rem">${fmt(o.final_amount)}원</strong> <span style="font-size:.8125rem;color:var(--gray-txt);font-weight:400">${PL[o.payment_method]||''}</span> <span style="font-size:.75rem;font-weight:700;color:${o.delivery_type==='same_day'?'#EA580C':'var(--gray-txt)'}">${o.delivery_type==='same_day'?'⚡당일배송':'📦일반배송'}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${isSh?`<button class="oabtn oabtn-g" onclick="toast('운송장: ${o.tracking_number||'등록 전'}')">📦 배송조회</button>`:''}
        ${isDone?`<button class="oabtn oabtn-o" onclick="toast('리뷰 준비 중')">⭐ 리뷰</button>`:''}
        ${isCancel||isVW?`<button class="oabtn oabtn-gray" onclick="cancelOrd('${o.order_number}')">✕ 취소</button>`:''}
        <button class="oabtn oabtn-gray" onclick="go('../pages/cs.html')">💬 문의</button>
      </div>
    </div></div>`;
  }).join('');
}
function filt(s,el){cur=s;document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('on'));el.classList.add('on');load()}
async function cancelOrd(orderId){
  if(!confirm('주문을 취소하시겠습니까?'))return;
  try{const r=await fetch(API+'/payment/cancel',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({orderId,reason:'고객 요청'})});const d=await r.json();if(!r.ok)throw new Error(d.error);toast('취소됐습니다');load()}
  catch(e){toast('❌ '+e.message)}
}
load();
</script>
</body></html>
