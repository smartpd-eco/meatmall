<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>로그인 처리 중 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.callback-wrap {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px; text-align: center; gap: 20px;
}
.callback-logo { font-size: 3rem; }
.callback-spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--peach);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.callback-msg { font-size: .95rem; color: var(--gray-700); line-height: 1.6; }
.callback-error {
  background: var(--red-light); border: 1px solid #FCA5A5;
  border-radius: var(--radius-md); padding: 14px 18px;
  color: var(--red); font-size: .88rem; line-height: 1.6; display: none;
}
</style>
</head>
<body>
<div class="app-wrap">
<div class="callback-wrap">
  <div class="callback-logo">🥩</div>
  <div class="callback-spinner" id="spinner"></div>
  <div class="callback-msg" id="msg">로그인 처리 중입니다.<br>잠시만 기다려주세요...</div>
  <div class="callback-error" id="error-box"></div>
</div>
</div>

<script>
(function handleCallback() {
  try {
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const name   = params.get('name');
    const grade  = params.get('grade') || 'BASIC';
    const point  = params.get('point') || '0';
    const error  = params.get('error');

    if (error) {
      const msgs = {
        kakao_failed:  '카카오 로그인에 실패했습니다',
        naver_failed:  '네이버 로그인에 실패했습니다',
        google_failed: '구글 로그인에 실패했습니다',
        inactive:      '비활성화된 계정입니다. 고객센터에 문의해주세요'
      };
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = '';
      const errBox = document.getElementById('error-box');
      errBox.textContent = '⚠️ ' + (msgs[error] || '로그인 오류가 발생했습니다');
      errBox.style.display = 'block';
      setTimeout(() => { window.location.href = '../login.html'; }, 2500);
      return;
    }

    if (token) {
      // 토큰 & 유저 정보 저장
      localStorage.setItem('mm_access_token', token);
      localStorage.setItem('mm_user_cache', JSON.stringify({
        name, grade, point: Number(point)
      }));

      document.getElementById('msg').innerHTML =
        `환영합니다, <strong style="color:#7C2D12">${name || ''}</strong>님!<br>홈으로 이동합니다...`;

      setTimeout(() => { window.location.href = '../index.html'; }, 1000);
      return;
    }

    throw new Error('토큰 없음');
  } catch (err) {
    document.getElementById('spinner').style.display = 'none';
    const errBox = document.getElementById('error-box');
    errBox.textContent = '⚠️ 로그인 처리 중 오류가 발생했습니다.';
    errBox.style.display = 'block';
    setTimeout(() => { window.location.href = '../login.html'; }, 2500);
  }
})();
</script>
</body>
</html>
