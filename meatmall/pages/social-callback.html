<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>로그인 처리 중 · 정육본가</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0F0F;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Apple SD Gothic Neo',sans-serif}
.wrap{text-align:center}
.brand{font-family:'Noto Serif KR',serif;font-size:1.1rem;color:#C9A84C;margin-bottom:20px}
.spinner{width:34px;height:34px;border:3px solid rgba(201,168,76,.2);border-top-color:#C9A84C;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:.85rem;color:rgba(255,255,255,.45)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">정육본가</div>
  <div class="spinner"></div>
  <div class="msg">로그인 처리 중...</div>
</div>
<script>
(function(){
  var base = location.pathname.indexOf('/meatmall/') === 0 ? '/meatmall' : '';
  var params       = new URLSearchParams(window.location.search);
  var accessToken  = params.get('accessToken');
  var refreshToken = params.get('refreshToken');
  var needsPhone   = params.get('needsPhone');
  var error        = params.get('error');

  if (error || !accessToken) {
    window.location.href = base + '/login.html';
  } else {
    localStorage.setItem('accessToken', accessToken);
    localStorage.setItem('mm_access_token', accessToken);  // 앱 전체 호환
    localStorage.setItem('mm_last_active', String(Date.now()));
    if (refreshToken) localStorage.setItem('refreshToken', refreshToken);
    window.location.href = (needsPhone === 'true')
      ? base + '/pages/phone-verify.html'
      : base + '/index.html';
  }
})();
</script>
</body>
</html>
