<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>로그인 처리 중 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.callback-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
  gap: 20px;
}
.callback-logo { font-size: 3rem; }
.callback-spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--peach);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.callback-msg { font-size: .95rem; color: var(--gray-700); line-height: 1.6; }
.callback-error {
  background: var(--red-light);
  border: 1px solid #FCA5A5;
  border-radius: var(--radius-md);
  padding: 14px 18px;
  color: var(--red);
  font-size: .88rem;
  line-height: 1.6;
  display: none;
}
</style>
</head>
<body>
<div class="app-wrap">
<div class="callback-wrap">
  <div class="callback-logo">🥩</div>
  <div class="callback-spinner" id="spinner"></div>
  <div class="callback-msg" id="msg">로그인 처리 중입니다.<br>잠시만 기다려주세요...</div>
  <div class="callback-error" id="error-box"></div>
</div>
</div>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script>
(async function handleCallback() {
  try {
    const result = AuthAPI.handleSocialCallback();

    if (!result.ok) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = '';
      const errBox = document.getElementById('error-box');
      errBox.textContent = '⚠️ ' + result.error;
      errBox.style.display = 'block';
      setTimeout(() => { window.location.href = '../login.html'; }, 2500);
      return;
    }

    document.getElementById('msg').innerHTML =
      `환영합니다, <strong style="color:var(--primary)">${Auth.getUser()?.name || ''}</strong>님!<br>홈으로 이동합니다...`;

    setTimeout(() => { window.location.href = '../index.html'; }, 1000);
  } catch (err) {
    document.getElementById('spinner').style.display = 'none';
    const errBox = document.getElementById('error-box');
    errBox.textContent = '⚠️ 로그인 처리 중 오류가 발생했습니다.';
    errBox.style.display = 'block';
    setTimeout(() => { window.location.href = '../login.html'; }, 2500);
  }
})();
</script>
</body>
</html>
