<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>정육 선택 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
:root{--gold:#C9A84C;--onyx:#111;--charcoal:#1E1E1E}
body{background:var(--onyx)}
.app-wrap{background:var(--onyx)}

.dark-header{
  position:sticky;top:0;z-index:200;
  background:#0F0F0F;
  border-bottom:2px solid #C9A84C;
  height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  width:100%!important;max-width:430px!important;box-sizing:border-box;
  box-shadow:0 2px 12px rgba(201,168,76,.15);
}
.dh-title{
  font-family:'Noto Serif KR',serif;
  font-size:.95rem;font-weight:700;color:var(--text-primary);letter-spacing:.04em;
}
.dh-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--text-primary);cursor:pointer;border:none;background:none}
.dh-btn:hover{background:rgba(255,255,255,.08)}

/* 카테고리 탭 */
.cat-tabs{
  background:var(--onyx);border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;overflow-x:auto;scrollbar-width:none;
  width:100%;box-sizing:border-box;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  flex-shrink:0;padding:12px 15px;
  font-size:.79rem;font-weight:600;
  color:#9CA3AF;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.02em;
}
.cat-tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}

/* 필터/정렬 바 */
.filter-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:var(--charcoal);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.sort-sel{
  height:34px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);
  padding:0 10px;font-size:.78rem;color:#D1D5DB;
  outline:none;cursor:pointer;flex-shrink:0;
}
.sort-sel option{background:#222;color:#fff}
.view-toggle{display:flex;gap:4px;margin-left:auto}
.view-btn{
  width:30px;height:30px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.85rem;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);color:#9CA3AF;
}
.view-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08)}
.result-count{font-size:.75rem;color:#9CA3AF;margin-left:4px}

/* 그리드형 상품 */
.prd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px}
.prd-list{display:flex;flex-direction:column;gap:8px;padding:10px 14px}

.pcard{
  background:var(--charcoal);border-radius:var(--radius-md);overflow:hidden;
  cursor:pointer;border:1px solid rgba(255,255,255,.06);
  transition:border-color .18s;
}
.pcard:hover{border-color:rgba(201,168,76,.28)}
.pcard-thumb{
  aspect-ratio:1/1;background:#1A1A1A;
  display:flex;align-items:center;justify-content:center;
  font-size:2.8rem;position:relative;overflow:hidden;
}
.pcard-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.disc-badge{position:absolute;top:7px;left:7px;background:var(--gold);color:#111;font-size:.62rem;font-weight:900;padding:3px 7px;border-radius:3px}
.haccp-badge{position:absolute;top:7px;right:7px;background:rgba(17,17,17,.8);border:1px solid rgba(201,168,76,.4);color:var(--gold);font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:3px}
.sold-dim{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:.9rem;color:#D1D5DB;letter-spacing:.12em}
.pcard-info{padding:9px 11px 12px}
.pcard-cat{font-size:.62rem;color:var(--gold);letter-spacing:.08em;margin-bottom:3px;font-weight:600}
.pcard-name{font-size:.85rem;font-weight:700;color:var(--text-primary);line-height:1.3;margin-bottom:5px}
.pcard-weight{font-size:.72rem;color:#9CA3AF;margin-bottom:6px}
.pcard-price-row{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.pcard-price{font-size:1rem;font-weight:800;color:var(--text-primary)}
.pcard-origin{font-size:.7rem;color:#9CA3AF;text-decoration:line-through}
.pcard-disc{font-size:.72rem;font-weight:700;color:var(--gold)}
.wish-btn{position:absolute;bottom:7px;right:7px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;border:none}

/* 리스트형 */
.lcard{
  background:var(--charcoal);border-radius:var(--radius-md);
  display:flex;gap:12px;padding:12px;
  border:1px solid rgba(255,255,255,.06);cursor:pointer;
  transition:border-color .18s;
}
.lcard:hover{border-color:rgba(201,168,76,.28)}
.lthumb{
  width:78px;height:78px;border-radius:var(--radius-sm);
  background:#1A1A1A;
  display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;overflow:hidden;position:relative;
}
.lthumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.linfo{flex:1;min-width:0}
.lcat{font-size:.62rem;color:var(--gold);font-weight:600;letter-spacing:.08em;margin-bottom:2px}
.lname{font-size:.88rem;font-weight:700;color:var(--text-primary);line-height:1.3;margin-bottom:3px}
.lmeta{font-size:.72rem;color:#9CA3AF;margin-bottom:6px}
.lprice-row{display:flex;align-items:baseline;gap:5px}
.lprice{font-size:.95rem;font-weight:800;color:var(--text-primary)}
.lorigin{font-size:.7rem;color:#9CA3AF;text-decoration:line-through}
.ldisc{font-size:.7rem;font-weight:700;color:var(--gold)}

/* 빈 상태 */
.empty-state{text-align:center;padding:60px 24px}
.empty-icon{font-size:3rem;margin-bottom:14px}
.empty-text{font-size:.88rem;color:#9CA3AF;line-height:1.7}

/* .skel 은 main.css 에서 관리 */

/* 하단 네비 */
.dark-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:62px;
  background:#0F0F0F;
  border-top:2px solid #C9A84C;display:flex;z-index:200;
  box-sizing:border-box;
  box-shadow:0 -4px 16px rgba(201,168,76,.12);
}
.dnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.dnav-ico{font-size:1.1rem}
.dnav-lbl{font-size:.58rem;font-weight:600;color:#9CA3AF;letter-spacing:.04em}
.dnav-item.on .dnav-lbl,.dnav-item.on .dnav-ico{color:var(--gold)}
</style>
<script>window.addEventListener('pageshow',function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap" style="display:flex;flex-direction:column;min-height:100vh">
<header class="dark-header">
    <button class="dh-btn" onclick="history.back()">←</button>
    <div class="dh-title">정육 선택</div>
    <div style="display:flex;gap:4px">
      <button id="admin-btn" class="dh-btn" onclick="go('../admin/dashboard.html')" style="display:none">⚙️</button>
      <button class="dh-btn" onclick="go('../pages/cart.html')">🛒</button>
    </div>
  </header>

  <!-- 카테고리 탭 (JS로 동적 렌더링) -->
  <div class="cat-tabs" id="cat-tabs">
    <div style="padding:12px 16px;font-size:.79rem;color:#9CA3AF">불러오는 중…</div>
  </div>

  <!-- 필터 바 -->
  <div class="filter-bar">
    <select class="sort-sel" id="sort-sel" onchange="loadProducts()">
      <option value="created_at">최신순</option>
      <option value="price_asc">낮은가격순</option>
      <option value="price_desc">높은가격순</option>
    </select>
    <span class="result-count" id="result-count"></span>
    <div class="view-toggle">
      <div class="view-btn on" id="vbtn-grid" onclick="setView('grid')" title="그리드">⊞</div>
      <div class="view-btn"    id="vbtn-list" onclick="setView('list')" title="리스트">☰</div>
    </div>
  </div>

  <div id="prd-wrap" style="padding-bottom:76px">
    <div style="text-align:center;padding:60px 24px;color:#9CA3AF;font-size:.88rem">상품을 불러오는 중...</div>
  </div>

  <nav class="dark-nav">
    <div class="dnav-item" onclick="go('../index.html')"><div class="dnav-ico">🏠</div><div class="dnav-lbl">홈</div></div>
    <div class="dnav-item on"><div class="dnav-ico">🥩</div><div class="dnav-lbl">정육</div></div>
    <div class="dnav-item" onclick="go('../pages/cart.html')"><div class="dnav-ico">🛒</div><div class="dnav-lbl">장바구니</div></div>
    <div class="dnav-item" onclick="go('../pages/orders.html')"><div class="dnav-ico">📦</div><div class="dnav-lbl">주문</div></div>
    <div class="dnav-item" onclick="go('../pages/mypage.html')"><div class="dnav-ico">👤</div><div class="dnav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API='https://meatmall-server.vercel.app/api';
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
function toast(msg){const el=document.getElementById('toast-global');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}

Store.load(); showAdminBtn();

const _urlCatName = new URLSearchParams(window.location.search).get('cat')||'';

// slug→한글 fallback (기존 상품 호환)
const CAT_KO = {samgyeop:'삼겹살',ogyeop:'오겹살',moksal:'목살',apdaree:'앞다리살',mibakapdaree:'미박앞다리살',deungshim:'등심'};
let currentCat = _urlCatName;
let viewMode='grid', allProducts=[];

async function initPage(){
  // 카테고리 탭과 상품 목록을 병렬 요청
  const catPromise = fetch(`${API}/admin/categories`)
    .then(r=>r.ok?r.json():null).catch(()=>null);

  const [catData] = await Promise.all([catPromise, loadProducts()]);

  if(catData && catData.categories && catData.categories.length){
    const cats=catData.categories;
    document.getElementById('cat-tabs').innerHTML=
      `<div class="cat-tab${!currentCat?' on':''}" onclick="selectCat('',this)">전체</div>`+
      cats.map(c=>
        `<div class="cat-tab${currentCat===c.name?' on':''}" onclick="selectCat('${c.name}',this)">${c.name}</div>`
      ).join('');
  }else{
    document.getElementById('cat-tabs').innerHTML=
      `<div class="cat-tab on" onclick="selectCat('',this)">전체</div>`;
  }
}

function selectCat(catName,el){
  currentCat=catName;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  loadProducts();
}
function setView(v){
  viewMode=v;
  document.getElementById('vbtn-grid').classList.toggle('on',v==='grid');
  document.getElementById('vbtn-list').classList.toggle('on',v==='list');
  renderProducts(allProducts);
}

function showLoading(){
  const card=`
    <div class="pcard" style="pointer-events:none">
      <div class="pcard-thumb skel skel-thumb"></div>
      <div class="pcard-info">
        <div class="skel skel-line" style="width:38%"></div>
        <div class="skel skel-line" style="width:82%;height:14px"></div>
        <div class="skel skel-line" style="width:52%"></div>
        <div class="skel skel-line" style="width:48%;height:16px"></div>
      </div>
    </div>`;
  document.getElementById('prd-wrap').innerHTML=
    `<div class="prd-grid" style="pointer-events:none">${card.repeat(6)}</div>`;
}
function hideLoading(){
  // renderProducts 또는 catch 블록이 이미 콘텐츠를 교체했으면 no-op
  // 그 어느 쪽도 실행되지 않은 경우(edge case)에만 로딩 화면을 제거
  const w=document.getElementById('prd-wrap');
  if(w&&w.innerHTML.includes('불러오는 중')){
    w.innerHTML='<div class="empty-state"><div class="empty-icon">😢</div><div class="empty-text">상품 로딩에 실패했습니다</div></div>';
  }
}

async function fetchRetry(url, tries){
  tries = tries || 4; let lastErr;
  for(let i=0;i<tries;i++){
    try{ const r=await fetch(url); if(r.ok) return r; lastErr=new Error('HTTP '+r.status); }
    catch(e){ lastErr=e; }
    if(i<tries-1) await new Promise(res=>setTimeout(res, 1000+i*800));
  }
  throw lastErr||new Error('요청 실패');
}
async function loadProducts(){
  showLoading();
  try{
    const sort=document.getElementById('sort-sel').value;
    let url=`${API}/products?limit=30&sort=${sort}`;
    if(currentCat) url+=`&category=${encodeURIComponent(currentCat)}`;
    const r=await fetchRetry(url, 4);
    const d=await r.json();
    allProducts=d.products||[];
    document.getElementById('result-count').textContent=allProducts.length+'개';
    renderProducts(allProducts);
  }catch(e){
    console.error('[loadProducts]',e);
    document.getElementById('prd-wrap').innerHTML=`<div class="empty-state"><div class="empty-icon">😢</div><div class="empty-text">상품을 불러오지 못했습니다</div><button onclick="loadProducts()" style="margin-top:16px;background:linear-gradient(135deg,#A8862A,#E8C97A);color:#111;border:none;border-radius:8px;padding:10px 24px;font-size:.85rem;font-weight:700;cursor:pointer">다시 시도</button></div>`;
  }finally{
    hideLoading(); // 반드시 실행 — 어떤 경우에도 로딩 상태 해제
  }
  // preloadProductImages는 렌더링 외부에서 호출 — 예외가 상품 목록을 덮어쓰지 않도록
  if(allProducts.length){ try{preloadProductImages(allProducts);}catch(_){} }
}

function renderProducts(products){
  const wrap=document.getElementById('prd-wrap');
  if(!products.length){
    wrap.innerHTML=`<div class="empty-state"><div class="empty-icon">🥩</div><div class="empty-text">현재 해당 부위는 준비 중입니다<br>기준에 맞는 정육 입고 시 알림드립니다</div></div>`;
    return;
  }
  if(viewMode==='grid'){
    wrap.innerHTML=`<div class="prd-grid">${products.map(gridCard).join('')}</div>`;
  } else {
    wrap.innerHTML=`<div class="prd-list">${products.map(listCard).join('')}</div>`;
  }
  if(typeof initLazyImages==='function') initLazyImages();
}

function thumbUrl(p){ return p.thumbnail_url||null; }

function gridCard(p){
  const disc=p.origin_price?Math.round((1-p.price/p.origin_price)*100):0;
  const sold=p.stock<=0;
  const catKo=p.category_name||CAT_KO[p.category]||p.category||'';
  const thumb=thumbUrl(p);
  return `
  <div class="pcard" onclick="${sold?'soldAlert()':`go('../pages/product.html?id=${p.id}')`}">
    <div class="pcard-thumb">
      ${thumb?`<img src="${thumb}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px 8px 0 0;" loading="lazy" onerror="this.parentElement.innerHTML='<div style=width:100%;height:100%;background:#2a2a2a;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center><span style=color:#555;font-size:11px>이미지 준비중</span></div>'">`:`<div style="width:100%;height:100%;background:#2a2a2a;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;"><span style="color:#555;font-size:11px;">이미지 준비중</span></div>`}
      ${disc>0?`<div class="disc-badge">${disc}%</div>`:''}
      ${p.haccp?`<div class="haccp-badge">HACCP</div>`:''}
      ${sold?`<div class="sold-dim">SOLD OUT</div>`:''}
      ${!sold?`<button class="wish-btn" onclick="event.stopPropagation();doWish('${p.id}',this)">${Store.isWished?.(p.id)?'❤️':'🤍'}</button>`:''}
    </div>
    <div class="pcard-info">
      <div class="pcard-cat">${catKo}</div>
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-weight">${p.weight_g?p.weight_g+'g · ':''}${p.origin||'국내산'}</div>
      <div class="pcard-price-row">
        <div class="pcard-price">${fmt(p.price)}원</div>
        ${p.origin_price?`<div class="pcard-origin">${fmt(p.origin_price)}</div>`:''}
        ${disc>0?`<div class="pcard-disc">${disc}%↓</div>`:''}
      </div>
    </div>
  </div>`;
}

function listCard(p){
  const disc=p.origin_price?Math.round((1-p.price/p.origin_price)*100):0;
  const sold=p.stock<=0;
  const catKo=p.category_name||CAT_KO[p.category]||p.category||'';
  const thumb=thumbUrl(p);
  return `
  <div class="lcard" onclick="${sold?'soldAlert()':`go('../pages/product.html?id=${p.id}')`}" style="${sold?'opacity:.5':''}">
    <div class="lthumb">
      ${thumb?`<img src="${thumb}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" onerror="this.parentElement.innerHTML='<div style=width:100%;height:100%;background:#2a2a2a;display:flex;align-items:center;justify-content:center><span style=color:#555;font-size:11px>이미지 준비중</span></div>'">`:`<div style="width:100%;height:100%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;"><span style="color:#555;font-size:11px;">이미지 준비중</span></div>`}
    </div>
    <div class="linfo">
      <div class="lcat">${catKo}${sold?' · SOLD OUT':''}</div>
      <div class="lname">${p.name}</div>
      <div class="lmeta">${p.weight_g?p.weight_g+'g · ':''}${p.origin||'국내산'}</div>
      <div class="lprice-row">
        <div class="lprice">${fmt(p.price)}원</div>
        ${p.origin_price?`<div class="lorigin">${fmt(p.origin_price)}</div>`:''}
        ${disc>0?`<div class="ldisc">${disc}%↓</div>`:''}
      </div>
    </div>
  </div>`;
}

function doWish(id,btn){
  Store.toggleWish(id);
  btn.textContent=Store.isWished(id)?'❤️':'🤍';
  toast(Store.isWished(id)?'찜했습니다 ❤️':'찜 취소됐습니다');
}
function soldAlert(){ toast('현재 품절입니다. 재입고 시 알림드립니다.'); }

initPage();
</script>
</body>
</html>
