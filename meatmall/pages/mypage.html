<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마이페이지 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:#111}.app-wrap{background:#111}
.profile-hero{
  background:linear-gradient(160deg,#0D0D0D,#1A1208);
  border-bottom:1px solid rgba(201,168,76,.15);
  padding:28px 20px 24px;
}
.profile-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#2A1A0A,#1A1208);
  border:2px solid rgba(201,168,76,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;margin-bottom:14px;
}
.profile-name{font-family:'Noto Serif KR',serif;font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:4px}
.profile-email{font-size:.78rem;color:rgba(255,255,255,.3);margin-bottom:12px}
.grade-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);
  border-radius:999px;padding:5px 14px;
  font-size:.74rem;font-weight:700;color:var(--gold);letter-spacing:.08em;
}
.point-card{
  background:#1E1E1E;border:1px solid rgba(201,168,76,.15);
  border-radius:var(--radius-md);padding:16px;margin-top:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.point-label{font-size:.74rem;color:rgba(255,255,255,.4);margin-bottom:4px}
.point-val{font-size:1.4rem;font-weight:800;color:var(--gold)}

.menu-section{padding:8px 0}
.menu-label{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:.12em;padding:14px 16px 6px;text-transform:uppercase}
.menu-item{
  display:flex;align-items:center;gap:12px;
  padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;transition:background .12s;
}
.menu-item:hover{background:rgba(255,255,255,.03)}
.menu-item:last-child{border-bottom:none}
.menu-ico{width:36px;height:36px;border-radius:var(--radius-sm);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.menu-text{flex:1}
.menu-name{font-size:.9rem;font-weight:600;color:#fff}
.menu-sub{font-size:.74rem;color:rgba(255,255,255,.25);margin-top:2px}
.menu-arrow{color:rgba(255,255,255,.2);font-size:.9rem}
.logout-btn{
  width:calc(100% - 28px);margin:16px 14px;height:50px;
  background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.2);
  border-radius:var(--radius-md);color:#F87171;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;
}
.logout-btn:hover{background:rgba(220,38,38,.18)}
</style>
<script>window.addEventListener('pageshow',function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="dark-header">
    <button class="dh-btn" onclick="history.back()">←</button>
    <div class="dh-title">마이페이지</div>
    <button id="admin-btn" class="dh-btn" onclick="go('../admin/dashboard.html')" style="display:none">⚙️</button>
  </header>

  <div id="profile-area">
    <div class="profile-hero">
      <div style="text-align:center">
        <div class="profile-avatar" style="margin:0 auto 14px">👤</div>
        <div class="profile-name" id="user-name">불러오는 중...</div>
        <div class="profile-email" id="user-email"></div>
        <div class="grade-badge">👑 <span id="user-grade">VIP</span> 회원</div>
        <div class="point-card">
          <div><div class="point-label">보유 포인트</div><div class="point-val" id="user-point">0P</div></div>
          <div style="font-size:.76rem;color:rgba(255,255,255,.25)">구매금액 1% 적립</div>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-label">쇼핑</div>
    <div class="menu-item" onclick="go('../pages/orders.html')">
      <div class="menu-ico">📦</div>
      <div class="menu-text"><div class="menu-name">주문 내역</div><div class="menu-sub">주문 현황 및 배송 조회</div></div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/address.html')">
      <div class="menu-ico">📍</div>
      <div class="menu-text"><div class="menu-name">배송지 관리</div><div class="menu-sub">배송지 추가·수정·삭제</div></div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/subscribe.html')">
      <div class="menu-ico">🔄</div>
      <div class="menu-text"><div class="menu-name">정기배송 구독</div><div class="menu-sub">매주 신선한 정육 배송</div></div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-label">고객센터</div>
    <div class="menu-item" onclick="go('../pages/cs.html')">
      <div class="menu-ico">💬</div>
      <div class="menu-text"><div class="menu-name">1:1 문의</div><div class="menu-sub">주문·배송·상품 문의</div></div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/cs.html')">
      <div class="menu-ico">❓</div>
      <div class="menu-text"><div class="menu-name">자주 묻는 질문</div><div class="menu-sub">FAQ 바로가기</div></div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  <div style="height:70px"></div>

  <nav class="dark-nav">
    <div class="dnav-item" onclick="go('../index.html')"><div class="dnav-ico">🏠</div><div class="dnav-lbl">홈</div></div>
    <div class="dnav-item" onclick="go('../pages/category.html')"><div class="dnav-ico">🥩</div><div class="dnav-lbl">정육</div></div>
    <div class="dnav-item" onclick="go('../pages/cart.html')"><div class="dnav-ico">🛒</div><div class="dnav-lbl">장바구니</div></div>
    <div class="dnav-item" onclick="go('../pages/orders.html')"><div class="dnav-ico">📦</div><div class="dnav-lbl">주문</div></div>
    <div class="dnav-item on"><div class="dnav-ico">👤</div><div class="dnav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API='https://meatmall.vercel.app/api';
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
function toast(msg){const el=document.getElementById('toast-global');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}

Store.load(); showAdminBtn();

async function loadUser(){
  const token=localStorage.getItem('mm_access_token');
  if(!token){go('../login.html');return;}
  const cached=JSON.parse(localStorage.getItem('mm_user_cache')||'{}');
  if(cached.name){
    document.getElementById('user-name').textContent=cached.name;
    document.getElementById('user-email').textContent=cached.email||'';
    document.getElementById('user-grade').textContent=cached.grade||'VVIP';
    document.getElementById('user-point').textContent=fmt(cached.point||0)+'P';
  }
  try{
    const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token},credentials:'include'});
    if(r.ok){
      const d=await r.json();
      const u=d.user;
      document.getElementById('user-name').textContent=u.name;
      document.getElementById('user-email').textContent=u.email;
      document.getElementById('user-grade').textContent=u.grade||'VVIP';
      document.getElementById('user-point').textContent=fmt(u.point||0)+'P';
      localStorage.setItem('mm_user_cache',JSON.stringify(u));
    }
  }catch(e){}
}

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('mm_access_token');
  localStorage.removeItem('mm_user_cache');
  sessionStorage.removeItem('mm_admin');
  go('../login.html');
}

loadUser();
</script>
</body>
</html>
