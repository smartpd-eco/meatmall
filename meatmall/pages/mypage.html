<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마이페이지 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:var(--onyx)!important}.app-wrap{background:var(--onyx)!important}

/* 마이페이지 = 흰 배경 + 골드 포인트 */
body { background: #F8F6F0 !important; }
.app-wrap { background: #F8F6F0 !important; }

.mp-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  border-bottom: 2px solid var(--gold);
  height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px;
  width: 100%; box-sizing: border-box;
}
.mp-header-title {
  font-family: var(--font-display);
  font-size: .95rem; font-weight: 700; color: #111;
  position: absolute; left: 50%; transform: translateX(-50%);
}
.mp-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; border: none; background: none; position: relative; z-index: 1; }

/* 프로필 히어로 */
.profile-hero {
  background: linear-gradient(160deg, #111, #1A1208);
  padding: 28px 20px 24px; text-align: center;
  border-bottom: 2px solid var(--gold);
}
.profile-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #2A1A0A, #1A1208);
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; margin: 0 auto 14px;
  box-shadow: 0 0 0 4px rgba(201,168,76,.15);
}
.profile-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
.profile-email { font-size: .78rem; color: rgba(255,255,255,.4); margin-bottom: 12px; }
.grade-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(201,168,76,.15); border: 1px solid var(--gold);
  border-radius: 999px; padding: 5px 14px;
  font-size: .74rem; font-weight: 700; color: var(--gold);
}
.point-card {
  background: #fff; border: 1.5px solid var(--gold);
  border-radius: 14px; padding: 16px; margin-top: 14px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(201,168,76,.15);
}
.point-label { font-size: .74rem; color: #666; margin-bottom: 4px; }
.point-val { font-size: 1.5rem; font-weight: 800; color: var(--gold); }

/* 메뉴 섹션 */
.menu-section { padding: 8px 0; }
.menu-label {
  font-size: .68rem; font-weight: 700; color: #999;
  letter-spacing: .12em; padding: 14px 16px 6px; text-transform: uppercase;
}
.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 16px; background: #fff;
  border-bottom: 1px solid #F0EDE6;
  cursor: pointer; transition: background .12s;
}
.menu-item:first-of-type { border-top: 1px solid var(--gold); }
.menu-item:last-of-type  { border-bottom: 1.5px solid var(--gold); }
.menu-item:hover { background: #FFFBF5; }
.menu-ico {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #FFF7ED, #FEF3C7);
  border: 1px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.menu-name { font-size: .9rem; font-weight: 600; color: #111; }
.menu-sub  { font-size: .74rem; color: #888; margin-top: 2px; }
.menu-arrow { color: var(--gold); font-size: .9rem; margin-left: auto; }

.logout-btn {
  width: calc(100% - 28px); margin: 16px 14px;
  height: 50px; background: #fff;
  border: 1.5px solid var(--gold);
  border-radius: 12px; color: var(--gold);
  font-size: .9rem; font-weight: 700; cursor: pointer;
  transition: all .15s;
}
.logout-btn:hover { background: #FFF7ED; }

/* 하단 네비 — 흰 배경 + 골드 상단 테두리 */
.mp-nav {
  position: sticky; bottom: 0; z-index: 100;
  width: 100%; height: 62px; background: #fff;
  border-top: 2px solid var(--gold);
  display: flex; box-sizing: border-box; margin-top: auto;
}
.mp-nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; cursor: pointer;
}
.mp-nav-ico { font-size: 1.1rem; }
.mp-nav-lbl { font-size: .58rem; font-weight: 600; color: #999; letter-spacing: .04em; }
.mp-nav-item.on .mp-nav-lbl { color: var(--gold); font-weight: 800; }
.mp-nav-item.on .mp-nav-ico { filter: drop-shadow(0 0 4px rgba(201,168,76,.4)); }
</style>
<script>window.addEventListener('pageshow',function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap";display:flex;flex-direction:column;min-height:100vh">

  <header class="mp-header">
    <button class="mp-btn" onclick="history.back()">←</button>
    <div class="mp-header-title">마이페이지</div>
    <button class="mp-btn" id="admin-btn" onclick="go('../admin/dashboard.html')" style="display:none">⚙️</button>
  </header>

  <!-- 프로필 히어로 (다크) -->
  <div class="profile-hero">
    <div class="profile-avatar">👤</div>
    <div class="profile-name" id="user-name">불러오는 중...</div>
    <div class="profile-email" id="user-email"></div>
    <div class="grade-badge">👑 <span id="user-grade">VIP</span> 회원</div>
    <div class="point-card">
      <div>
        <div class="point-label">보유 포인트</div>
        <div class="point-val" id="user-point">0P</div>
      </div>
      <div style="font-size:.76rem;color:#999">구매금액 1% 적립</div>
    </div>
  </div>

  <!-- 메뉴 -->
  <div class="menu-section">
    <div class="menu-label">쇼핑</div>
    <div class="menu-item" onclick="go('../pages/orders.html')">
      <div class="menu-ico">📦</div>
      <div>
        <div class="menu-name">주문 내역</div>
        <div class="menu-sub">주문 현황 및 배송 조회</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/address.html')">
      <div class="menu-ico">📍</div>
      <div>
        <div class="menu-name">배송지 관리</div>
        <div class="menu-sub">배송지 추가·수정·삭제</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/subscribe.html')">
      <div class="menu-ico">🔄</div>
      <div>
        <div class="menu-name">정기배송 구독</div>
        <div class="menu-sub">매주 신선한 정육 배송</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>

    <div class="menu-label">고객센터</div>
    <div class="menu-item" onclick="go('../pages/cs.html')">
      <div class="menu-ico">💬</div>
      <div>
        <div class="menu-name">1:1 문의</div>
        <div class="menu-sub">주문·배송·상품 문의</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>
    <div class="menu-item" onclick="go('../pages/cs.html')">
      <div class="menu-ico">❓</div>
      <div>
        <div class="menu-name">자주 묻는 질문</div>
        <div class="menu-sub">FAQ 바로가기</div>
      </div>
      <div class="menu-arrow">›</div>
    </div>
  </div>

  <button class="logout-btn" onclick="doLogout()">로그아웃</button>

  <!-- 하단 네비 (흰 배경 + 골드 테두리) -->
  <nav class="mp-nav">
    <div class="mp-nav-item" onclick="go('../index.html')"><div class="mp-nav-ico">🏠</div><div class="mp-nav-lbl">홈</div></div>
    <div class="mp-nav-item" onclick="go('../pages/category.html')"><div class="mp-nav-ico">🥩</div><div class="mp-nav-lbl">정육</div></div>
    <div class="mp-nav-item" onclick="go('../pages/cart.html')"><div class="mp-nav-ico">🛒</div><div class="mp-nav-lbl">장바구니</div></div>
    <div class="mp-nav-item" onclick="go('../pages/orders.html')"><div class="mp-nav-ico">📦</div><div class="mp-nav-lbl">주문</div></div>
    <div class="mp-nav-item on"><div class="mp-nav-ico">👤</div><div class="mp-nav-lbl">마이</div></div>
  </nav>

</div>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API='https://meatmall.vercel.app/api';
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
Store.load(); showAdminBtn();
async function loadUser(){
  const token=localStorage.getItem('mm_access_token');
  if(!token){go('../login.html');return;}
  const cached=JSON.parse(localStorage.getItem('mm_user_cache')||'{}');
  if(cached.name){
    document.getElementById('user-name').textContent=cached.name;
    document.getElementById('user-email').textContent=cached.email||'';
    document.getElementById('user-grade').textContent=cached.grade||'VVIP';
    document.getElementById('user-point').textContent=fmt(cached.point||0)+'P';
  }
  try{
    const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token},credentials:'include'});
    if(r.ok){const d=await r.json();const u=d.user;
      document.getElementById('user-name').textContent=u.name;
      document.getElementById('user-email').textContent=u.email;
      document.getElementById('user-grade').textContent=u.grade||'VVIP';
      document.getElementById('user-point').textContent=fmt(u.point||0)+'P';
      localStorage.setItem('mm_user_cache',JSON.stringify(u));
    }
  }catch(e){}
}
function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  localStorage.removeItem('mm_access_token');
  localStorage.removeItem('mm_user_cache');
  sessionStorage.removeItem('mm_admin');
  go('../login.html');
}
loadUser();
</script>
</body>
</html>
