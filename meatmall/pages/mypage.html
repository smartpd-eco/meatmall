<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>마이페이지 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.app-wrap{background:var(--offwhite)}
.profile-hero{background:linear-gradient(160deg,#0f0f0f,#1a1208);border-bottom:2px solid var(--gold);padding:28px 20px 22px;text-align:center}
.p-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1a1208,#2a1a08);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 12px;box-shadow:0 0 0 4px rgba(201,168,76,.12)}
.p-name{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:3px}
.p-email{font-size:.78rem;color:rgba(255,255,255,.4);margin-bottom:10px}
.grade-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.15);border:1px solid var(--gold);border-radius:999px;padding:4px 14px;font-size:.74rem;font-weight:700;color:var(--gold)}
.pt-card{background:var(--white);border:1.5px solid var(--gold);border-radius:var(--r-md);padding:14px 16px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(201,168,76,.12)}
.pt-label{font-size:.74rem;color:var(--gray-txt);margin-bottom:3px}
.pt-val{font-size:1.5rem;font-weight:900;color:var(--gold)}
.menu-sec{padding:4px 0}
.menu-sec-label{font-size:.68rem;font-weight:700;color:var(--gray-txt);letter-spacing:.12em;padding:14px 16px 4px;text-transform:uppercase}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="hdr">
    <button class="hdr-btn" onclick="history.back()">←</button>
    <div class="hdr-logo" style="font-size:.82rem;position:absolute;left:52px;font-family:\'Noto Serif KR\',serif;color:var(--gold);letter-spacing:.04em" onclick="go(\'../index.html\')">정육본가</div>
    <div class="hdr-title">마이페이지</div>
    <button class="hdr-btn" id="admin-btn" onclick="go('../admin/dashboard.html')" style="display:none">⚙️</button>
  </header>

  <div class="profile-hero">
    <div class="p-avatar">👤</div>
    <div class="p-name" id="u-name">불러오는 중...</div>
    <div class="p-email" id="u-email"></div>
    <div class="grade-badge">👑 <span id="u-grade">VVIP</span> 회원</div>
    <div class="pt-card">
      <div><div class="pt-label">보유 포인트</div><div class="pt-val" id="u-point">0P</div></div>
      <div style="font-size:.76rem;color:var(--gray-txt)">구매금액 1% 적립</div>
    </div>
  </div>

  <div class="menu-sec">
    <div class="menu-sec-label">쇼핑</div>
    <div class="lt-menu" onclick="go('../pages/orders.html')" style="border-top:1.5px solid var(--gold)">
      <div class="lt-menu-ico">📦</div>
      <div><div class="lt-menu-name">주문 내역</div><div class="lt-menu-sub">주문 현황 및 배송 조회</div></div>
      <div class="lt-menu-arr">›</div>
    </div>
    <div class="lt-menu" onclick="go('../pages/address.html')">
      <div class="lt-menu-ico">📍</div>
      <div><div class="lt-menu-name">배송지 관리</div><div class="lt-menu-sub">배송지 추가·수정·삭제</div></div>
      <div class="lt-menu-arr">›</div>
    </div>
    <div class="lt-menu" onclick="go('../pages/subscribe.html')" style="border-bottom:1.5px solid var(--gold)">
      <div class="lt-menu-ico">🔄</div>
      <div><div class="lt-menu-name">정기배송 구독</div><div class="lt-menu-sub">매주 신선한 정육 배송</div></div>
      <div class="lt-menu-arr">›</div>
    </div>

    <div class="menu-sec-label">고객센터</div>
    <div class="lt-menu" onclick="go('../pages/cs.html')" style="border-top:1.5px solid var(--gold)">
      <div class="lt-menu-ico">💬</div>
      <div><div class="lt-menu-name">1:1 문의</div><div class="lt-menu-sub">주문·배송·상품 문의</div></div>
      <div class="lt-menu-arr">›</div>
    </div>
    <div class="lt-menu" onclick="go('../pages/cs.html')" style="border-bottom:1.5px solid var(--gold)">
      <div class="lt-menu-ico">❓</div>
      <div><div class="lt-menu-name">자주 묻는 질문</div><div class="lt-menu-sub">FAQ 바로가기</div></div>
      <div class="lt-menu-arr">›</div>
    </div>
  </div>

  <div style="padding:16px 14px">
    <button class="btn-danger" onclick="doLogout()">로그아웃</button>
  </div>
  <div style="height:8px"></div>

  <nav class="nav-lt">
    <div class="nav-i" onclick="go('../index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈</div></div>
    <div class="nav-i" onclick="go('../pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육</div></div>
    <div class="nav-i" onclick="go('../pages/cart.html')"><div class="nav-ico">🛒</div><div class="nav-lbl">장바구니</div></div>
    <div class="nav-i" onclick="go('../pages/orders.html')"><div class="nav-ico">📦</div><div class="nav-lbl">주문</div></div>
    <div class="nav-i on"><div class="nav-ico">👤</div><div class="nav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-wrap" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API='https://meatmall.vercel.app/api';
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
Store.load();showAdminBtn();
async function load(){
  const token=localStorage.getItem('mm_access_token');
  if(!token){go('../login.html');return}
  const c=JSON.parse(localStorage.getItem('mm_user_cache')||'{}');
  if(c.name){document.getElementById('u-name').textContent=c.name;document.getElementById('u-email').textContent=c.email||'';document.getElementById('u-grade').textContent=c.grade||'VVIP';document.getElementById('u-point').textContent=fmt(c.point||0)+'P'}
  try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token},credentials:'include'});
    if(r.ok){const d=await r.json();const u=d.user;
      document.getElementById('u-name').textContent=u.name;document.getElementById('u-email').textContent=u.email;
      document.getElementById('u-grade').textContent=u.grade||'VVIP';document.getElementById('u-point').textContent=fmt(u.point||0)+'P';
      localStorage.setItem('mm_user_cache',JSON.stringify(u))}}catch(e){}
}
function doLogout(){if(!confirm('로그아웃 하시겠습니까?'))return;localStorage.removeItem('mm_access_token');localStorage.removeItem('mm_user_cache');sessionStorage.removeItem('mm_admin');go('../login.html')}
load();
</script>
</body></html>
