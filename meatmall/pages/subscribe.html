<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>정기배송 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.app-wrap{background:var(--light-bg)}
.sub-hero{background:linear-gradient(160deg,#0f0f0f,#1a1208);border-bottom:2px solid var(--gold);padding:24px 20px}
.plan-card{background:var(--white);border:1.5px solid rgba(201,168,76,.3);border-radius:var(--r-md);padding:16px;margin:0 14px 10px;cursor:pointer;transition:all .2s}
.plan-card.on{border-color:var(--gold);background:#FFFBF2;box-shadow:0 2px 12px rgba(201,168,76,.15)}
.plan-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plan-name{font-size:.95rem;font-weight:700;color:var(--dark-txt)}
.plan-disc{background:var(--gold);color:var(--black);font-size:.72rem;font-weight:900;padding:3px 9px;border-radius:4px}
.plan-desc{font-size:.82rem;color:var(--mid-txt);line-height:1.6}
.feat-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--white);border-bottom:1px solid rgba(201,168,76,.12);font-size:.86rem;color:var(--dark-txt)}
.feat-ico{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="hdr">
    <button class="hdr-btn" onclick="history.back()">←</button>
    <div class="hdr-logo" style="font-size:.82rem;position:absolute;left:52px;font-family:\'Noto Serif KR\',serif;color:var(--gold);letter-spacing:.04em" onclick="go(\'../index.html\')">정육본가</div>
    <div class="hdr-title">정기배송</div>
    <div style="width:38px"></div>
  </header>

  <div class="sub-hero">
    <div style="font-size:.7rem;font-weight:700;color:var(--gold);letter-spacing:.1em;margin-bottom:8px">✦ 구독 서비스</div>
    <div style="font-family:var(--serif);font-size:1.15rem;color:#fff;margin-bottom:5px">매주 신선한 정육을<br>할인된 가격으로</div>
    <div style="font-size:.8rem;color:rgba(255,255,255,.4)">언제든 변경·일시정지·해지 가능</div>
  </div>

  <div style="padding:14px 14px 6px"><div style="font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:.08em">플랜 선택</div></div>

  <div class="plan-card on" id="plan-w" onclick="selPlan('w')">
    <div class="plan-head"><div class="plan-name">주간 배송</div><div style="display:flex;align-items:center;gap:8px"><span class="plan-disc">10% 할인</span><input type="radio" name="plan" checked style="accent-color:var(--gold);width:18px;height:18px"></div></div>
    <div class="plan-desc">매주 1회 · 월 4회 배송</div>
  </div>
  <div class="plan-card" id="plan-b" onclick="selPlan('b')">
    <div class="plan-head"><div class="plan-name">격주 배송</div><div style="display:flex;align-items:center;gap:8px"><span class="plan-disc">7% 할인</span><input type="radio" name="plan" style="accent-color:var(--gold);width:18px;height:18px"></div></div>
    <div class="plan-desc">2주마다 1회 · 월 2회 배송</div>
  </div>
  <div class="plan-card" id="plan-m" onclick="selPlan('m')">
    <div class="plan-head"><div class="plan-name">월간 배송</div><div style="display:flex;align-items:center;gap:8px"><span class="plan-disc">5% 할인</span><input type="radio" name="plan" style="accent-color:var(--gold);width:18px;height:18px"></div></div>
    <div class="plan-desc">매월 1회 · 대용량 구성</div>
  </div>

  <div style="background:var(--white);border-top:1.5px solid rgba(201,168,76,.3);border-bottom:1.5px solid rgba(201,168,76,.3);margin:8px 0">
    <div class="feat-row"><div class="feat-ico">💰</div><div>플랜별 5~10% 상시 할인</div></div>
    <div class="feat-row"><div class="feat-ico">🔪</div><div>주인장 이번 주 최선별 구성</div></div>
    <div class="feat-row"><div class="feat-ico">🚚</div><div>구독 회원 무료 배송</div></div>
    <div class="feat-row" style="border-bottom:none"><div class="feat-ico">⏸️</div><div>언제든 일시정지·해지 가능</div></div>
  </div>

  <div style="padding:14px">
    <button class="btn-gold" onclick="startSub()">구독 시작하기</button>
  </div>
  <div id="biz-footer"></div>
  <div style="height:70px"></div>

  <nav class="nav-lt">
    <div class="nav-i" onclick="go('../index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈</div></div>
    <div class="nav-i" onclick="go('../pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육</div></div>
    <div class="nav-i" onclick="go('../pages/cart.html')"><div class="nav-ico">🛒</div><div class="nav-lbl">장바구니</div></div>
    <div class="nav-i" onclick="go('../pages/orders.html')"><div class="nav-ico">📦</div><div class="nav-lbl">주문</div></div>
    <div class="nav-i on" onclick="go('../pages/mypage.html')"><div class="nav-ico">👤</div><div class="nav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-wrap" class="toast"></div>
<script src="../js/app.js"></script>
<script src="../js/footer.js"></script>
<script>
function go(u){window.location.href=u}
function toast(m){const t=document.getElementById('toast-wrap');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
Store.load();showAdminBtn();
let sel='w';
function selPlan(p){sel=p;['w','b','m'].forEach(id=>{document.getElementById('plan-'+id).classList.toggle('on',id===p);document.querySelector('#plan-'+id+' input').checked=id===p})}
function startSub(){if(!localStorage.getItem('mm_access_token')){toast('로그인이 필요합니다');setTimeout(()=>go('../login.html'),800);return}toast('구독 기능 준비 중입니다 👑')}
</script>
</body></html>
