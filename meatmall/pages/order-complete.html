<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>주문 완료 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.app-wrap{background:var(--offwhite)}
.complete-hero{background:linear-gradient(160deg,#0f0f0f,#1a1208);border-bottom:2px solid var(--gold);padding:40px 20px 30px;text-align:center}
.info-card{background:var(--white);border:1.5px solid var(--gold);border-radius:var(--r-md);margin:14px;overflow:hidden;box-shadow:0 2px 12px rgba(201,168,76,.1)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(201,168,76,.12);font-size:.86rem}
.info-row:last-child{border-bottom:none}
.info-key{color:var(--gray-txt)}
.info-val{font-weight:700;color:var(--dark-txt)}
.vb-box{background:#FFFBF2;border-top:1px solid rgba(201,168,76,.2);padding:14px 16px}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="hdr">
    <div style="width:38px"></div>
    <div class="hdr-title">주문 완료</div>
    <div style="width:38px"></div>
  </header>

  <div class="complete-hero">
    <div style="font-size:3.5rem;margin-bottom:16px" id="c-icon">✅</div>
    <div style="font-family:var(--serif);font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:8px" id="c-title">주문이 완료됐습니다!</div>
    <div style="font-size:.82rem;color:rgba(255,255,255,.45);line-height:1.7" id="c-sub">주인장이 직접 선별한 정육을 준비합니다</div>
  </div>

  <div class="info-card" id="order-info">
    <div class="info-row"><span class="info-key">주문번호</span><span class="info-val" id="oi-id">-</span></div>
    <div class="info-row"><span class="info-key">결제금액</span><span class="info-val" style="color:var(--gold)" id="oi-amt">-</span></div>
    <div class="info-row"><span class="info-key">포인트 적립</span><span class="info-val" id="oi-pt">-</span></div>
    <div class="info-row"><span class="info-key">예상 배송일</span><span class="info-val" id="oi-date">-</span></div>
  </div>

  <div style="display:flex;gap:10px;padding:0 14px">
    <button class="btn-outline-dark" style="flex:1" onclick="go('../pages/orders.html')">주문 내역</button>
    <button class="btn-gold" style="flex:1" onclick="go('../index.html')">쇼핑 계속</button>
  </div>

  <div style="height:70px"></div>
  <nav class="nav-lt">
    <div class="nav-i" onclick="go('../index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈</div></div>
    <div class="nav-i" onclick="go('../pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육</div></div>
    <div class="nav-i" onclick="go('../pages/cart.html')"><div class="nav-ico">🛒</div><div class="nav-lbl">장바구니</div></div>
    <div class="nav-i on" onclick="go('../pages/orders.html')"><div class="nav-ico">📦</div><div class="nav-lbl">주문</div></div>
    <div class="nav-i" onclick="go('../pages/mypage.html')"><div class="nav-ico">👤</div><div class="nav-lbl">마이</div></div>
  </nav>
</div>
<script src="../js/app.js"></script>
<script>
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
Store.load();showAdminBtn();
Store.cart=[]; Store.save(); updateCartBadge();
const p=new URLSearchParams(window.location.search);
const orderId=p.get('orderId')||'',amount=p.get('amount')||0,point=p.get('point')||0,isVbank=p.get('vbank')==='true';
document.getElementById('oi-id').textContent=orderId;
document.getElementById('oi-amt').textContent=fmt(amount)+'원';
if(isVbank){
  const bank=decodeURIComponent(p.get('bank')||'기업은행'),account=decodeURIComponent(p.get('account')||'123-456789-01-001'),holder=decodeURIComponent(p.get('holder')||'(주)정육본가'),deadline=decodeURIComponent(p.get('deadline')||'');
  document.getElementById('c-icon').textContent='🏦';
  document.getElementById('c-title').textContent='주문이 접수됐습니다';
  document.getElementById('c-sub').innerHTML='입금 확인 후 배송이 시작됩니다<br><strong style="color:var(--gold)">'+fmt(amount)+'원</strong>을 아래 계좌로 입금해주세요';
  document.getElementById('oi-pt').innerHTML='<span style="color:var(--gray-txt)">입금 확인 후 적립</span>';
  document.getElementById('oi-date').textContent='입금 확인 후 2일 이내';
  document.getElementById('order-info').innerHTML+=`<div class="vb-box"><div style="font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:8px">🏦 입금 계좌</div><div style="font-size:.86rem;color:var(--dark-txt);line-height:1.9"><span style="color:var(--gray-txt)">은행</span> <strong>${bank}</strong><br><span style="color:var(--gray-txt)">계좌</span> <strong>${account}</strong><br><span style="color:var(--gray-txt)">예금주</span> <strong>${holder}</strong><br><span style="color:var(--gray-txt)">기한</span> <strong style="color:#DC2626">${deadline} 까지</strong></div></div>`;
}else{
  document.getElementById('oi-pt').innerHTML='<span style="color:var(--gold)">+'+fmt(point)+'P 적립</span>';
  const d=new Date();d.setDate(d.getDate()+2);if(d.getDay()===0)d.setDate(d.getDate()+1);if(d.getDay()===6)d.setDate(d.getDate()+2);
  document.getElementById('oi-date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 (예정)';
}
</script>
</body></html>
