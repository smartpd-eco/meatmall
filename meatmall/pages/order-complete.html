<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 완료 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.complete-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:16px}
.complete-icon{font-size:5rem;animation:bounce .7s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.complete-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--dark)}
.order-info-box{background:var(--cream);border:1px solid var(--peach);border-radius:var(--radius-lg);padding:20px;width:100%;text-align:left}
.info-row{display:flex;justify-content:space-between;font-size:.88rem;padding:7px 0;border-bottom:1px solid var(--peach)}
.info-row:last-child{border-bottom:none}
.info-key{color:var(--gray-700)}
.info-val{font-weight:700;color:var(--dark)}
.point-badge{background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:var(--radius-full);margin-left:6px}
</style>
</head>
<body>
<div class="app-wrap">
<div class="complete-wrap">
  <div class="complete-icon">🎉</div>
  <div class="complete-title">결제가 완료됐습니다!</div>
  <p style="font-size:.9rem;color:var(--gray-500);line-height:1.7">
    주문이 접수됐습니다.<br>
    카카오 알림톡으로 배송 정보를 안내해드립니다.
  </p>

  <div class="order-info-box" id="order-info">
    <div class="info-row">
      <span class="info-key">주문번호</span>
      <span class="info-val" id="oi-id">-</span>
    </div>
    <div class="info-row">
      <span class="info-key">결제금액</span>
      <span class="info-val" id="oi-amt">-</span>
    </div>
    <div class="info-row">
      <span class="info-key">적립 포인트</span>
      <span class="info-val" id="oi-pt">-</span>
    </div>
    <div class="info-row">
      <span class="info-key">예상 배송일</span>
      <span class="info-val" id="oi-date">-</span>
    </div>
  </div>

  <button class="btn btn-primary btn-full btn-lg" onclick="go('../pages/mypage.html')">주문 내역 확인</button>
  <button class="btn btn-outline btn-full" onclick="go('../index.html')">쇼핑 계속하기</button>
</div>
</div>
<script>
function go(url) { window.location.href = url; }
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

const p = new URLSearchParams(window.location.search);
const orderId = p.get('orderId') || '';
const amount  = p.get('amount')  || 0;
const point   = p.get('point')   || 0;

document.getElementById('oi-id').textContent  = orderId;
document.getElementById('oi-amt').textContent = fmt(amount) + '원';
document.getElementById('oi-pt').innerHTML    = `<span style="color:var(--primary)">${fmt(point)}P</span> 적립`;

// 예상 배송일 (영업일 기준 +2일)
const d = new Date();
d.setDate(d.getDate() + 2);
if (d.getDay() === 0) d.setDate(d.getDate() + 1);
if (d.getDay() === 6) d.setDate(d.getDate() + 2);
document.getElementById('oi-date').textContent =
  `${d.getMonth()+1}월 ${d.getDate()}일 (예정)`;
</script>
</body>
</html>
