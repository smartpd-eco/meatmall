<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주문 완료 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:var(--onyx)!important}.app-wrap{background:var(--onyx)!important}

.complete-hero{
  padding:48px 20px 32px;text-align:center;
  background:linear-gradient(160deg,#0D0D0D,#1A1208 60%,#0D0D0D);
  border-bottom:2px solid var(--gold);
}
.complete-icon{font-size:3.5rem;margin-bottom:16px;display:block}
.complete-title{font-family:'Noto Serif KR',serif;font-size:1.3rem;font-weight:700;color:var(--txt-hi);margin-bottom:8px}
.complete-sub{font-size:.85rem;color:var(--txt-md);line-height:1.7}
.info-card{background:var(--charcoal);border:1px solid var(--line);border-radius:14px;margin:14px;overflow:hidden}
.info-row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.86rem}
.info-row:last-child{border-bottom:none}
.info-key{color:var(--txt-lo)}
.info-val{font-weight:700;color:var(--txt-hi)}
.action-btns{display:flex;gap:10px;padding:0 14px;margin-top:6px}
</style>
<script>window.addEventListener('pageshow',function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap";display:flex;flex-direction:column;min-height:100vh">
    <div style="background:linear-gradient(135deg,#0F0F0F,#1C1A12);border-bottom:1px solid rgba(201,168,76,.2);padding:6px 16px;display:flex;align-items:center;justify-content:center">
    <img src="../images/logo.png" alt="정육본가" style="height:34px;width:auto;object-fit:contain;display:block">
  </div>
<header class="dark-header">
    <div style="width:38px"></div>
    <div class="dh-title">주문 완료</div>
    <div style="width:38px"></div>
  </header>

  <div class="complete-hero">
    <span class="complete-icon" id="complete-icon">✅</span>
    <div class="complete-title" id="complete-title">주문이 완료됐습니다!</div>
    <div class="complete-sub" id="complete-sub">주인장이 직접 선별한 정육을 준비합니다</div>
  </div>

  <div class="info-card" id="order-info">
    <div class="info-row"><span class="info-key">주문번호</span><span class="info-val" id="oi-id">-</span></div>
    <div class="info-row"><span class="info-key">결제금액</span><span class="info-val" style="color:var(--gold)" id="oi-amt">-</span></div>
    <div class="info-row"><span class="info-key">포인트 적립</span><span class="info-val" id="oi-pt">-</span></div>
    <div class="info-row"><span class="info-key">예상 배송일</span><span class="info-val" id="oi-date">-</span></div>
  </div>

  <div class="action-btns">
    <button class="btn-dk-outline" style="flex:1" onclick="go('../pages/orders.html')">주문 내역</button>
    <button class="btn-gold" style="flex:1" onclick="go('../index.html')">쇼핑 계속</button>
  </div>

  <div style="height:76px"></div>
  <nav class="dark-nav">
    <div class="dnav-item" onclick="go('../index.html')"><div class="dnav-ico">🏠</div><div class="dnav-lbl">홈</div></div>
    <div class="dnav-item" onclick="go('../pages/category.html')"><div class="dnav-ico">🥩</div><div class="dnav-lbl">정육</div></div>
    <div class="dnav-item" onclick="go('../pages/cart.html')"><div class="dnav-ico">🛒</div><div class="dnav-lbl">장바구니</div></div>
    <div class="dnav-item" onclick="go('../pages/orders.html')"><div class="dnav-ico">📦</div><div class="dnav-lbl">주문</div></div>
    <div class="dnav-item on" onclick="go('../pages/mypage.html')"><div class="dnav-ico">👤</div><div class="dnav-lbl">마이</div></div>
  </nav>
</div>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
function go(u){window.location.href=u}
function fmt(n){return Number(n).toLocaleString('ko-KR')}
Store.load(); showAdminBtn();
const p=new URLSearchParams(window.location.search);
const orderId=p.get('orderId')||'';
const amount=p.get('amount')||0;
const point=p.get('point')||0;
const isVbank=p.get('vbank')==='true';
document.getElementById('oi-id').textContent=orderId;
document.getElementById('oi-amt').textContent=fmt(amount)+'원';
if(isVbank){
  const bank=decodeURIComponent(p.get('bank')||'기업은행');
  const account=decodeURIComponent(p.get('account')||'123-456789-01-001');
  const holder=decodeURIComponent(p.get('holder')||'(주)정육본가');
  const deadline=decodeURIComponent(p.get('deadline')||'');
  document.getElementById('complete-icon').textContent='🏦';
  document.getElementById('complete-title').textContent='주문이 접수됐습니다';
  document.getElementById('complete-sub').innerHTML='입금 확인 후 배송이 시작됩니다<br><strong style="color:var(--gold)">'+fmt(amount)+'원</strong>을 아래 계좌로 입금해주세요';
  document.getElementById('oi-pt').innerHTML='<span style="color:var(--txt-lo)">입금 확인 후 적립</span>';
  document.getElementById('oi-date').textContent='입금 확인 후 2일 이내';
  const info=document.getElementById('order-info');
  info.innerHTML+=`<div style="background:rgba(201,168,76,.08);border-top:1px solid var(--gold-bdr);padding:14px 16px">
    <div style="font-size:.78rem;font-weight:700;color:var(--gold);margin-bottom:8px;letter-spacing:.06em">🏦 입금 계좌</div>
    <div style="font-size:.88rem;color:var(--txt-hi);line-height:1.9">
      <span style="color:var(--txt-lo)">은행</span> <strong>${bank}</strong><br>
      <span style="color:var(--txt-lo)">계좌</span> <strong>${account}</strong><br>
      <span style="color:var(--txt-lo)">예금주</span> <strong>${holder}</strong><br>
      <span style="color:var(--txt-lo)">기한</span> <strong style="color:#F87171">${deadline} 까지</strong>
    </div>
  </div>`;
}else{
  document.getElementById('oi-pt').innerHTML='<span style="color:var(--gold)">+'+fmt(point)+'P 적립</span>';
  const d=new Date();d.setDate(d.getDate()+2);
  if(d.getDay()===0)d.setDate(d.getDate()+1);
  if(d.getDay()===6)d.setDate(d.getDate()+2);
  document.getElementById('oi-date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 (예정)';
}
</script>
</body>
</html>
