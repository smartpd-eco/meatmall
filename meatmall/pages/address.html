<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>배송지 관리 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.app-wrap{background:var(--light-bg)}
/* 배송지 저장 버튼: 압축 방지 + 큼직하게 */
#addr-sheet .btn-gold{height:58px;min-height:58px;flex:0 0 auto;flex-shrink:0;font-size:1.02rem}
.addr-card{background:var(--white);border:1.5px solid var(--gold);border-radius:var(--r-md);margin:8px 14px;overflow:hidden;box-shadow:0 2px 10px rgba(201,168,76,.1)}
.addr-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,#FFFBF2,#FFF6E0);border-bottom:1px solid rgba(201,168,76,.2)}
.addr-body{padding:11px 14px;font-size:.86rem;color:var(--mid-txt);line-height:1.7}
.addr-actions{display:flex;border-top:1px solid rgba(201,168,76,.15)}
.addr-action{flex:1;padding:10px;text-align:center;font-size:.8rem;font-weight:600;cursor:pointer;background:none;border:none;color:var(--mid-txt);transition:background .12s}
.addr-action:hover{background:rgba(201,168,76,.06)}
.addr-action:not(:last-child){border-right:1px solid rgba(201,168,76,.15)}
.default-badge{background:var(--gold);color:var(--black);font-size:.68rem;font-weight:900;padding:2px 8px;border-radius:999px;margin-left:7px}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 14px;height:52px;border:1.5px dashed rgba(201,168,76,.4);border-radius:var(--r-md);color:var(--gold);font-size:.9rem;font-weight:700;cursor:pointer;background:transparent;transition:all .15s}
.add-btn:hover{background:rgba(201,168,76,.06);border-color:var(--gold)}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap">
  <header class="hdr">
    <button class="hdr-btn" onclick="history.back()">←</button>
    <div class="hdr-logo" style="font-size:.82rem;position:absolute;left:52px;font-family:\'Noto Serif KR\',serif;color:var(--gold);letter-spacing:.04em" onclick="go(\'../index.html\')">정육본가</div>
    <div class="hdr-title">배송지 관리</div>
    <div style="width:38px"></div>
  </header>

  <div id="addr-list" style="padding:8px 0 8px">
    <div style="text-align:center;padding:40px;color:var(--gray-txt)">🔄 불러오는 중...</div>
  </div>
  <div class="add-btn" onclick="openForm()">+ 새 배송지 추가</div>
  <div style="height:70px"></div>

  <nav class="nav-lt">
    <div class="nav-i" onclick="go('../index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈</div></div>
    <div class="nav-i" onclick="go('../pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육</div></div>
    <div class="nav-i" onclick="go('../pages/cart.html')"><div class="nav-ico">🛒</div><div class="nav-lbl">장바구니</div></div>
    <div class="nav-i" onclick="go('../pages/orders.html')"><div class="nav-ico">📦</div><div class="nav-lbl">주문</div></div>
    <div class="nav-i on" onclick="go('../pages/mypage.html')"><div class="nav-ico">👤</div><div class="nav-lbl">마이</div></div>
  </nav>
</div>

<!-- 배송지 폼 시트 -->
<div class="overlay" id="ov" onclick="closeForm()"></div>
<div class="sheet" id="addr-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="form-title">새 배송지 추가</div>
    <span class="sheet-close" onclick="closeForm()">✕</span>
  </div>
  <div style="padding:16px;overflow-y:auto;max-height:68vh;display:flex;flex-direction:column;gap:12px">
    <div class="lf-group"><label class="lt-label">수령인 <span style="color:#DC2626">*</span></label><input class="lt-input" id="f-rec" placeholder="홍길동"></div>
    <div class="lf-group">
      <label class="lt-label">휴대폰 <span style="color:#DC2626">*</span></label>
      <div style="display:flex;gap:8px">
        <input class="lt-input" id="f-phone" type="tel" placeholder="010-0000-0000" oninput="fmtPhone(this)" style="flex:1">
        <button class="btn-gold-sm" id="send-btn" onclick="sendCode()" style="height:50px;white-space:nowrap">인증번호</button>
      </div>
      <div id="code-area" style="display:none;margin-top:8px">
        <div style="display:flex;gap:8px">
          <input class="lt-input" id="f-code" type="number" placeholder="인증번호 6자리" style="flex:1;height:44px">
          <button class="btn-gold-sm" onclick="verifyCode()" style="height:44px;white-space:nowrap">확인</button>
        </div>
        <div id="timer-txt" style="font-size:.78rem;color:var(--gold);font-weight:600;margin-top:4px"></div>
      </div>
      <div id="phone-ok" style="display:none;color:#15803D;font-size:.8rem;font-weight:600;margin-top:4px">✅ 인증 완료</div>
    </div>
    <div class="lf-group">
      <label class="lt-label">우편번호 <span style="color:#DC2626">*</span></label>
      <div style="display:flex;gap:8px">
        <input class="lt-input" id="f-zip" placeholder="우편번호" readonly style="flex:1">
        <button class="btn-gold-sm" onclick="searchAddr()" style="height:50px;white-space:nowrap">주소 검색</button>
      </div>
    </div>
    <div class="lf-group"><label class="lt-label">기본 주소</label><input class="lt-input" id="f-addr1" readonly placeholder="주소 검색 후 자동 입력"></div>
    <div class="lf-group"><label class="lt-label">상세 주소</label><input class="lt-input" id="f-addr2" placeholder="동, 호수 등"></div>
    <div class="lf-group">
      <label class="lt-label">배송 요청사항</label>
      <select class="lt-select" id="f-note" onchange="toggleNote(this)" style="height:50px">
        <option value="">선택 없음</option>
        <option>문 앞에 놓아주세요</option>
        <option>경비실에 맡겨주세요</option>
        <option>부재 시 연락주세요</option>
        <option>직접 입력</option>
      </select>
    </div>
    <div id="note-custom" style="display:none"><input class="lt-input" id="f-note-c" placeholder="직접 입력"></div>
    <label style="display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--dark-txt);cursor:pointer">
      <input type="checkbox" id="f-default" style="width:18px;height:18px;accent-color:var(--gold)">기본 배송지로 설정
    </label>
    <button class="btn-gold" onclick="saveAddr()">배송지 저장</button>
  </div>
</div>

<div id="toast-wrap" class="toast"></div>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="../js/app.js"></script>
<script>
const API = 'https://meatmall-server.vercel.app/api';
function go(u){window.location.href=u}
function toast(m){const t=document.getElementById('toast-wrap');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
function getToken(){return localStorage.getItem('mm_access_token')||null}
function authHeaders(extra={}){return{Authorization:'Bearer '+getToken(),'Content-Type':'application/json',...extra}}

let addrs=[],editingId=null,phoneOK=false,smsTimer=null;

// localStorage 미러링 — cart.html이 배송지 목록을 localStorage에서 읽으므로 동기화 유지
function syncLocal(){
  const mapped=addrs.map(a=>({
    id:a.id,recipient:a.recipient,phone:a.phone,
    zipCode:a.zip_code||a.zipCode,address1:a.address1,address2:a.address2||'',
    deliveryNote:a.delivery_note||a.deliveryNote||'',isDefault:a.is_default||a.isDefault||false
  }));
  localStorage.setItem('mm_addresses',JSON.stringify(mapped));
}

// ── GET /api/addresses ───────────────────────────────────
async function loadAddrs(){
  const token=getToken();
  if(!token){go('../login.html');return}
  document.getElementById('addr-list').innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-txt)">🔄 불러오는 중...</div>';
  try{
    const r=await fetch(API+'/addresses',{headers:{Authorization:'Bearer '+token},credentials:'include'});
    if(r.status===401){go('../login.html');return}
    if(!r.ok)throw new Error((await r.json()).error||'불러오기 실패');
    const d=await r.json();
    addrs=d.addresses||d||[];
    syncLocal();
    renderAddrs();
  }catch(e){
    document.getElementById('addr-list').innerHTML=`<div style="text-align:center;padding:52px 20px;color:var(--gray-txt)"><div style="font-size:3rem;margin-bottom:12px">📍</div><div>${e.message}</div><button onclick="loadAddrs()" style="margin-top:14px;padding:8px 20px;background:var(--gold);color:var(--black);border:none;border-radius:8px;font-weight:700;cursor:pointer">다시 시도</button></div>`;
  }
}

function renderAddrs(){
  const l=document.getElementById('addr-list');
  if(!addrs.length){l.innerHTML='<div style="text-align:center;padding:52px 20px;color:var(--gray-txt)"><div style="font-size:3rem;margin-bottom:12px">📍</div>등록된 배송지가 없습니다</div>';return}
  l.innerHTML=addrs.map(a=>{
    const isDefault=a.is_default||a.isDefault;
    const zip=a.zip_code||a.zipCode;
    const note=a.delivery_note||a.deliveryNote;
    return`<div class="addr-card">
    <div class="addr-head"><div style="display:flex;align-items:center"><span style="font-size:.92rem;font-weight:700;color:var(--dark-txt)">${a.recipient}</span>${isDefault?'<span class="default-badge">기본</span>':''}</div><span style="font-size:.78rem;color:var(--gray-txt)">${a.phone}</span></div>
    <div class="addr-body">[${zip||''}] ${a.address1} ${a.address2||''}${note?`<br><span style="color:var(--gold);font-size:.8rem">📝 ${note}</span>`:''}</div>
    <div class="addr-actions">${!isDefault?`<button class="addr-action" style="color:var(--gold)" onclick="setDef('${a.id}')">기본 설정</button>`:''}
    <button class="addr-action" style="color:var(--dark-txt)" onclick="editAddr('${a.id}')">수정</button>
    <button class="addr-action" style="color:#DC2626" onclick="delAddr('${a.id}')">삭제</button></div>
  </div>`;
  }).join('');
}

function openForm(id=null){
  editingId=id;phoneOK=false;
  document.getElementById('phone-ok').style.display='none';
  document.getElementById('code-area').style.display='none';
  document.getElementById('form-title').textContent=id?'배송지 수정':'새 배송지 추가';
  if(id){
    const a=addrs.find(x=>x.id===id);
    if(!a)return;
    document.getElementById('f-rec').value=a.recipient||'';
    document.getElementById('f-phone').value=a.phone||'';
    document.getElementById('f-zip').value=a.zip_code||a.zipCode||'';
    document.getElementById('f-addr1').value=a.address1||'';
    document.getElementById('f-addr2').value=a.address2||'';
    document.getElementById('f-default').checked=a.is_default||a.isDefault||false;
    const presets=['문 앞에 놓아주세요','경비실에 맡겨주세요','부재 시 연락주세요'];
    const note=a.delivery_note||a.deliveryNote||'';
    if(!note||presets.includes(note)){
      document.getElementById('f-note').value=note;
      document.getElementById('note-custom').style.display='none';
    }else{
      document.getElementById('f-note').value='직접 입력';
      document.getElementById('f-note-c').value=note;
      document.getElementById('note-custom').style.display='block';
    }
    phoneOK=true;document.getElementById('phone-ok').style.display='block';
  }else{
    ['f-rec','f-phone','f-zip','f-addr1','f-addr2'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-default').checked=false;
  }
  document.getElementById('ov').classList.add('open');
  document.getElementById('addr-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeForm(){document.getElementById('ov').classList.remove('open');document.getElementById('addr-sheet').classList.remove('open');document.body.style.overflow='';clearInterval(smsTimer)}
function searchAddr(){new daum.Postcode({oncomplete:function(d){document.getElementById('f-zip').value=d.zonecode;document.getElementById('f-addr1').value=d.roadAddress||d.jibunAddress;document.getElementById('f-addr2').focus()}}).open()}
function fmtPhone(el){let v=el.value.replace(/\D/g,'');if(v.length>3&&v.length<=7)v=v.slice(0,3)+'-'+v.slice(3);else if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);el.value=v;phoneOK=false;document.getElementById('phone-ok').style.display='none'}
function sendCode(){const ph=document.getElementById('f-phone').value;if(!ph||ph.replace(/\D/g,'').length<10){toast('올바른 번호를 입력해주세요');return}document.getElementById('code-area').style.display='block';document.getElementById('send-btn').textContent='재발송';toast('인증번호 발송 (테스트: 123456)');let t=180;clearInterval(smsTimer);smsTimer=setInterval(()=>{t--;const m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');document.getElementById('timer-txt').textContent=`${m}:${s} 남음`;if(t<=0){clearInterval(smsTimer);document.getElementById('timer-txt').textContent='시간 초과. 재발송하세요.'}},1000)}
function verifyCode(){if(document.getElementById('f-code').value==='123456'){phoneOK=true;clearInterval(smsTimer);document.getElementById('code-area').style.display='none';document.getElementById('phone-ok').style.display='block';toast('✅ 인증 완료')}else toast('❌ 인증번호가 틀렸습니다')}
function toggleNote(sel){document.getElementById('note-custom').style.display=sel.value==='직접 입력'?'block':'none'}

// ── POST /api/addresses · PUT /api/addresses/:id ────────
async function saveAddr(){
  const rec=document.getElementById('f-rec').value.trim();
  const ph=document.getElementById('f-phone').value.trim();
  const zip=document.getElementById('f-zip').value.trim();
  const a1=document.getElementById('f-addr1').value.trim();
  const a2=document.getElementById('f-addr2').value.trim();
  const isDef=document.getElementById('f-default').checked;
  const nv=document.getElementById('f-note').value;
  const note=nv==='직접 입력'?document.getElementById('f-note-c').value.trim():nv;
  if(!rec){toast('수령인 이름을 입력해주세요');return}
  if(!ph){toast('휴대폰 번호를 입력해주세요');return}
  if(!phoneOK){toast('휴대폰 인증을 완료해주세요');return}
  if(!zip||!a1){toast('주소를 검색해주세요');return}
  const payload={recipient:rec,phone:ph,zip_code:zip,address1:a1,address2:a2,delivery_note:note,is_default:isDef};
  const btn=document.querySelector('#addr-sheet .btn-gold');
  btn.disabled=true;btn.textContent='저장 중...';
  try{
    const url=editingId?`${API}/addresses/${editingId}`:`${API}/addresses`;
    const method=editingId?'PUT':'POST';
    const r=await fetch(url,{method,headers:authHeaders(),credentials:'include',body:JSON.stringify(payload)});
    if(!r.ok)throw new Error((await r.json()).error||'저장 실패');
    closeForm();
    await loadAddrs();
    toast(editingId?'배송지 수정됐습니다':'배송지 추가됐습니다');
  }catch(e){toast('❌ '+e.message)}
  finally{btn.disabled=false;btn.textContent='배송지 저장'}
}

// ── PUT /api/addresses/:id/default ──────────────────────
async function setDef(id){
  try{
    const r=await fetch(`${API}/addresses/${id}/default`,{method:'PUT',headers:authHeaders(),credentials:'include'});
    if(!r.ok)throw new Error((await r.json()).error||'설정 실패');
    await loadAddrs();
    toast('기본 배송지로 설정됐습니다');
  }catch(e){toast('❌ '+e.message)}
}

// ── DELETE /api/addresses/:id ────────────────────────────
async function delAddr(id){
  if(!confirm('삭제하시겠습니까?'))return;
  try{
    const r=await fetch(`${API}/addresses/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+getToken()},credentials:'include'});
    if(!r.ok)throw new Error((await r.json()).error||'삭제 실패');
    await loadAddrs();
    toast('삭제됐습니다');
  }catch(e){toast('❌ '+e.message)}
}

function editAddr(id){openForm(id)}
loadAddrs();
</script>
</body></html>
