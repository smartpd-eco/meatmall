<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>장바구니 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:var(--onyx)!important}.app-wrap{background:var(--onyx)!important}

.cart-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--charcoal)}
.cart-check input{width:20px;height:20px;accent-color:var(--primary);cursor:pointer;margin-top:26px}
.cart-thumb{width:72px;height:72px;border-radius:var(--radius-md);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex-shrink:0}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:.9rem;font-weight:600;color:var(--txt-hi);margin-bottom:2px}
.cart-option{font-size:.76rem;color:var(--gray-500);margin-bottom:8px}
.cart-price-row{display:flex;align-items:center;justify-content:space-between}
.cart-price{font-size:1rem;font-weight:800;color:var(--gold)}
.qty-control{display:flex;align-items:center}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--gray-300);background:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;font-weight:700}
.qty-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.qty-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.qty-val{width:36px;height:28px;border-top:1.5px solid var(--gray-300);border-bottom:1.5px solid var(--gray-300);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700}
.cart-del{color:var(--gray-400);font-size:1.1rem;cursor:pointer;padding:4px;align-self:flex-start}
.order-summary{background:var(--charcoal);padding:16px;border-top:8px solid var(--gray-100)}
.sum-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--gray-700);margin-bottom:8px}
.sum-total{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:800;color:var(--dark);padding-top:10px;border-top:1px solid var(--gray-200);margin-top:4px}
.checkout-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--gray-200);padding:12px 16px;z-index:200;padding-bottom:env(safe-area-inset-bottom,12px)}

/* 결제 시트 */
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pay-chip{padding:10px 4px;border:1.5px solid var(--line);border-radius:var(--radius-md);text-align:center;font-size:.8rem;font-weight:700;color:var(--txt-lo);cursor:pointer;transition:all .15s;background:var(--charcoal)}
.pay-chip.on{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}
.point-row{display:flex;gap:8px;align-items:center}
.point-inp{flex:1;height:40px;border:1.5px solid var(--gray-300);border-radius:var(--radius-md);padding:0 12px;font-size:.9rem;outline:none}
.point-inp:focus{border-color:var(--primary)}

/* 배송지 선택 */
.addr-select-box{background:rgba(0,0,0,.3);border-radius:var(--radius-md);padding:14px;cursor:pointer;border:1.5px solid var(--gray-200);transition:all .15s}
.addr-select-box:hover{border-color:var(--primary);background:var(--cream)}
.addr-select-box.selected{border-color:var(--gold)!important;background:rgba(201,168,76,.06)}
.addr-name-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}

/* 무통장 안내 */
.vbank-box{background:rgba(201,168,76,.06);border:1.5px solid var(--gold-bdr);border-radius:var(--radius-md);padding:14px;margin-top:8px}
.vbank-title{font-size:.88rem;font-weight:700;color:var(--gold);margin-bottom:10px}
.vbank-info{font-size:.84rem;color:var(--txt-md);line-height:1.9;margin-bottom:12px}
.vbank-account{background:rgba(0,0,0,.3);border-radius:var(--radius-sm);padding:10px 12px;font-size:.9rem;font-weight:700;color:var(--gold);margin-bottom:12px;border:1px solid #FED7AA;letter-spacing:.02em}

  /* dark-nav */
  .dark-nav{position:sticky;bottom:0;z-index:100;width:100%;height:62px;background:linear-gradient(0deg,#1C1A12,#0F0F0F);border-top:2px solid #C9A84C;display:flex;box-sizing:border-box;margin-top:auto}
  .dnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .dnav-ico{font-size:1.15rem;line-height:1}
  .dnav-lbl{font-size:.58rem;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.04em}
  .dnav-item.on .dnav-lbl{color:#C9A84C;font-weight:800}
  .dnav-item.on .dnav-ico{filter:drop-shadow(0 0 6px rgba(201,168,76,.7))}

</style>
<script>
// 뒤로가기 캐시(BFCache) 방지 - 뒤로가기 시 항상 새로고침
window.addEventListener('pageshow', function(e){
  if(e.persisted){ window.location.reload(); }
});
</script>
</head>
<body>
<div class="app-wrap";display:flex;flex-direction:column;min-height:100vh">
    <div style="background:linear-gradient(135deg,#0F0F0F,#1C1A12);border-bottom:1px solid rgba(201,168,76,.2);padding:6px 16px;display:flex;align-items:center;justify-content:center">
    <img src="../images/logo.png" alt="정육본가" style="height:34px;width:auto;object-fit:contain;display:block">
  </div>
<header class="dark-header">
    <button class="header__icon-btn" onclick="history.back()">←</button>
    <div style="font-size:1rem;font-weight:700">장바구니 <span id="cart-cnt" style="color:var(--gray-400);font-weight:400;font-size:.88rem"></span></div>
    <button style="font-size:.78rem;font-weight:700;color:var(--primary);background:none;border:none;cursor:pointer" onclick="toggleSelectAll()">전체선택</button>
  </header>

  <div id="cart-main" style="padding-bottom:130px"></div>

  <div class="checkout-bar" id="checkout-bar" style="display:none">
    <div style="font-size:.82rem;color:var(--gray-500);text-align:center;margin-bottom:8px">선택 상품 합계 <strong id="checkout-price" style="font-size:1rem;color:var(--primary)">0원</strong></div>
    <button class="btn btn-primary btn-full btn-lg" onclick="openCheckout()">결제하기</button>
  </div>
</div>

<!-- 결제 바텀시트 -->
<div class="overlay" id="pay-overlay" onclick="closePaySheet()"></div>
<div class="bottom-sheet" id="pay-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">결제하기</div>
    <span class="sheet-close" onclick="closePaySheet()">✕</span>
  </div>
  <div style="padding:16px;overflow-y:auto;max-height:72vh;display:flex;flex-direction:column;gap:16px">

    <!-- 테스트 모드 배너 -->
    <div id="test-mode-banner" style="display:none;background:var(--gold-dim);border:1px solid var(--gold-bdr);border-radius:var(--radius-md);padding:9px 12px;font-size:.8rem;color:var(--gold);font-weight:600">
      🧪 테스트 모드 — 실제 결제가 발생하지 않습니다
    </div>

    <!-- 배송지 선택 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        📍 배송지
        <button onclick="go('../pages/address.html')" style="font-size:.76rem;color:var(--primary);font-weight:600;background:none;border:none;cursor:pointer">+ 배송지 관리</button>
      </div>
      <div id="addr-list-sheet">
        <div style="text-align:center;padding:20px;color:var(--gray-400);font-size:.85rem;border:1.5px dashed var(--gray-300);border-radius:var(--radius-md)">
          등록된 배송지가 없습니다.<br>
          <button onclick="go('../pages/address.html')" class="btn btn-primary btn-sm" style="margin-top:10px">배송지 추가하기</button>
        </div>
      </div>
    </div>

    <!-- 결제수단 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:4px">💳 결제수단</div>
      <div class="pay-methods">
        <div class="pay-chip on" onclick="selPay(this,'CARD')">💳 카드</div>
        <div class="pay-chip" onclick="selPay(this,'KAKAO')">💬 카카오</div>
        <div class="pay-chip" onclick="selPay(this,'NAVER')">🟢 네이버</div>
        <div class="pay-chip" onclick="selPay(this,'TOSS')">🔵 토스</div>
        <div class="pay-chip" onclick="selPay(this,'VBANK')">🏦 무통장</div>
        <div class="pay-chip" onclick="selPay(this,'PHONE')">📱 휴대폰</div>
      </div>
    </div>

    <!-- 무통장 입금 정보 -->
    <div id="vbank-section" style="display:none">
      <div class="vbank-box">
        <div class="vbank-title">🏦 무통장 입금 안내</div>
        <div class="vbank-account" id="vbank-account-info">기업은행 123-456789-01-001 · 예금주: (주)정육본가</div>
        <div class="vbank-info">
          주문 후 <strong>3일 이내</strong> 입금해주세요.<br>
          미입금 시 자동으로 주문이 취소됩니다.
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label class="form-label" style="font-size:.82rem">입금자명 <span style="color:var(--red)">*</span></label>
          <input class="form-input" id="depositor-name" placeholder="입금하실 분의 이름" style="height:46px">
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:.82rem">입금 은행</label>
          <select class="form-input" id="bank-name" style="height:46px;font-size:.88rem">
            <option>기업은행</option><option>국민은행</option><option>신한은행</option>
            <option>우리은행</option><option>하나은행</option><option>농협은행</option>
            <option>카카오뱅크</option><option>토스뱅크</option><option>기타</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 포인트 사용 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:6px">
        💎 포인트 사용
        <span style="font-size:.76rem;font-weight:400;color:var(--secondary);margin-left:6px" id="avail-pt">보유: 0P</span>
      </div>
      <div class="point-row">
        <input class="point-inp" type="number" id="point-use" placeholder="0" min="0" oninput="calcFinal()">
        <button class="btn btn-sm btn-outline" onclick="useAllPoint()">전액사용</button>
      </div>
    </div>

    <!-- 금액 요약 -->
    <div style="background:rgba(0,0,0,.3);border-radius:var(--radius-md);padding:14px">
      <div class="sum-row"><span>상품금액</span><span id="sh-product">0원</span></div>
      <div class="sum-row"><span>배송비</span><span id="sh-delivery">0원</span></div>
      <div class="sum-row"><span>포인트 사용</span><span id="sh-point" style="color:var(--blue)">-0원</span></div>
      <div class="sum-total"><span>최종 결제금액</span><span style="color:var(--primary)" id="sh-final">0원</span></div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" id="pay-btn" onclick="doPay()">
      <span id="pay-btn-text">결제하기</span>
    </button>
    <p style="text-align:center;font-size:.76rem;color:var(--gray-400)">나이스페이먼츠 안전 결제 · SSL 암호화</p>
  </div>
</div>

<script src="https://pay.nicepay.co.kr/v1/js/"></script>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API = 'https://meatmall.vercel.app/api';
function go(url){ window.location.href=url; }
function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function toast(msg){
  const el=document.getElementById('toast-global');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

Store.load(); updateCartBadge();

// 결제 설정 API에서 동적 로드
let payConfig = {
  clientKey: 'test_ck_docs_Jz9BYo1zelvxd10pR0rl',
  isTest: true,
  vbank: { bank:'기업은행', account:'123-456789-01-001', holder:'(주)정육본가' },
  freeShipping: 50000, deliveryFee: 3500,
};
(async function loadConfig(){
  try {
    const r = await fetch(API+'/payment/config');
    if(r.ok){ const d=await r.json(); payConfig={...payConfig,...d}; }
    // 무통장 계좌 정보 업데이트
    const acc = document.getElementById('vbank-account-info');
    if(acc) acc.textContent=`${payConfig.vbank.bank} ${payConfig.vbank.account} · 예금주: ${payConfig.vbank.holder}`;
    // 테스트 모드 안내
    if(payConfig.isTest){
      const testBanner = document.getElementById('test-mode-banner');
      if(testBanner) testBanner.style.display='block';
    }
  } catch(e){}
})();

// 데모 장바구니
if(Store.cart.length===0){
  Store.cart=[
    {productId:'p1',emoji:'🥩',name:'국내산 한우 1++ 등심 (냉장)',option:'300g',price:28900,qty:1},
    {productId:'p2',emoji:'🐷',name:'제주 흑돼지 삼겹살 (냉장)',option:'500g',price:15900,qty:2},
    {productId:'p3',emoji:'🌭',name:'수제 프랑크소시지 PB',option:'200g×3',price:8900,qty:1},
  ];
}

let selected = new Set(Store.cart.map(c=>c.productId));
let payMethod = 'CARD';
let userPoint = 0;
let selectedAddr = null;

// 유저 포인트 로드
(async function(){
  const token=localStorage.getItem('mm_access_token');
  if(!token) return;
  try{
    const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}});
    if(r.ok){const d=await r.json();userPoint=d.user?.point||0;}
  }catch(e){}
})();

// 배송지 목록 로드 (localStorage)
function loadAddrSheet(){
  const addrs = JSON.parse(localStorage.getItem('mm_addresses')||'[]');
  const wrap = document.getElementById('addr-list-sheet');
  if(addrs.length===0){
    wrap.innerHTML=`
    <div style="text-align:center;padding:16px;color:var(--gray-400);font-size:.85rem;border:1.5px dashed var(--gray-300);border-radius:var(--radius-md)">
      등록된 배송지가 없습니다.
      <button onclick="go('../pages/address.html')" class="btn btn-primary btn-sm" style="margin-top:10px;display:block;width:100%">배송지 추가하기</button>
    </div>`;
    selectedAddr=null; return;
  }
  // 기본 배송지 자동 선택 (인덱스 기반)
  let defaultIdx = addrs.findIndex(a=>a.isDefault);
  if(defaultIdx < 0) defaultIdx = 0;
  selectedAddr = addrs[defaultIdx];

  wrap.innerHTML = addrs.map((a,i)=>`
  <div class="addr-select-box ${i===defaultIdx?'selected':''}" id="addr-item-${i}" onclick="selectAddr(${i})" style="margin-bottom:8px">
    <div class="addr-name-row">
      <span style="font-size:.9rem;font-weight:700;color:var(--dark)">${a.recipient}</span>
      <span style="font-size:.78rem;color:var(--gray-500)">${a.phone}</span>
    </div>
    <div style="font-size:.82rem;color:var(--gray-700)">[${a.zipCode}] ${a.address1} ${a.address2||''}</div>
    ${a.deliveryNote?`<div style="font-size:.76rem;color:var(--secondary);margin-top:3px">📝 ${a.deliveryNote}</div>`:''}
    ${i===defaultIdx?'<div style="font-size:.72rem;color:var(--primary);font-weight:700;margin-top:4px">✓ 선택됨</div>':''}
  </div>`).join('');
}

function selectAddr(i){
  const addrs=JSON.parse(localStorage.getItem('mm_addresses')||'[]');
  selectedAddr=addrs[i];
  // 시각적 선택 표시
  document.querySelectorAll('.addr-select-box').forEach((el,j)=>{
    el.classList.toggle('selected',j===i);
    // 선택됨 표시 업데이트
    const tick = el.querySelector('.addr-tick');
    if(tick) tick.style.display = j===i ? 'block' : 'none';
  });
  // 재렌더링으로 선택됨 표시
  loadAddrSheet();
}

function renderCart(){
  const selItems=Store.cart.filter(c=>selected.has(c.productId));
  const selTotal=selItems.reduce((s,c)=>s+c.price*c.qty,0);
  const delivery=selTotal>=50000?0:(selTotal>0?3500:0);
  document.getElementById('cart-cnt').textContent=`(${Store.cart.length}개)`;

  if(Store.cart.length===0){
    document.getElementById('cart-main').innerHTML=`
    <div style="text-align:center;padding:80px 24px;color:var(--gray-400)">
      <div style="font-size:3.5rem;margin-bottom:16px">🛒</div>
      <div style="font-size:.9rem;margin-bottom:20px">장바구니가 비어있습니다</div>
      <button class="btn btn-primary" onclick="go('../index.html')">쇼핑 계속하기</button>
    </div>`;
    document.getElementById('checkout-bar').style.display='none';
    return;
  }

  document.getElementById('cart-main').innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--gray-100)">
    <label style="display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;cursor:pointer">
      <input type="checkbox" id="all-chk" ${selected.size===Store.cart.length?'checked':''} style="width:18px;height:18px;accent-color:var(--primary)" onchange="toggleAll(this.checked)">
      전체선택 (${selected.size}/${Store.cart.length})
    </label>
    <span style="font-size:.8rem;color:var(--red);cursor:pointer;font-weight:600" onclick="deleteSel()">선택 삭제</span>
  </div>
  ${Store.cart.map(c=>`
  <div class="cart-item">
    <div class="cart-check"><input type="checkbox" ${selected.has(c.productId)?'checked':''} style="width:20px;height:20px;accent-color:var(--primary)" onchange="toggleItem('${c.productId}',this.checked)"></div>
    <div class="cart-thumb">${c.emoji||'🥩'}</div>
    <div class="cart-info">
      <div class="cart-name">${c.name}</div>
      <div class="cart-option">옵션: ${c.option}</div>
      <div class="cart-price-row">
        <div class="qty-control">
          <div class="qty-btn" onclick="changeQty('${c.productId}',-1)">−</div>
          <div class="qty-val">${c.qty}</div>
          <div class="qty-btn" onclick="changeQty('${c.productId}',+1)">+</div>
        </div>
        <div class="cart-price">${fmt(c.price*c.qty)}원</div>
      </div>
    </div>
    <div class="cart-del" onclick="removeItem('${c.productId}')">✕</div>
  </div>`).join('')}
  ${selTotal>0&&selTotal<50000?`<div style="padding:12px 16px;background:#FFFBF5;font-size:.82rem;color:var(--secondary)">🚚 <strong>${fmt(50000-selTotal)}원</strong> 더 담으면 무료배송!</div>`:selTotal>=50000?`<div style="padding:12px 16px;background:var(--green-light);font-size:.82rem;color:var(--green);font-weight:700">✅ 무료배송 혜택 적용!</div>`:''}
  <div class="order-summary">
    <div class="sum-row"><span>상품금액 (${selItems.length}개)</span><span>${fmt(selTotal)}원</span></div>
    <div class="sum-row"><span>배송비</span><span>${delivery===0?'<span style="color:var(--green)">무료</span>':fmt(delivery)+'원'}</span></div>
    <div class="sum-total"><span>결제 예정금액</span><span style="color:var(--primary)">${fmt(selTotal+delivery)}원</span></div>
  </div>`;

  const bar=document.getElementById('checkout-bar');
  if(selItems.length>0){
    bar.style.display='block';
    document.getElementById('checkout-price').textContent=fmt(selTotal+delivery)+'원';
  } else bar.style.display='none';

  document.getElementById('sh-product').textContent=fmt(selTotal)+'원';
  document.getElementById('sh-delivery').textContent=delivery===0?'무료':fmt(delivery)+'원';
  calcFinal();
}

function toggleAll(c){ if(c) Store.cart.forEach(x=>selected.add(x.productId)); else selected.clear(); renderCart(); }
function toggleItem(pid,c){ c?selected.add(pid):selected.delete(pid); renderCart(); }
function toggleSelectAll(){ selected.size===Store.cart.length?selected.clear():Store.cart.forEach(c=>selected.add(c.productId)); renderCart(); }
function changeQty(pid,d){ const i=Store.cart.findIndex(c=>c.productId===pid); if(i>-1){Store.cart[i].qty=Math.max(1,Store.cart[i].qty+d);Store.save();renderCart();} }
function removeItem(pid){ Store.cart=Store.cart.filter(c=>c.productId!==pid);selected.delete(pid);Store.save();renderCart();updateCartBadge(); }
function deleteSel(){ Store.cart=Store.cart.filter(c=>!selected.has(c.productId));selected.clear();Store.save();renderCart();updateCartBadge(); }

// 결제 시트
function openCheckout(){
  // 매번 최신 배송지 다시 로드
  selectedAddr = null;
  if(!localStorage.getItem('mm_access_token')){ toast('로그인이 필요합니다');go('../login.html');return; }
  document.getElementById('avail-pt').textContent=`보유: ${fmt(userPoint)}P`;
  loadAddrSheet();
  document.getElementById('pay-overlay').classList.add('open');
  document.getElementById('pay-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePaySheet(){
  document.getElementById('pay-overlay').classList.remove('open');
  document.getElementById('pay-sheet').classList.remove('open');
  document.body.style.overflow='';
}

function selPay(el,method){
  document.querySelectorAll('.pay-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on'); payMethod=method;
  document.getElementById('vbank-section').style.display=method==='VBANK'?'block':'none';
}

function useAllPoint(){
  const selItems=Store.cart.filter(c=>selected.has(c.productId));
  const selTotal=selItems.reduce((s,c)=>s+c.price*c.qty,0);
  const delivery=selTotal>=50000?0:3500;
  document.getElementById('point-use').value=Math.max(0,Math.min(userPoint,selTotal+delivery-100));
  calcFinal();
}

function calcFinal(){
  const selItems=Store.cart.filter(c=>selected.has(c.productId));
  const selTotal=selItems.reduce((s,c)=>s+c.price*c.qty,0);
  const delivery=selTotal>=50000?0:3500;
  const pt=Math.min(Number(document.getElementById('point-use').value)||0,userPoint,selTotal+delivery-100);
  const final=Math.max(0,selTotal+delivery-pt);
  document.getElementById('sh-point').textContent=`-${fmt(pt)}원`;
  document.getElementById('sh-final').textContent=fmt(final)+'원';
  document.getElementById('pay-btn-text').textContent=`${fmt(final)}원 결제하기`;
}

async function doPay(){
  // 배송지 재확인
  const freshAddrs = JSON.parse(localStorage.getItem('mm_addresses')||'[]');
  if(!selectedAddr || freshAddrs.length === 0){
    toast('배송지를 먼저 추가해주세요');
    closePaySheet();
    setTimeout(()=>go('../pages/address.html'), 500);
    return;
  }

  // 무통장 입금자명 확인
  if(payMethod==='VBANK'){
    const depName=document.getElementById('depositor-name')?.value?.trim();
    if(!depName){
      toast('입금자명을 입력해주세요');
      document.getElementById('depositor-name')?.focus();
      return;
    }
  }

  const selItems=Store.cart.filter(c=>selected.has(c.productId));
  if(!selItems.length){ toast('상품을 선택해주세요'); return; }

  const pt=Number(document.getElementById('point-use').value)||0;
  const token=localStorage.getItem('mm_access_token');

  const btn=document.getElementById('pay-btn');
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';

  try {
    const readyRes=await fetch(API+'/payment/ready',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      credentials:'include',
      body:JSON.stringify({
        items:selItems.map(i=>({productId:i.productId,name:i.name,price:i.price,qty:i.qty,option:i.option})),
        recipient:    selectedAddr.recipient,
        phone:        selectedAddr.phone,
        zipCode:      selectedAddr.zipCode,
        address1:     selectedAddr.address1,
        address2:     selectedAddr.address2||'',
        deliveryNote: selectedAddr.deliveryNote||'',
        pointUse:     pt,
        paymentMethod:payMethod,
        depositorName:payMethod==='VBANK'?document.getElementById('depositor-name').value.trim():null,
        bankName:     payMethod==='VBANK'?document.getElementById('bank-name').value:null,
      })
    });
    const readyData=await readyRes.json();
    if(!readyRes.ok) throw new Error(readyData.error||'주문 생성 실패');

    const {order,nice}=readyData;

    // 무통장: 결제창 없이 바로 완료
    if(order.isVbank){
      selItems.forEach(i=>{Store.cart=Store.cart.filter(c=>c.productId!==i.productId);});
      Store.save(); updateCartBadge();
      const bi=order.bankInfo||{};
      window.location.href=`../pages/order-complete.html?orderId=${order.orderId}&amount=${order.amount}&point=0&vbank=true&bank=${encodeURIComponent(bi.bank||'기업은행')}&account=${encodeURIComponent(bi.account||'123-456789-01-001')}&holder=${encodeURIComponent(bi.holder||'(주)정육본가')}&deadline=${encodeURIComponent(bi.deadline||'')}`;
      return;
    }

    // 카드/간편결제: 나이스 결제창
    AUTHNICE.requestPay({
      clientId: nice.clientKey,
      method:   payMethod==='CARD'?'card':payMethod==='KAKAO'?'kakao':payMethod==='NAVER'?'naverpay':payMethod==='TOSS'?'tosspay':'cellphone',
      orderId:  order.orderId,
      amount:   order.amount,
      goodsName:order.orderName,
      returnUrl:`https://meatmall.vercel.app/api/payment/nice-callback`,
      fnError: function(r){
        btn.disabled=false; btn.innerHTML='<span id="pay-btn-text">결제하기</span>';
        toast('결제 실패: '+(r.errorMsg||'알 수 없는 오류'));
      },
      fnSuccess: async function(r){
        try{
          const cr=await fetch(API+'/payment/confirm',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            credentials:'include',
            body:JSON.stringify({paymentKey:r.tid||r.paymentKey,orderId:order.orderId,amount:order.amount})
          });
          const cd=await cr.json();
          if(!cr.ok) throw new Error(cd.error);
          selItems.forEach(i=>{Store.cart=Store.cart.filter(c=>c.productId!==i.productId);});
          Store.save(); updateCartBadge();
          window.location.href=`../pages/order-complete.html?orderId=${order.orderId}&amount=${order.amount}&point=${cd.pointEarned||0}`;
        }catch(e){ toast('결제 검증 실패: '+e.message); btn.disabled=false; btn.innerHTML='<span id="pay-btn-text">결제하기</span>'; }
      }
    });
  }catch(err){
    toast(err.message||'오류가 발생했습니다');
    btn.disabled=false; btn.innerHTML='<span id="pay-btn-text">결제하기</span>';
  }
}

renderCart();
</script>
</body>
