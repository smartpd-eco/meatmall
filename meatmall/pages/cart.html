<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>장바구니 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<!-- 나이스페이먼츠 SDK -->
<script src="https://pay.nicepay.co.kr/v1/js/"></script>
<style>
.cart-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--gray-100);background:var(--white)}
.cart-check{display:flex;align-items:center}
.cart-check input{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.cart-thumb{width:72px;height:72px;border-radius:var(--radius-md);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex-shrink:0}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:.9rem;font-weight:600;color:var(--dark);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-option{font-size:.76rem;color:var(--gray-500);margin-bottom:8px}
.cart-price-row{display:flex;align-items:center;justify-content:space-between}
.cart-price{font-size:1rem;font-weight:800;color:var(--primary)}
.qty-control{display:flex;align-items:center}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--gray-300);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;font-weight:700;color:var(--gray-700)}
.qty-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.qty-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.qty-val{width:36px;height:28px;border-top:1.5px solid var(--gray-300);border-bottom:1.5px solid var(--gray-300);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:700}
.cart-del{color:var(--gray-400);font-size:1.2rem;cursor:pointer;padding:4px;align-self:flex-start;margin-left:4px}

.order-summary{background:var(--white);padding:16px;border-top:8px solid var(--gray-100)}
.sum-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--gray-700);margin-bottom:8px}
.sum-total{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:800;color:var(--dark);padding-top:10px;border-top:1px solid var(--gray-200);margin-top:4px}
.sum-total .price{color:var(--primary);font-size:1.1rem}

/* 결제수단 선택 */
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pay-chip{padding:10px 4px;border:1.5px solid var(--gray-300);border-radius:var(--radius-md);text-align:center;font-size:.8rem;font-weight:700;color:var(--gray-700);cursor:pointer;transition:all .15s}
.pay-chip.on{border-color:var(--primary);background:var(--cream);color:var(--primary)}
.pay-chip:active{transform:scale(.95)}

/* 배송지 */
.addr-box{background:var(--gray-100);border-radius:var(--radius-md);padding:14px;font-size:.85rem;line-height:1.7;cursor:pointer}
.addr-name{font-weight:700;color:var(--dark);margin-bottom:2px}
.addr-detail{color:var(--gray-700)}

/* 고정 하단 */
.checkout-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-top:1px solid var(--gray-200);padding:12px 16px;z-index:200;padding-bottom:env(safe-area-inset-bottom,12px)}
.checkout-info{font-size:.82rem;color:var(--gray-500);text-align:center;margin-bottom:8px}
.checkout-info strong{color:var(--primary);font-size:1rem;font-weight:800}

.empty-cart{text-align:center;padding:80px 24px}
.empty-cart .icon{font-size:4rem;margin-bottom:16px}
.empty-cart p{font-size:.9rem;color:var(--gray-500);margin-bottom:24px}

/* 포인트 입력 */
.point-row{display:flex;gap:8px;align-items:center}
.point-inp{flex:1;height:40px;border:1.5px solid var(--gray-300);border-radius:var(--radius-md);padding:0 12px;font-size:.9rem;outline:none}
.point-inp:focus{border-color:var(--primary)}
</style>
</head>
<body>
<div class="app-wrap">

  <header class="header">
    <button class="header__icon-btn" onclick="history.back()">←</button>
    <div style="font-size:1rem;font-weight:700">장바구니 <span id="cart-cnt" style="color:var(--gray-400);font-weight:400;font-size:.88rem"></span></div>
    <button class="header__icon-btn" id="admin-btn" onclick="go('../admin/dashboard.html')" style="display:none;margin-right:4px" title="관리자">⚙️</button><button style="font-size:.78rem;font-weight:700;color:var(--primary);background:none;border:none;cursor:pointer" onclick="toggleSelectAll()">전체선택</button>
  </header>

  <div id="cart-main" style="padding-bottom:130px"></div>

  <!-- 고정 결제 버튼 -->
  <div class="checkout-bar" id="checkout-bar" style="display:none">
    <div class="checkout-info">선택 상품 합계 <strong id="checkout-price">0원</strong></div>
    <button class="btn btn-primary btn-full btn-lg" id="checkout-btn" onclick="openCheckout()">결제하기</button>
  </div>

</div>

<!-- 결제 바텀시트 -->
<div class="overlay" id="pay-overlay" onclick="closePaySheet()"></div>
<div class="bottom-sheet" id="pay-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">결제하기</div>
    <span class="sheet-close" onclick="closePaySheet()">✕</span>
  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto">

    <!-- 배송지 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:8px">📍 배송지</div>
      <div class="addr-box" onclick="changeAddr()">
        <div class="addr-name" id="addr-name">배송지를 선택해주세요</div>
        <div class="addr-detail" id="addr-detail">+ 배송지 추가</div>
      </div>
    </div>

    <!-- 결제수단 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:8px">💳 결제수단</div>
      <div class="pay-methods">
        <div class="pay-chip on" onclick="selPay(this,'CARD')" data-method="CARD">💳 카드</div>
        <div class="pay-chip" onclick="selPay(this,'KAKAO')" data-method="KAKAO">💬 카카오</div>
        <div class="pay-chip" onclick="selPay(this,'NAVER')" data-method="NAVER">🟢 네이버</div>
        <div class="pay-chip" onclick="selPay(this,'TOSS')" data-method="TOSS">🔵 토스</div>
        <div class="pay-chip" onclick="selPay(this,'VBANK')" data-method="VBANK">🏦 무통장</div>
        <div class="pay-chip" onclick="selPay(this,'PHONE')" data-method="PHONE">📱 휴대폰</div>
      </div>
    </div>

    <!-- 포인트 -->
    <div>
      <div style="font-size:.88rem;font-weight:700;color:var(--dark);margin-bottom:6px">
        💎 포인트 사용
        <span style="font-size:.76rem;font-weight:400;color:var(--secondary);margin-left:6px" id="avail-pt">보유: 0P</span>
      </div>
      <div class="point-row">
        <input class="point-inp" type="number" id="point-use" placeholder="0" min="0" oninput="calcFinal()">
        <button class="btn btn-sm btn-outline" onclick="useAllPoint()">전액사용</button>
      </div>
    </div>

    <!-- 최종 금액 -->
    <div style="background:var(--gray-100);border-radius:var(--radius-md);padding:14px">
      <div class="sum-row"><span>상품금액</span><span id="sh-product">0원</span></div>
      <div class="sum-row"><span>배송비</span><span id="sh-delivery">0원</span></div>
      <div class="sum-row"><span>포인트 사용</span><span id="sh-point" style="color:var(--blue)">-0원</span></div>
      <div class="sum-total"><span>최종 결제금액</span><span class="price" id="sh-final">0원</span></div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" id="pay-btn" onclick="doPay()">
      <span id="pay-btn-text">결제하기</span>
    </button>
    <p style="text-align:center;font-size:.76rem;color:var(--gray-400)">
      나이스페이먼츠 안전 결제 · SSL 암호화
    </p>
  </div>
</div>

<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API = 'https://meatmall.vercel.app/api';
function go(url) { window.location.href = url; }
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
function toast(msg) {
  const el = document.getElementById('toast-global');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'),2200);
}

Store.load();
updateCartBadge();

// 데모 장바구니 (실제 상품 페이지 구현 후 연동)
if (Store.cart.length === 0) {
  Store.cart = [
    { productId:'p1', emoji:'🥩', name:'국내산 한우 1++ 등심 (냉장)', option:'300g', price:28900, qty:1 },
    { productId:'p2', emoji:'🥓', name:'제주 흑돼지 삼겹살 (냉장)', option:'500g', price:15900, qty:2 },
    { productId:'p3', emoji:'🌭', name:'수제 프랑크소시지 PB', option:'200g×3', price:8900, qty:1 },
  ];
}

let selected = new Set(Store.cart.map(c => c.productId));
let payMethod = 'CARD';
let userPoint = 0;

// 유저 포인트 로드
(async function loadPoint() {
  const token = localStorage.getItem('mm_access_token');
  if (!token) return;
  try {
    const r = await fetch(API + '/auth/me', { headers:{ Authorization:'Bearer '+token } });
    if (r.ok) { const d = await r.json(); userPoint = d.user?.point || 0; }
  } catch(e) {}
})();

function renderCart() {
  const selItems = Store.cart.filter(c => selected.has(c.productId));
  const selTotal = selItems.reduce((s,c) => s + c.price * c.qty, 0);
  const delivery = selTotal >= 50000 ? 0 : (selTotal > 0 ? 3500 : 0);
  document.getElementById('cart-cnt').textContent = `(${Store.cart.length}개)`;

  if (Store.cart.length === 0) {
    document.getElementById('cart-main').innerHTML = `
    <div class="empty-cart">
      <div class="icon">🛒</div>
      <p>장바구니가 비어있습니다<br>마음에 드는 상품을 담아보세요!</p>
      <button class="btn btn-primary" onclick="go('../index.html')">쇼핑 계속하기</button>
    </div>`;
    document.getElementById('checkout-bar').style.display = 'none';
    return;
  }

  document.getElementById('cart-main').innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--gray-100)">
    <label style="display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;cursor:pointer">
      <input type="checkbox" id="all-chk" ${selected.size===Store.cart.length?'checked':''} style="width:18px;height:18px;accent-color:var(--primary)" onchange="toggleAll(this.checked)">
      전체 선택 (${selected.size}/${Store.cart.length})
    </label>
    <span style="font-size:.8rem;color:var(--red);cursor:pointer;font-weight:600" onclick="deleteSel()">선택 삭제</span>
  </div>
  ${Store.cart.map(c => `
  <div class="cart-item">
    <div class="cart-check">
      <input type="checkbox" ${selected.has(c.productId)?'checked':''} style="width:20px;height:20px;accent-color:var(--primary)"
        onchange="toggleItem('${c.productId}',this.checked)">
    </div>
    <div class="cart-thumb">${c.emoji||'🥩'}</div>
    <div class="cart-info">
      <div class="cart-name">${c.name}</div>
      <div class="cart-option">옵션: ${c.option}</div>
      <div class="cart-price-row">
        <div class="qty-control">
          <div class="qty-btn" onclick="changeQty('${c.productId}',-1)">−</div>
          <div class="qty-val">${c.qty}</div>
          <div class="qty-btn" onclick="changeQty('${c.productId}',+1)">+</div>
        </div>
        <div class="cart-price">${fmt(c.price * c.qty)}원</div>
      </div>
    </div>
    <div class="cart-del" onclick="removeItem('${c.productId}')">✕</div>
  </div>`).join('')}
  ${selTotal > 0 && selTotal < 50000 ? `
  <div style="padding:12px 16px;background:#FFFBF5;border-top:1px solid var(--peach);font-size:.82rem;color:var(--secondary)">
    🚚 <strong>${fmt(50000-selTotal)}원</strong> 더 담으면 무료배송!
  </div>` : selTotal >= 50000 ? `
  <div style="padding:12px 16px;background:var(--green-light);font-size:.82rem;color:var(--green);font-weight:700">✅ 무료배송 혜택 적용!</div>` : ''}
  <div class="order-summary">
    <div class="sum-row"><span>상품금액 (${selItems.length}개)</span><span>${fmt(selTotal)}원</span></div>
    <div class="sum-row"><span>배송비</span><span>${delivery===0?'<span style="color:var(--green)">무료</span>':fmt(delivery)+'원'}</span></div>
    <div class="sum-total"><span>결제 예정금액</span><span class="price">${fmt(selTotal+delivery)}원</span></div>
  </div>`;

  // 결제 바
  const bar = document.getElementById('checkout-bar');
  if (selItems.length > 0) {
    bar.style.display = 'block';
    document.getElementById('checkout-price').textContent = fmt(selTotal+delivery)+'원';
  } else {
    bar.style.display = 'none';
  }

  // 시트 금액 업데이트
  document.getElementById('sh-product').textContent = fmt(selTotal)+'원';
  document.getElementById('sh-delivery').textContent = delivery===0?'무료':fmt(delivery)+'원';
  calcFinal();
}

function toggleAll(checked) {
  if (checked) Store.cart.forEach(c => selected.add(c.productId));
  else selected.clear();
  renderCart();
}
function toggleItem(pid, checked) { checked ? selected.add(pid) : selected.delete(pid); renderCart(); }
function toggleSelectAll() {
  if (selected.size === Store.cart.length) selected.clear();
  else Store.cart.forEach(c => selected.add(c.productId));
  renderCart();
}
function changeQty(pid, d) {
  const i = Store.cart.findIndex(c => c.productId===pid);
  if (i>-1) { Store.cart[i].qty = Math.max(1, Store.cart[i].qty+d); Store.save(); renderCart(); }
}
function removeItem(pid) { Store.cart = Store.cart.filter(c=>c.productId!==pid); selected.delete(pid); Store.save(); renderCart(); updateCartBadge(); }
function deleteSel() { Store.cart = Store.cart.filter(c=>!selected.has(c.productId)); selected.clear(); Store.save(); renderCart(); updateCartBadge(); }

// ── 결제 시트 ─────────────────────────────────────────
function openCheckout() {
  if (!localStorage.getItem('mm_access_token')) {
    toast('로그인이 필요합니다'); go('../login.html'); return;
  }
  document.getElementById('avail-pt').textContent = `보유: ${fmt(userPoint)}P`;
  document.getElementById('pay-overlay').classList.add('open');
  document.getElementById('pay-sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePaySheet() {
  document.getElementById('pay-overlay').classList.remove('open');
  document.getElementById('pay-sheet').classList.remove('open');
  document.body.style.overflow = '';
}

function selPay(el, method) {
  document.querySelectorAll('.pay-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on'); payMethod = method;
  // 무통장 선택 시 입금 정보 입력 폼 표시
  const vbankSection = document.getElementById('vbank-section');
  if(vbankSection) vbankSection.style.display = method==='VBANK' ? 'block' : 'none';
}

function useAllPoint() {
  const selItems = Store.cart.filter(c => selected.has(c.productId));
  const selTotal = selItems.reduce((s,c) => s + c.price*c.qty, 0);
  const delivery = selTotal >= 50000 ? 0 : 3500;
  const max = Math.min(userPoint, selTotal + delivery - 100);
  document.getElementById('point-use').value = Math.max(0, max);
  calcFinal();
}

function calcFinal() {
  const selItems = Store.cart.filter(c => selected.has(c.productId));
  const selTotal = selItems.reduce((s,c) => s + c.price*c.qty, 0);
  const delivery = selTotal >= 50000 ? 0 : 3500;
  const pt = Math.min(Number(document.getElementById('point-use').value)||0, userPoint, selTotal+delivery-100);
  const final = selTotal + delivery - pt;
  document.getElementById('sh-point').textContent = `-${fmt(pt)}원`;
  document.getElementById('sh-final').textContent = fmt(Math.max(0,final))+'원';
  document.getElementById('pay-btn-text').textContent = `${fmt(Math.max(0,final))}원 결제하기`;
}

// ── 주소 (데모) ───────────────────────────────────────
let currentAddr = null;
function changeAddr() {
  // 실제: 배송지 관리 페이지 연동
  currentAddr = {
    recipient: '홍길동', phone: '010-1234-5678',
    zipCode: '06234', address1: '서울시 강남구 테헤란로 123',
    address2: '45층'
  };
  document.getElementById('addr-name').textContent = `${currentAddr.recipient} · ${currentAddr.phone}`;
  document.getElementById('addr-detail').textContent = `[${currentAddr.zipCode}] ${currentAddr.address1} ${currentAddr.address2||''}`;
  toast('배송지가 선택됐습니다');
}

// ── 실제 결제 실행 ─────────────────────────────────────
async function doPay() {
  if (!currentAddr) { toast('배송지를 선택해주세요'); return; }

  const selItems = Store.cart.filter(c => selected.has(c.productId));
  if (selItems.length === 0) { toast('상품을 선택해주세요'); return; }

  const pt = Number(document.getElementById('point-use').value) || 0;
  const token = localStorage.getItem('mm_access_token');

  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    // 무통장 입금자명 확인
    if (payMethod === 'VBANK') {
      const depositorName = document.getElementById('depositor-name')?.value?.trim();
      if (!depositorName) { toast('입금자명을 입력해주세요'); btn.disabled=false; btn.innerHTML='<span id="pay-btn-text">결제하기</span>'; return; }
    }

    // 1. 서버에 주문 생성
    const readyRes = await fetch(API + '/payment/ready', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      credentials: 'include',
      body: JSON.stringify({
        items: selItems.map(i => ({
          productId: i.productId, name: i.name,
          price: i.price, qty: i.qty, option: i.option
        })),
        ...currentAddr,
        zipCode: currentAddr.zipCode,
        pointUse: pt,
        paymentMethod: payMethod,
        depositorName: document.getElementById('depositor-name')?.value?.trim() || null,
        bankName: document.getElementById('bank-name')?.value || null,
      })
    });
    const readyData = await readyRes.json();
    if (!readyRes.ok) throw new Error(readyData.error);

    const { order, nice } = readyData;

    // 무통장은 결제창 없이 바로 완료 페이지로
    if (order.isVbank) {
      // 장바구니 비우기
      selItems.forEach(i => { Store.cart = Store.cart.filter(c=>c.productId!==i.productId); });
      Store.save(); updateCartBadge();
      window.location.href = `../pages/order-complete.html?orderId=${order.orderId}&amount=${order.amount}&point=0&vbank=true&bank=${encodeURIComponent(order.bankInfo?.bank||'')}&account=${encodeURIComponent(order.bankInfo?.account||'')}&holder=${encodeURIComponent(order.bankInfo?.holder||'')}&deadline=${encodeURIComponent(order.bankInfo?.deadline||'')}`;
      return;
    }

    // 2. 나이스페이먼츠 결제창 호출
    AUTHNICE.requestPay({
      clientId:    nice.clientKey,
      method:      payMethod === 'CARD' ? 'card' :
                   payMethod === 'KAKAO' ? 'kakao' :
                   payMethod === 'NAVER' ? 'naverpay' :
                   payMethod === 'TOSS'  ? 'tosspay' :
                   payMethod === 'VBANK' ? 'vbank' : 'cellphone',
      orderId:     order.orderId,
      amount:      order.amount,
      goodsName:   order.orderName,
      returnUrl:   `https://meatmall.vercel.app/api/payment/nice-callback`,
      fnError: function(result) {
        console.error('[nice error]', result);
        btn.disabled = false;
        btn.innerHTML = '<span id="pay-btn-text">결제하기</span>';
        toast('결제에 실패했습니다: ' + (result.errorMsg || '알 수 없는 오류'));
      },
      fnSuccess: async function(result) {
        // 3. 서버에서 결제 검증 및 승인
        try {
          const confirmRes = await fetch(API + '/payment/confirm', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
            credentials: 'include',
            body: JSON.stringify({
              paymentKey: result.tid || result.paymentKey,
              orderId:    order.orderId,
              amount:     order.amount,
            })
          });
          const confirmData = await confirmRes.json();
          if (!confirmRes.ok) throw new Error(confirmData.error);

          // 결제 성공 → 장바구니 비우기 → 완료 페이지
          selItems.forEach(i => { Store.cart = Store.cart.filter(c=>c.productId!==i.productId); });
          Store.save();
          updateCartBadge();

          window.location.href = `../pages/order-complete.html?orderId=${order.orderId}&amount=${order.amount}&point=${confirmData.pointEarned||0}`;
        } catch(e) {
          toast('결제 검증 실패: ' + e.message);
          btn.disabled = false;
          btn.innerHTML = '<span id="pay-btn-text">결제하기</span>';
        }
      }
    });

  } catch(err) {
    toast(err.message || '결제 준비 중 오류가 발생했습니다');
    btn.disabled = false;
    btn.innerHTML = '<span id="pay-btn-text">결제하기</span>';
  }
}

renderCart();
</script>
</body>
</html>
