<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>결제 확인 중 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.app-wrap{background:var(--light-bg);min-height:100vh;display:flex;align-items:center;justify-content:center}
.pc-box{text-align:center;padding:40px 24px;max-width:360px}
.pc-spin{width:44px;height:44px;border:4px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;margin:0 auto 18px;animation:pcspin .8s linear infinite}
@keyframes pcspin{to{transform:rotate(360deg)}}
.pc-title{font-size:1.05rem;font-weight:800;color:var(--dark-txt);margin-bottom:8px}
.pc-sub{font-size:.86rem;color:var(--gray-txt);line-height:1.6}
.pc-btn{margin-top:20px;padding:12px 24px;background:var(--gold);color:var(--black);border:none;border-radius:14px;font-size:.9375rem;font-weight:700;cursor:pointer}
.pc-btn.ghost{background:var(--white);color:var(--gray-txt);border:1.5px solid #ddd}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="pc-box" id="pc-box">
    <div class="pc-spin"></div>
    <div class="pc-title">결제를 확인하고 있어요</div>
    <div class="pc-sub">잠시만 기다려주세요…</div>
  </div>
</div>
<script src="../js/app.js"></script>
<script>
const API='https://api.meatbonga.com/api';
function q(k){return new URLSearchParams(location.search).get(k)}
function box(html){document.getElementById('pc-box').innerHTML=html}
(async function(){
  const paymentKey=q('paymentKey'), orderId=q('orderId'), amount=q('amount');
  const token=localStorage.getItem('mm_access_token');
  if(!paymentKey||!orderId||!amount){
    box('<div style="font-size:2.4rem;margin-bottom:12px">⚠️</div><div class="pc-title">잘못된 접근이에요</div><div class="pc-sub">결제 정보가 없습니다.</div><button class="pc-btn" onclick="location.href=\'./cart.html\'">장바구니로</button>');
    return;
  }
  try{
    const r=await fetch(API+'/payment/confirm',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      credentials:'include',
      body:JSON.stringify({paymentKey, orderId, amount:Number(amount)})
    });
    const d=await r.json();
    if(!r.ok){
      const err = new Error(d.error||'결제 승인에 실패했습니다');
      err.code = d.code || '';
      throw err;
    }
    try{ if(window.Store){ Store.load(); Store.cart=[]; Store.save(); if(window.updateCartBadge) updateCartBadge(); } }catch(e){}
    location.replace(`./order-complete.html?orderId=${encodeURIComponent(orderId)}&amount=${encodeURIComponent(amount)}&point=${encodeURIComponent(d.pointEarned||0)}`);
  }catch(e){
    const code = String(e.code || '');
    const safeCode = code.replace(/</g,'&lt;');
    const safeMsg = String(e.message || '오류가 발생했습니다').replace(/</g,'&lt;');
    const isMerchantMethodBlocked = code === 'NOT_AVAILABLE_PAYMENT_BY_MERCHANT';
    const title = isMerchantMethodBlocked ? '결제수단 준비 중' : '결제 승인 실패';
    const desc = isMerchantMethodBlocked
      ? '현재 상점에서 카드·간편결제 승인이 아직 활성화되지 않았습니다.<br>무통장 입금으로 주문하시거나 상점에 문의해주세요.'
      : safeMsg + '<br>결제가 완료되지 않았다면 다시 시도해주세요.';
    const codeHtml = safeCode ? '<div class="pc-sub" style="margin-top:10px;font-size:.75rem;color:#9CA3AF">오류코드: '+safeCode+'</div>' : '';
    box('<div style="font-size:2.4rem;margin-bottom:12px">❌</div><div class="pc-title">'+title+'</div><div class="pc-sub">'+desc+'</div>'+codeHtml+'<button class="pc-btn" onclick="location.href=\'./cart.html\'">장바구니로</button> <button class="pc-btn ghost" onclick="location.href=\'./orders.html\'">주문내역</button>');
  }
})();
</script>
</body></html>
