<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>로그인 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<style>
.login-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--white)}
.login-hero{background:linear-gradient(160deg,var(--primary-dark) 0%,var(--primary) 55%,var(--primary-light) 100%);padding:52px 24px 36px;text-align:center;position:relative;overflow:hidden}
.login-hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);top:-100px;right:-80px}
.login-hero::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-60px;left:-40px}
.login-logo{font-size:3.2rem;margin-bottom:10px;position:relative}
.login-brand{font-family:var(--font-display);font-size:1.75rem;font-weight:700;color:var(--white);margin-bottom:5px;position:relative}
.login-tagline{font-size:.85rem;color:rgba(255,255,255,.75);position:relative;line-height:1.5}
.login-body{flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:11px}
.social-label{font-size:.75rem;font-weight:600;color:var(--gray-500);text-align:center;position:relative;letter-spacing:.05em}
.social-label::before,.social-label::after{content:'';position:absolute;top:50%;height:1px;background:var(--gray-300);width:calc(50% - 56px)}
.social-label::before{left:0}.social-label::after{right:0}
.btn-social{height:50px;border-radius:var(--radius-md);font-size:.93rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:all .15s;border:none;cursor:pointer;position:relative}
.btn-social:active{transform:scale(.97)}
.btn-kakao{background:#FEE500;color:#391B1B}
.btn-naver{background:#03C75A;color:#fff}
.btn-google{background:#fff;color:#3c4043;border:1.5px solid #dadce0}
.btn-apple{background:#1C1C1E;color:#fff;opacity:.45;cursor:not-allowed}
.soon-badge{position:absolute;top:-8px;right:10px;background:#78716C;color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:var(--radius-full);letter-spacing:.06em}
.divider-or{display:flex;align-items:center;gap:10px;color:var(--gray-400);font-size:.8rem}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--gray-200)}
.email-section{display:flex;flex-direction:column;gap:12px}
.check-row{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gray-700);cursor:pointer}
.check-row input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.login-footer-links{display:flex;justify-content:center;gap:18px;font-size:.8rem;color:var(--gray-500)}
.login-footer-links a{border-bottom:1px solid var(--gray-300);padding-bottom:1px}
.signup-row{text-align:center;font-size:.86rem;color:var(--gray-700)}
.signup-row a{color:var(--primary);font-weight:700;text-decoration:underline}
.login-notice{background:var(--cream);border:1px solid var(--peach);border-radius:var(--radius-md);padding:11px 13px;font-size:.78rem;color:var(--gray-700);line-height:1.55}
.login-notice strong{color:var(--primary)}
.error-banner{background:var(--red-light);border:1px solid #FCA5A5;border-radius:var(--radius-md);padding:10px 13px;font-size:.82rem;color:var(--red);display:none}
.error-banner.show{display:block}
</style>
</head>
<body>
<div class="app-wrap">
<div class="login-wrap">

  <div class="login-hero">
    <div class="login-logo">🥩</div>
    <div class="login-brand">정육본가</div>
    <div class="login-tagline">공장에서 식탁까지 48시간<br>신선한 육가공 D2C 쇼핑몰</div>
  </div>

  <div class="login-body">

    <div class="error-banner" id="error-banner"></div>

    <!-- 소셜 로그인 -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <div class="social-label">간편 로그인</div>

      <button class="btn-social btn-kakao" onclick="socialLogin('kakao')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#391B1B" d="M12 3C6.477 3 2 6.477 2 10.8c0 2.8 1.8 5.26 4.5 6.7l-.9 3.3 3.8-2.5c.85.12 1.72.2 2.6.2 5.523 0 10-3.477 10-7.7S17.523 3 12 3z"/></svg>
        카카오로 시작하기
      </button>

      <button class="btn-social btn-naver" onclick="socialLogin('naver')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/></svg>
        네이버로 시작하기
      </button>

      <button class="btn-social btn-google" onclick="socialLogin('google')">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.57-.14-3.08-.4-4.53H24v8.57h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.2z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.32-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.68 28.18A13.96 13.96 0 0 1 10.8 24c0-1.45.25-2.86.68-4.18v-5.7H4.34A22.02 22.02 0 0 0 2 24c0 3.55.85 6.91 2.34 9.88l7.34-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.34 5.7C13.42 14.62 18.27 10.75 24 10.75z"/></svg>
        Google로 시작하기
      </button>

      <!-- 애플 — SOON -->
      <button class="btn-social btn-apple" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.55-1.28 3.09-2.53 4.08zm-5.08-14c-.08-2.44 2.03-4.48 4.35-4.28.33 2.68-2.41 4.72-4.35 4.28z"/></svg>
        Apple로 시작하기
        <span class="soon-badge">SOON</span>
      </button>
    </div>

    <div class="divider-or">이메일로 로그인</div>

    <!-- 이메일 폼 -->
    <div class="email-section">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" class="form-input" id="email" placeholder="email@example.com" autocomplete="email">
        <span class="form-error" id="email-err">이메일 형식을 확인해주세요</span>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="input-wrap">
          <input type="password" class="form-input" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
          <span class="input-action" onclick="togglePw()">👁</span>
        </div>
        <span class="form-error" id="pw-err">비밀번호를 입력해주세요</span>
        <span class="form-error" id="login-err"></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <label class="check-row"><input type="checkbox" id="remember-me"> 로그인 유지</label>
        <a href="pages/find-account.html" style="font-size:.8rem;color:var(--gray-500)">비밀번호 찾기</a>
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="emailLogin()">로그인</button>
    </div>

    <div class="signup-row">아직 회원이 아니신가요? <a href="pages/signup.html">무료 회원가입</a></div>

    <div class="login-notice">
      🔒 <strong>안전한 결제 연동</strong><br>
      네이버페이 · 카카오페이 · 토스 · 카드결제와 자동으로 연동됩니다.
    </div>

    <div class="login-footer-links">
      <a href="pages/terms.html">이용약관</a>
      <a href="pages/privacy.html">개인정보처리방침</a>
      <a href="pages/cs.html">고객센터</a>
    </div>

  </div>
</div>
</div>

<div id="toast-global" class="toast"></div>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
const API_SERVER = 'https://meatmall.vercel.app/api';

// 에러 파라미터 처리
(function(){
  const p = new URLSearchParams(window.location.search);
  const err = p.get('error');
  if (!err) return;
  const msgs = {
    kakao_failed:'카카오 로그인에 실패했습니다.',
    naver_failed:'네이버 로그인에 실패했습니다.',
    google_failed:'구글 로그인에 실패했습니다.',
    inactive:'비활성화된 계정입니다. 고객센터에 문의해주세요.'
  };
  const b = document.getElementById('error-banner');
  b.textContent = '⚠️ ' + (msgs[err] || '로그인 중 오류가 발생했습니다.');
  b.classList.add('show');
  history.replaceState({}, '', window.location.pathname);
})();

// 이미 로그인된 경우 홈으로
(async function(){
  const ok = await AuthAPI.init();
  if (ok) window.location.href = 'index.html';
})();

// 소셜 로그인
function socialLogin(provider) {
  const urls = {
    kakao:  API_SERVER + '/auth/kakao',
    naver:  API_SERVER + '/auth/naver',
    google: API_SERVER + '/auth/google'
  };
  window.location.href = urls[provider];
}

// 이메일 로그인
async function emailLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  let ok = true;
  ['email-err','pw-err','login-err'].forEach(id => document.getElementById(id).classList.remove('show'));

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('email-err').classList.add('show'); ok = false;
  }
  if (!password) {
    document.getElementById('pw-err').classList.add('show'); ok = false;
  }
  if (!ok) return;

  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<div class="spinner"></div>'; btn.disabled = true;

  try {
    const res = await fetch(API_SERVER + '/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'include',
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '로그인 실패');

    localStorage.setItem('mm_access_token', data.accessToken);
    localStorage.setItem('mm_user_cache', JSON.stringify(data.user));

    toast('로그인 성공! 환영합니다 🎉');
    setTimeout(() => { window.location.href = 'index.html'; }, 600);
  } catch(err) {
    btn.innerHTML = '로그인'; btn.disabled = false;
    const el = document.getElementById('login-err');
    el.textContent = err.message; el.classList.add('show');
  }
}

function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') emailLogin(); });
document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('password').focus(); });

function toast(msg) {
  const el = document.getElementById('toast-global');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
