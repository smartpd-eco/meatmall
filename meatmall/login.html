<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>로그인 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<style>
.app-wrap{background:var(--black)}
.login-hero{background:linear-gradient(160deg,#0a0a0a,#1a1208);border-bottom:2px solid var(--gold);padding:36px 20px 28px;text-align:center}
.login-emblem{width:108px;height:108px;border-radius:50%;background:linear-gradient(135deg,#1a1208,#2a1a08);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 22px;box-shadow:0 0 0 4px rgba(201,168,76,.12)}
.login-name{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.login-sub{font-size:.72rem;color:rgba(255,255,255,.35);letter-spacing:.12em}
.login-box{background:var(--light-bg);border-radius:0 0 var(--r-lg) var(--r-lg);padding:24px 20px 32px;flex:1}
.social-btn{width:100%;height:48px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:10px;font-size:.88rem;font-weight:700;cursor:pointer;border:none;margin-bottom:8px;transition:opacity .15s}
.social-btn:active{opacity:.85}
.s-kakao{background:#FEE500;color:#3A1D1D}
.s-naver{background:#03C75A;color:#fff}
.s-google{background:#fff;color:#333;border:1px solid #ddd!important}
.s-apple{background:#000;color:#fff;border:1px solid #333!important}
.divider-txt{display:flex;align-items:center;gap:10px;margin:14px 0;color:#ccc;font-size:.78rem}
.divider-txt::before,.divider-txt::after{content:'';flex:1;height:1px;background:rgba(201,168,76,.2)}
</style>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)window.location.reload()})</script>
</head>
<body>
<div class="app-wrap" style="background:var(--black)">
  <header class="hdr">
    <div class="hdr-logo" onclick="go('index.html')">정육본가<small>PREMIUM PORK</small></div>
    <div style="width:38px"></div>
  </header>

  <div class="login-hero">
    <div class="login-emblem"><img src="images/icon-192.png" alt="정육본가" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></div>
    <div class="login-name">정육본가</div>
  </div>

  <div class="login-box">
    <div style="font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--dark-txt);margin-bottom:18px">🔐 로그인</div>
    <button class="social-btn s-google" onclick="doSocial('google')"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.33 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.67 14.62 48 24 48z"/></svg> 구글로 로그인</button>
    <button class="social-btn s-kakao" onclick="doSocial('kakao')"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#3C1E1E" d="M12 3C6.48 3 2 6.48 2 10.8c0 2.7 1.6 5.1 4 6.6l-1 3.6 4.2-2.8c.9.2 1.8.3 2.8.3 5.52 0 10-3.48 10-7.8S17.52 3 12 3z"/></svg> 카카오로 로그인</button>
    <button class="social-btn s-naver" onclick="doSocial('naver')"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/></svg> 네이버로 로그인</button>
    <button class="social-btn s-apple" style="opacity:0.4;cursor:not-allowed" disabled><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg> Apple로 로그인</button>

    <div class="divider-txt">또는 이메일로 로그인</div>
    <div class="lf-group">
      <label class="lf-label">이메일</label>
      <input class="lt-input" id="email" type="email" placeholder="이메일 입력">
    </div>
    <div class="lf-group">
      <label class="lf-label">비밀번호</label>
      <input class="lt-input" id="pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:#DC2626;font-size:.8rem;margin-bottom:10px;display:none"></div>
    <button class="btn-gold" id="login-btn" onclick="doLogin()">로그인</button>

    <div style="text-align:center;margin-top:16px;font-size:.82rem;color:var(--gray-txt)">
      아직 회원이 아니신가요? <a href="pages/signup.html" style="color:var(--gold);font-weight:700">회원가입</a>
    </div>

    <div id="biz-footer"></div>
  </div>
  <div style="height:88px"></div>

  <nav class="nav">
    <div class="nav-i" onclick="go('index.html')"><div class="nav-ico">🏠</div><div class="nav-lbl">홈으로</div></div>
    <div class="nav-i" onclick="go('pages/category.html')"><div class="nav-ico">🥩</div><div class="nav-lbl">정육보기</div></div>
    <div class="nav-i" onclick="go('pages/signup.html')"><div class="nav-ico">✍️</div><div class="nav-lbl">회원가입</div></div>
    <div class="nav-i" onclick="go('pages/cs.html')"><div class="nav-ico">💬</div><div class="nav-lbl">고객센터</div></div>
  </nav>
</div>
<div id="toast-wrap" class="toast"></div>
<script src="js/app.js"></script>
<script src="js/footer.js?v=20260708-email-line"></script>
<script src="js/pwa-install.js?v=20260810-install-fix" defer></script>
<script>
const API='https://api.meatbonga.com/api';
// 서버 콜드스타트 예열: 페이지 로드 즉시 양쪽 도메인 깨우기 (결과 무시)
['https://api.meatbonga.com/api/products?limit=1','https://api.meatbonga.com/api/products?limit=1'].forEach(u=>{try{fetch(u,{mode:'cors'}).catch(()=>{});}catch(e){}});
function go(u){window.location.href=u}
document.addEventListener('DOMContentLoaded',()=>{const p=document.getElementById('pw');if(p)p.value=''});
const cached=JSON.parse(localStorage.getItem('mm_user_cache')||'{}')||{};
if(localStorage.getItem('mm_access_token')&&cached.name)go(cached.is_admin?'admin/dashboard.html':(cached.vendor_id?'vendor/dashboard.html':'index.html'));
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('login-err');
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력해주세요';err.style.display='block';return}
  const btn=document.getElementById('login-btn');btn.textContent='...';btn.disabled=true;
  try{
    // 콜드스타트/특정 도메인 차단 대응: 실패 시 대체 API 도메인으로 재시도
    const LOGIN_HOSTS=['https://api.meatbonga.com/api','https://api.meatbonga.com/api'];
    let r, lastErr;
    for(let i=0;i<4;i++){
      const host=LOGIN_HOSTS[i % LOGIN_HOSTS.length];
      try{
        const resp=await fetch(host+'/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
        // 정상(2xx) 또는 인증오류(4xx)면 확정, 5xx(콜드스타트 503 등)는 재시도
        if(resp.ok || (resp.status>=400 && resp.status<500)){ r=resp; break; }
        lastErr=new Error('HTTP '+resp.status);
      }catch(netErr){ lastErr=netErr; }
      if(i<3) await new Promise(res=>setTimeout(res,1200));
    }
    if(!r) throw (lastErr||new Error('서버 연결이 지연되고 있습니다. 잠시 후 다시 시도해주세요'));
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'로그인 실패');
    localStorage.setItem('mm_access_token',d.accessToken);
    localStorage.setItem('mm_user_cache',JSON.stringify(d.user));
    localStorage.setItem('mm_last_active',String(Date.now()));
    if(d.user?.is_admin)sessionStorage.setItem('mm_admin','true');
    const dest = d.user?.is_admin ? 'admin/dashboard.html'
               : (d.user?.vendor_id ? 'vendor/dashboard.html' : 'index.html');
    go(dest);
  }catch(e){err.textContent='❌ '+e.message;err.style.display='block';btn.textContent='로그인';btn.disabled=false}
}
function doSocial(p){window.location.href=API+'/auth/'+p}
</script>
</body></html>
