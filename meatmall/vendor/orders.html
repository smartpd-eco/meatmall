<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>발주현황 · 정육본가 벤더</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor-theme.css">
<script>document.documentElement.style.visibility='hidden';window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});</script>
<script>(function(){if(window.__mmFetchPatched)return;window.__mmFetchPatched=true;var o=window.fetch.bind(window);window.fetch=function(u,p){if(typeof u==='string'&&u.indexOf('api.meatbonga.com')>-1){return o(u,p).catch(function(){return o(u.replace('api.meatbonga.com','meatmall.vercel.app'),p)})}return o(u,p)}})();</script>
</head>
<body>
<aside class="v-side">
  <div class="v-brand">
    <div class="ico">🏪</div>
    <div>
      <div class="code" id="v-code">VENDOR</div>
      <div class="shop" id="v-shop">불러오는 중…</div>
      <div class="vid" id="v-id">벤더사 ID : —</div>
    </div>
  </div>
  <nav class="v-nav">
    <a href="dashboard.html">🏠 매출집계</a>
    <a href="products.html">📦 상품등록(당일배송건)</a>
    <a class="on" href="orders.html">📋 발주현황</a>
  </nav>
  <button class="logout" onclick="logout()">↩ 로그아웃</button>
</aside>

<div class="v-head">
  <div><h1>발주현황</h1><div class="sub">정육본가 본점에서 발주한 내역의 진행 현황을 확인할 수 있습니다.</div></div>
</div>

<div class="v-body">
  <div class="card">
    <div class="card-head">
      <div class="fbar">
        <select class="fselect" id="f-status" onchange="load()">
          <option value="">전체</option>
          <option value="pending">신규발주</option>
          <option value="confirmed">발주확인</option>
          <option value="preparing">상품준비중</option>
          <option value="shipping">배송출발</option>
          <option value="delivered">배송완료</option>
          <option value="settled">정산완료</option>
          <option value="cancelled">취소</option>
        </select>
        <input class="finput" id="f-from" type="date">
        <span style="color:#9CA3AF">~</span>
        <input class="finput" id="f-to" type="date">
        <button class="btn btn-green btn-sm" onclick="load()">조회</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>발주번호</th><th>발주일시</th><th>납품요청일</th><th>주문처</th><th>상품</th>
          <th class="t-center">수량</th><th class="t-right">주문금액</th><th class="t-center">진행상태</th><th class="t-center">처리</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">🔄 불러오는 중…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const API='https://api.meatbonga.com/api';
const token=localStorage.getItem('mm_access_token');
function go(u){location.href=u}
function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function logout(){localStorage.removeItem('mm_access_token');localStorage.removeItem('mm_user_cache');location.href='../login.html'}
function hdrs(){return{Authorization:'Bearer '+token,'Content-Type':'application/json'}}

const LABEL={pending:['신규발주','bdg-amber'],confirmed:['발주확인','bdg-blue'],preparing:['상품준비중','bdg-amber'],shipping:['배송출발','bdg-teal'],delivered:['배송완료','bdg-green'],settled:['정산완료','bdg-gray'],cancelled:['취소','bdg-red']};
const NEXT={pending:['confirmed','발주확인'],confirmed:['preparing','상품준비중'],preparing:['shipping','배송출발'],shipping:['delivered','배송완료']};
function dt(s){if(!s)return'—';const d=new Date(s);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function dateOnly(s){if(!s)return'—';const d=new Date(s);const w=['일','월','화','수','목','금','토'][d.getDay()];const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} (${w})`}

(async function(){
  if(!token){location.href='../login.html';return}
  try{
    const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();
    if(!r.ok||!d.user||!d.user.vendor_id){toast('벤더 권한이 없습니다');setTimeout(()=>location.href='../login.html',1200);return}
    document.documentElement.style.visibility='';
    loadVendor(); load();
  }catch(e){location.href='../login.html'}
})();
async function loadVendor(){
  try{const r=await fetch(API+'/vendor/me',{headers:hdrs()});const d=await r.json();
    if(d.vendor){document.getElementById('v-shop').textContent=d.vendor.vendor_name||'—';
      document.getElementById('v-id').textContent='벤더사 ID : VENDOR'+String(d.vendor.id).padStart(3,'0');
      document.getElementById('v-code').textContent='VENDOR'+String(d.vendor.id).padStart(3,'0');}
  }catch(e){}
}
async function load(){
  const tb=document.getElementById('rows');tb.innerHTML='<tr><td colspan="9" class="empty">🔄 불러오는 중…</td></tr>';
  const st=document.getElementById('f-status').value;
  const from=document.getElementById('f-from').value;
  const to=document.getElementById('f-to').value;
  const qs=new URLSearchParams();if(st)qs.set('status',st);if(from)qs.set('from',from);if(to)qs.set('to',to);
  try{
    const r=await fetch(API+'/vendor/orders?'+qs.toString(),{headers:hdrs()});const d=await r.json();
    const rows=d.orders||[];
    if(!rows.length){tb.innerHTML='<tr><td colspan="9" class="empty">발주 내역이 없습니다</td></tr>';return}
    tb.innerHTML=rows.map(o=>{
      const lb=LABEL[o.status]||['—','bdg-gray'];
      const nx=NEXT[o.status];
      const action=nx?`<button class="btn btn-outline btn-sm" onclick="adv('${o.id}','${nx[0]}')">${nx[1]}</button>`:'<span style="color:#9CA3AF">—</span>';
      return `<tr>
        <td style="font-weight:700;color:#15803D">${o.order_number||'—'}</td>
        <td>${dt(o.created_at)}</td>
        <td>${dateOnly(o.delivery_date)}</td>
        <td>${o.buyer||'정육본가 본점'}</td>
        <td>${o.item_label||'—'}</td>
        <td class="t-center">${o.qty||0}개</td>
        <td class="t-right" style="font-weight:700">${fmt(o.total_amount)}원</td>
        <td class="t-center"><span class="bdg ${lb[1]}">${lb[0]}</span></td>
        <td class="t-center">${action}</td></tr>`;
    }).join('');
  }catch(e){tb.innerHTML='<tr><td colspan="9" class="empty">❌ 불러오기 실패</td></tr>'}
}
async function adv(id,status){
  if(!confirm('진행상태를 변경하시겠습니까?'))return;
  try{
    const r=await fetch(`${API}/vendor/orders/${id}/status`,{method:'PATCH',headers:hdrs(),body:JSON.stringify({status})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'변경 실패');
    toast('✅ 진행상태가 변경됐습니다');load();
  }catch(e){toast('❌ '+e.message)}
}
</script>
</body></html>
