<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임박재고 이전 · 정육본가 ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#1F2937;--sub:#6B7280;--line:#E5E7EB;
  --blue:#2563EB;--blue-d:#1D4ED8;--blue-soft:#EFF6FF;
  --gold:#C9A84C;--gold-d:#A8862A;--gold-soft:#FBF7EC;--red:#DC2626;--green:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
/* HEADER */
.hdr{background:#fff;color:var(--ink);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hdr .t{font-weight:800;font-size:1.05rem;letter-spacing:.01em}.hdr .t b{color:var(--gold-d)}
.hdr a{color:var(--blue);text-decoration:none;font-size:.85rem;font-weight:600}
.wrap{max-width:940px;margin:0 auto;padding:22px 20px 40px}
/* TABS — 좌우 여백 없이 꽉 채운 4등분 세그먼트, 글자 중앙 밸런스 */
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tb{flex:1 1 0;min-width:0;text-align:center;padding:14px 6px;font-weight:700;font-size:.9rem;line-height:1.2;color:var(--sub);cursor:pointer;border-right:1px solid var(--line);transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb:last-child{border-right:none}
.tb:hover{background:#F9FAFB;color:var(--ink)}
.tb.on{background:var(--blue-soft);color:var(--blue-d);box-shadow:inset 0 -3px 0 var(--blue)}
/* BAR */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar label{font-size:.82rem;color:var(--sub);font-weight:600}
.bar input,.bar select{height:36px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fff;color:var(--ink);font-size:.88rem;outline:none}
.bar input:focus,.bar select:focus{border-color:var(--blue)}
.bar input{width:74px}
.bar button{height:36px;padding:0 16px;border:none;border-radius:7px;background:var(--blue);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .15s}
.bar button:hover{background:var(--blue-d)}
.warn{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:11px 13px;font-size:.84rem;color:#92610A;margin-bottom:16px}
/* CARD */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.box{flex:1;min-width:150px}.box .l{font-size:.72rem;color:var(--sub);font-weight:600}.box .v{font-weight:800;font-size:1rem;margin-top:2px}
.arrow{font-size:1.4rem;color:var(--blue)}
.risk{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:#FEF2F2;color:var(--red)}
.meta{font-size:.82rem;color:var(--sub);margin-top:8px}
.act{display:flex;gap:10px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.act input,.act select{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fff;font-size:.9rem;color:var(--ink);outline:none}
.act input:focus,.act select:focus{border-color:var(--blue)}
.act .q{width:110px}.act .d{width:100%}
.fg.prod{flex:1 1 260px;min-width:220px}
.act button{height:38px;padding:0 18px;border:none;border-radius:7px;font-weight:700;font-size:.86rem;cursor:pointer;background:var(--blue);color:#fff;transition:background .15s}
.act button:hover{background:var(--blue-d)}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.form .row{display:grid;grid-template-columns:1fr 1fr 90px auto;gap:8px}
.form select,.form input{height:38px;border:1px solid var(--line);border-radius:7px;padding:0 10px;outline:none}
.form select:focus,.form input:focus{border-color:var(--blue)}
.form button{background:var(--blue);color:#fff;border:none;border-radius:7px;font-weight:700;cursor:pointer;padding:0 16px}
.form button:hover{background:var(--blue-d)}
.empty{text-align:center;color:var(--sub);padding:50px;background:#fff;border:1px solid var(--line);border-radius:12px}
.del{color:var(--red);font-size:.8rem;cursor:pointer;font-weight:600}
/* ── 행사 카드 ── */
.ev-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ev-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--gold-soft);color:var(--gold-d);border:1px solid #EBDFBE}
.ev-dist{font-size:.76rem;color:var(--sub);font-weight:600;white-space:nowrap}
.ev-dist b{color:var(--ink)}
.ev-title{font-weight:800;font-size:1.06rem;line-height:1.3}
.ev-sub{font-size:.8rem;color:var(--sub);margin-top:3px}
.ev-demand{margin-top:12px;background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.ev-demand-h{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:800;color:var(--ink)}
.lv{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.7rem;font-weight:700}
.lv3{background:#FEF2F2;color:var(--red)}.lv2{background:#FFFBEB;color:#B45309}.lv1{background:#F1F5F9;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:.79rem}
.chip .k{color:var(--sub);font-size:.68rem;font-weight:700}
.chip .val{font-weight:700}
.ev-reason{font-size:.82rem;color:#374151;margin-top:10px;line-height:1.55}
.ev-note{font-size:.7rem;color:var(--sub);margin-top:8px;line-height:1.45;padding-top:8px;border-top:1px dashed var(--line)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.68rem;color:var(--sub);font-weight:700}
.stock{font-size:.76rem;margin-top:10px;padding:8px 11px;border-radius:8px;line-height:1.45}
.stock.has{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857}
.stock.none{background:#FEF2F2;border:1px solid #FECACA;color:var(--red)}
.stock b{font-weight:800}
</style>
</head>
<body>
<div class="hdr"><div class="t">정육본가 <b>임박재고 이전</b></div><a href="dashboard.html">← 대시보드</a></div>
<div class="wrap">
  <div class="tabs">
    <div class="tb on" id="tb-hq" onclick="setTab('hq')">본사 → 매장</div>
    <div class="tb" id="tb-store" onclick="setTab('store')">정육점 → 정육점</div>
    <div class="tb" id="tb-req" onclick="setTab('req')">📥 재고 이동 요청 창</div>
    <div class="tb" id="tb-evt" onclick="setTab('evt')">🎪 행사 수요예측</div>
  </div>

  <div id="pane-hq">
    <div class="bar">
      <label>임박기준</label><input id="days" type="number" value="3"><span style="font-size:.82rem">일</span>
      <label>반경</label><input id="km" type="number" value="30"><span style="font-size:.82rem">km</span>
      <button onclick="loadHq()">추천 조회</button>
    </div>
    <div id="warn"></div>
    <div id="hqlist" class="empty">'추천 조회'를 눌러주세요.</div>
  </div>

  <div id="pane-store" style="display:none">
    <div class="bar"><label>반경</label><input id="skm" type="number" value="30"><span style="font-size:.82rem">km</span><button onclick="loadStore()">추천 조회</button></div>
    <div class="meta" style="margin-bottom:8px">열린 '재고 이동 요청'을 여유재고 매장과 거리순으로 매칭합니다.</div>
    <div id="storelist" class="empty">'추천 조회'를 눌러주세요.</div>
  </div>

  <div id="pane-req" style="display:none">
    <div class="form">
      <div style="font-weight:800;margin-bottom:10px">필요 매장 재고 이동 요청 등록</div>
      <div class="row">
        <select id="r-vendor"></select>
        <select id="r-product"></select>
        <input id="r-qty" type="number" placeholder="수량">
        <button onclick="addReq()">요청 등록</button>
      </div>
    </div>
    <div id="reqlist" class="empty">불러오는 중…</div>
  </div>

  <div id="pane-evt" style="display:none">
    <div class="bar"><button onclick="syncEvents()">공공 행사 수집</button>
      <label style="margin-left:10px">벤더 반경</label><input id="evt-radius" type="number" value="30" style="width:64px"><span style="font-size:.82rem">km</span>
      <label style="margin-left:8px">기간</label><input id="evt-maxdays" type="number" value="14" style="width:56px"><span style="font-size:.82rem">일 이내</span>
      <button onclick="loadEvents()" style="margin-left:6px">적용</button>
      <span id="evt-msg" style="font-size:.82rem;color:var(--sub);margin-left:8px"></span></div>
    <div class="meta" style="margin-bottom:8px">등록 벤더 반경 안의 <b>단기 행사</b>만 노출합니다(연중·상설 제외). 반경 매장에 선제 재고 이동 '요청'을 만들어, 정육점→정육점·재고이동요청 탭의 추천으로 이어집니다.</div>
    <div id="evtlist" class="empty">'공공 행사 수집'을 눌러 목록을 불러오세요.</div>
  </div>
</div>
<script>
const API='https://api.meatbonga.com/api';
const token=localStorage.getItem('mm_access_token');
let tab='hq',VENDORS=[],PRODUCTS=[];
function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function tomorrow(){const d=new Date(Date.now()+86400000);return d.toISOString().slice(0,10)}
function setTab(t){tab=t;['hq','store','req','evt'].forEach(x=>{document.getElementById('tb-'+x).classList.toggle('on',x===t);document.getElementById('pane-'+x).style.display=x===t?'':'none'});
  if(t==='req'){loadPickers();loadReqs()} if(t==='evt'){loadEvents()}}
let EVPRODUCTS=[];
async function loadEvProducts(){if(EVPRODUCTS.length)return;try{const r=await fetch(`${API}/products?limit=100`);const d=await r.json();EVPRODUCTS=d.products||[];}catch(e){}}
async function syncEvents(){document.getElementById('evt-msg').textContent='수집 중…';
  try{const r=await fetch(`${API}/admin/events/sync`,{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();
    document.getElementById('evt-msg').textContent=d.ok?`수집 ${d.synced}건`:(d.message||'수집 실패');loadEvents();
  }catch(e){document.getElementById('evt-msg').textContent='수집 실패';}}
async function loadEvents(){await loadEvProducts();
  const el=document.getElementById('evtlist');el.className='empty';el.textContent='불러오는 중…';
  const rad=Number(document.getElementById('evt-radius').value)||30;
  const mxd=Number(document.getElementById('evt-maxdays').value)||14;
  try{const r=await fetch(`${API}/admin/events?radius_km=${rad}&max_days=${mxd}`,{headers:{Authorization:'Bearer '+token}});const d=await r.json();
    const es=d.events||[];
    const msg=document.getElementById('evt-msg');
    if(d.vendors===0){msg.textContent='⚠ 벤더 좌표 없음(주소 등록 필요)';}
    else{msg.textContent=`수집 ${d.total||0}건 중 노출 ${d.shown||0}건 (반경 ${rad}km·${mxd}일 이내)`;}
    if(!es.length){el.className='empty';el.textContent='조건에 맞는 행사가 없습니다. (반경/기간을 넓혀보거나 공공 행사 수집을 먼저 실행)';return}
    el.className='';
    el.innerHTML=es.map(ev=>{
      const dm=ev.demand||{},rc=ev.rec||{};
      const sel=rc.product_id||pickProduct(dm.cut);
      const opts=EVPRODUCTS.map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${p.name}</option>`).join('');
      const dist=ev.nearest_km!=null?`최근접 <b>${ev.nearest_store}</b> · ${ev.nearest_km}km`:'';
      // 재고 라인
      let stock='';
      if(rc.product_id&&rc.in_stock&&(rc.locations||[]).length){
        const locs=rc.locations.map(l=>`${l.name} <b>${l.qty}</b>${l.km!=null?`(${l.km}km)`:''}`).join(' · ');
        stock=`<div class="stock has">📦 재고 보유: ${locs} — 재고 있는 매장 기준으로 추천했습니다.</div>`;
      }else if(rc.product_id){
        stock=`<div class="stock none">⚠ 「${rc.product_name}」 전 매장 재고 없음 — 본사 확보 후 이전이 필요합니다.</div>`;
      }
      const chips=(dm.cuts||[dm.cut]).map(c=>`<span class="chip"><span class="val">${c}</span></span>`).join('');
      return `<div class="card">
        <div class="ev-head"><span class="ev-tag">🎪 축제</span><span class="ev-dist">${dist}</span></div>
        <div class="ev-title">${ev.title}</div>
        <div class="ev-sub">${ev.addr||''} · ${ev.start_date||''}~${ev.end_date||''} · ${ev.span_days}일간</div>
        <div class="ev-demand">
          <div class="ev-demand-h">🤖 AI 수요 추정<span class="lv lv${dm.level||2}">수요 ${dm.level_label||'보통'}</span></div>
          <div class="chips">
            <span class="chip"><span class="k">유형</span><span class="val">${dm.category||'-'}</span></span>
            <span class="chip"><span class="k">축종</span><span class="val">${dm.species||'-'}</span></span>
          </div>
          <div class="chips" style="margin-top:5px"><span class="chip" style="background:#FBF7EC;border-color:#EBDFBE"><span class="k">즐길 부위</span></span>${chips}</div>
          <div class="ev-reason">${dm.reason||''}</div>
          ${stock}
          <div class="ev-note">※ 지역 축제 먹거리·구이 소비의 일반적 패턴에 근거한 AI 추정치입니다(농림축산식품부·aT 소비동향 등 공개 통계의 축제 소비 경향 참조). 추천 품목은 실제 매장 재고를 기준으로 선정합니다.</div>
        </div>
        <div class="act">
          <div class="fg prod"><label>추천 품목 (재고 기준)</label><select id="ep-${ev.id}" class="d">${opts}</select></div>
          <div class="fg"><label>매장당 수량</label><input class="q" type="number" id="eq-${ev.id}" value="${dm.suggest_qty||10}"></div>
          <div class="fg"><label>반경(km)</label><input class="q" type="number" id="er-${ev.id}" value="${rad}"></div>
          <button onclick="planEvent(${ev.id})">반경 매장 선제이전 요청</button>
        </div></div>`;
    }).join('');
  }catch(e){el.textContent='불러오지 못했습니다.'}}
// (폴백) 서버 추천이 없을 때 부위 키워드로 상품 선택
function pickProduct(cut){
  if(!EVPRODUCTS.length)return null;
  const keys=[];(cut||'').replace(/[^가-힣]/g,' ').split(/\s+/).forEach(w=>{if(w.length>=2)keys.push(w)});
  for(const k of keys){const m=EVPRODUCTS.find(p=>(p.name||'').includes(k));if(m)return m.id;}
  return EVPRODUCTS[0].id;
}
async function planEvent(id){
  const pid=document.getElementById('ep-'+id).value,qty=document.getElementById('eq-'+id).value,rad=document.getElementById('er-'+id).value;
  if(!pid||!qty){alert('품목·수량을 입력하세요');return}
  try{const res=await fetch(`${API}/admin/events/${id}/plan`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({product_id:pid,base_qty:qty,radius_km:rad})});
    const d=await res.json();if(!res.ok){alert(d.error||'실패');return}
    alert(`반경 내 ${d.stores}개 매장에 재고 이동 요청 ${d.created}건 생성.\n'정육점→정육점' 또는 '재고 이동 요청 창'에서 이어서 처리하세요.`);
  }catch(e){alert('오류가 발생했습니다')}}

// ── 본사 → 매장 ──
async function loadHq(){
  const el=document.getElementById('hqlist');el.className='empty';el.textContent='불러오는 중…';document.getElementById('warn').innerHTML='';
  if(!token){el.textContent='관리자 로그인이 필요합니다.';return}
  try{const r=await fetch(`${API}/admin/transfer/recommendations?days=${document.getElementById('days').value||3}&max_km=${document.getElementById('km').value||30}`,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();if(!r.ok){el.textContent=d.error||'권한 없음(관리자 전용).';return}
    if(!d.hq_set)document.getElementById('warn').innerHTML='<div class="warn">⚠️ 본사 좌표(HQ_LAT·HQ_LNG)가 없어 거리컷 없이 재고부족 매장만 추천합니다.</div>';
    const rs=d.recommendations||[];el.className=rs.length?'':'empty';
    el.innerHTML=rs.length?rs.map(hqCard).join(''):'이전 추천 대상이 없습니다.';
  }catch(e){el.textContent='불러오지 못했습니다.'}
}
function hqCard(x){const exp=(x.expiry_at||'').slice(0,10);
  return `<div class="card"><div class="flow">
    <div class="box"><div class="l">본사 임박재고 <span class="risk">위험 ${x.waste_risk}</span></div><div class="v">${x.product_name}</div><div class="meta">유통기한 ${exp} · 잔여 ${fmt(x.qty_remaining)}</div></div>
    <div class="arrow">➜</div>
    <div class="box"><div class="l">이전 대상 매장</div><div class="v">${x.to_vendor_name}</div><div class="meta">${x.to_dong||''} · ${x.distance_km!=null?x.distance_km+'km':'거리미상'} · 부족 ${fmt(x.shortage)}</div></div></div>
    <div class="act"><input class="q" type="number" id="q-h-${x.lot_id}" value="${x.suggest_qty}" title="수량">
      <input class="d" type="date" id="d-h-${x.lot_id}" value="${tomorrow()}" title="이동 예정일">
      <button onclick='approve(${JSON.stringify({...x,_k:"h"}).replace(/'/g,"&#39;")})'>본사→매장 이전 승인</button></div></div>`;
}

// ── 정육점 → 정육점 ──
async function loadStore(){
  const el=document.getElementById('storelist');el.className='empty';el.textContent='불러오는 중…';
  try{const r=await fetch(`${API}/admin/transfer/recommendations/store?max_km=${document.getElementById('skm').value||30}`,{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();if(!r.ok){el.textContent=d.error||'조회 실패';return}
    const rs=d.recommendations||[];el.className=rs.length?'':'empty';
    el.innerHTML=rs.length?rs.map(stCard).join(''):'매칭되는 여유재고 매장이 없습니다. (요청 창에서 품목 지정 요청 필요)';
  }catch(e){el.textContent='불러오지 못했습니다.'}
}
function stCard(x){
  return `<div class="card"><div class="flow">
    <div class="box"><div class="l">여유재고 매장(출발)</div><div class="v">${x.from_vendor_name}</div><div class="meta">${x.from_dong||''} · ${x.distance_km!=null?x.distance_km+'km':'거리미상'}</div></div>
    <div class="arrow">➜</div>
    <div class="box"><div class="l">필요 매장(도착)</div><div class="v">${x.to_vendor_name}</div><div class="meta">${x.to_dong||''} · 요청 ${x.req_qty?fmt(x.req_qty):'-'} · ${x.product_name}</div></div></div>
    <div class="act"><input class="q" type="number" id="q-s-${x.request_id}" value="${x.suggest_qty}" title="수량">
      <input class="q" type="number" id="p-s-${x.request_id}" placeholder="이전단가(원)" title="이전 단가(매출/매입)">
      <input class="d" type="date" id="d-s-${x.request_id}" value="${tomorrow()}" title="이동 예정일">
      <button onclick='approve(${JSON.stringify({...x,_k:"s"}).replace(/'/g,"&#39;")})'>정육점간 이전 승인</button></div></div>`;
}

async function approve(x){
  const isStore=x._k==='s';
  const qid=isStore?('q-s-'+x.request_id):('q-h-'+x.lot_id);
  const did=isStore?('d-s-'+x.request_id):('d-h-'+x.lot_id);
  const q=Number(document.getElementById(qid).value)||x.suggest_qty;
  const date=document.getElementById(did).value||tomorrow();
  const dest=isStore?x.to_vendor_name:x.to_vendor_name;
  if(!confirm(`${x.product_name} ${fmt(q)} 이전\n${isStore?'출발: '+x.from_vendor_name:'본사'} → 도착: ${dest}\n이동예정일: ${date}\n실행할까요?`))return;
  const unit=isStore?(Number(document.getElementById('p-s-'+x.request_id).value)||0):0;
  const body=isStore
    ?{from_type:'vendor',from_vendor_id:x.from_vendor_id,product_id:x.product_id,to_vendor_id:x.to_vendor_id,qty:q,unit_price:unit,item_name:x.product_name,distance_km:x.distance_km,transfer_date:date,request_id:x.request_id,reason:'매장간 이전'}
    :{from_type:'hq',lot_id:x.lot_id,product_id:x.product_id,to_vendor_id:x.to_vendor_id,qty:q,distance_km:x.distance_km,transfer_date:date,reason:'유통기한 임박 이전'};
  try{const r=await fetch(`${API}/admin/transfer/approve`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
    const d=await r.json();if(!r.ok){alert(d.error||'이전 실패');return}
    alert('이전 완료(이동예정일 '+date+').');isStore?loadStore():loadHq();
  }catch(e){alert('오류가 발생했습니다')}
}

// ── 이동 요청 창 ──
async function loadPickers(){
  if(!VENDORS.length){try{const r=await fetch(`${API}/admin/transfer/vendors`,{headers:{Authorization:'Bearer '+token}});const d=await r.json();VENDORS=d.vendors||[];
    document.getElementById('r-vendor').innerHTML='<option value="">필요 매장 선택</option>'+VENDORS.map(v=>`<option value="${v.id}">${v.vendor_name}${v.dong?' ('+v.dong+')':''}</option>`).join('');}catch(e){}}
  if(!PRODUCTS.length){try{const r=await fetch(`${API}/products?limit=100`);const d=await r.json();PRODUCTS=d.products||[];
    document.getElementById('r-product').innerHTML='<option value="">품목 선택</option>'+PRODUCTS.map(p=>`<option value="${p.id}" data-n="${p.name}">${p.name}</option>`).join('');}catch(e){}}
}
async function addReq(){
  const sel=document.getElementById('r-product');const opt=sel.options[sel.selectedIndex];
  const body={requester_vendor_id:document.getElementById('r-vendor').value,product_id:sel.value,item_name:opt?opt.dataset.n:'',qty:document.getElementById('r-qty').value};
  if(!body.requester_vendor_id||!body.product_id){alert('필요 매장·품목을 선택하세요');return}
  try{const r=await fetch(`${API}/admin/transfer/requests`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});
    const d=await r.json();if(!r.ok){alert(d.error||'등록 실패');return}document.getElementById('r-qty').value='';loadReqs();
  }catch(e){alert('오류가 발생했습니다')}
}
async function loadReqs(){
  const el=document.getElementById('reqlist');el.className='empty';el.textContent='불러오는 중…';
  try{const r=await fetch(`${API}/admin/transfer/requests`,{headers:{Authorization:'Bearer '+token}});const d=await r.json();
    const rs=d.requests||[];el.className=rs.length?'':'empty';
    el.innerHTML=rs.length?rs.map(q=>`<div class="card"><div class="flow"><div class="box"><div class="l">필요 매장</div><div class="v">${(q.vendor&&q.vendor.vendor_name)||('매장 '+q.requester_vendor_id)}</div><div class="meta">${q.vendor&&q.vendor.dong?q.vendor.dong+' · ':''}${q.item_name||''} · 요청수량 ${q.qty?fmt(q.qty):'-'}</div></div>
      <span class="del" onclick="cancelReq(${q.id})">요청 취소</span></div></div>`).join(''):'열린 요청이 없습니다.';
  }catch(e){el.textContent='불러오지 못했습니다.'}
}
async function cancelReq(id){if(!confirm('요청을 취소할까요?'))return;try{await fetch(`${API}/admin/transfer/requests/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({status:'cancelled'})});loadReqs();}catch(e){}}
</script>
</body>
