<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0F0F0F;color:#F0F2F5;font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.adm{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.adm-hdr{height:54px;background:#0F0F0F;border-bottom:2px solid #C9A84C;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:200;flex-shrink:0}
.adm-brand{font-size:1.1rem;font-weight:800;color:#C9A84C;letter-spacing:.04em}
.adm-brand small{font-size:.65rem;color:rgba(201,168,76,.5);font-weight:400;margin-left:8px;letter-spacing:.1em}
.adm-hright{display:flex;align-items:center;gap:14px;font-size:.82rem;color:#9CA3AF}
.adm-logout{border:1px solid rgba(201,168,76,.4);color:#C9A84C;background:transparent;padding:5px 14px;border-radius:5px;font-size:.8rem;font-weight:600;transition:background .15s}
.adm-logout:hover{background:rgba(201,168,76,.08)}
.adm-shop{color:#9CA3AF;font-size:.8rem;text-decoration:none}
.adm-shop:hover{color:#C9A84C}

/* TABS */
.adm-tabs{display:flex;background:#111;border-bottom:2px solid #C9A84C;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex-shrink:0;padding:13px 22px;font-size:.85rem;font-weight:600;color:rgba(201,168,76,.4);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s,border-color .15s}
.adm-tab:hover{color:rgba(201,168,76,.7)}
.adm-tab.on{color:#C9A84C;border-bottom-color:#C9A84C}
.adm-tab.adm-grp{background:rgba(201,168,76,.06)}
.adm-tab.adm-grp:first-of-type{box-shadow:inset 1px 0 0 rgba(201,168,76,.25)}
.adm-tab-ext{color:rgba(201,168,76,.3)!important}
.adm-tab-ext:hover{color:rgba(201,168,76,.55)!important}

/* BODY */
.adm-body{flex:1;padding:24px 28px;overflow-x:auto}

/* STAT GRID */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#1A1A1A;border:1px solid #262626;border-radius:10px;padding:20px}
.stat-lbl{font-size:.76rem;color:#9CA3AF;margin-bottom:8px}
.stat-val{font-size:1.8rem;font-weight:800;color:#C9A84C;line-height:1}
.stat-sub{font-size:.75rem;color:#6B7280;margin-top:5px}

/* CARD */
.card{background:#1A1A1A;border:1px solid #262626;border-radius:10px;padding:20px;margin-bottom:20px}
.card:last-child{margin-bottom:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.card-title{font-size:.95rem;font-weight:700;color:#F0F2F5}
.card-sub{font-size:.78rem;color:#9CA3AF;margin-top:3px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:#141414;color:#9CA3AF;font-size:.76rem;font-weight:600;padding:10px 14px;text-align:left;border-bottom:1px solid #1E1E1E;white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid #1E1E1E;font-size:.84rem;color:#D1D5DB;vertical-align:middle}
tbody tr:hover td{background:#1C1C1C}
tbody tr:last-child td{border-bottom:none}

/* BADGES */
.bdg{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.71rem;font-weight:700;white-space:nowrap}
.bdg-pending{background:rgba(234,179,8,.15);color:#EAB308}
.bdg-preparing{background:rgba(59,130,246,.15);color:#3B82F6}
.bdg-shipping{background:rgba(168,85,247,.15);color:#A855F7}
.bdg-delivered{background:rgba(34,197,94,.15);color:#22C55E}
.bdg-cancelled{background:rgba(239,68,68,.15);color:#EF4444}
.bdg-accepted{background:rgba(34,197,94,.15);color:#22C55E}
.bdg-rejected{background:rgba(239,68,68,.15);color:#EF4444}
.bdg-completed{background:rgba(16,185,129,.15);color:#10B981}
.bdg-active{background:rgba(34,197,94,.15);color:#22C55E}
.bdg-inactive{background:rgba(100,116,139,.15);color:#94A3B8}

/* BUTTONS */
.btn{padding:7px 16px;border-radius:6px;border:none;font-size:.82rem;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,#A8862A,#E8C97A);color:#0F0F0F}
.btn-outline{background:transparent;border:1px solid #C9A84C;color:#C9A84C}
.btn-danger{background:rgba(239,68,68,.12);color:#EF4444;border:1px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(34,197,94,.12);color:#22C55E;border:1px solid rgba(34,197,94,.3)}
.btn-sm{padding:4px 10px;font-size:.76rem}

/* FILTER BAR */
.fbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* FORMS */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.form-row.c1{grid-template-columns:1fr}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.fgrp{display:flex;flex-direction:column;gap:5px}
.flbl{font-size:.79rem;color:#9CA3AF}
.finput{background:#141414;border:1px solid #2A2A2A;color:#F0F2F5;padding:9px 12px;border-radius:6px;font-size:.88rem;outline:none;width:100%}
.finput:focus{border-color:#C9A84C}
.fselect{background:#141414;border:1px solid #2A2A2A;color:#F0F2F5;padding:9px 12px;border-radius:6px;font-size:.88rem;outline:none;width:100%;cursor:pointer}
.fselect:focus{border-color:#C9A84C}
textarea.finput{resize:vertical;min-height:80px;padding:10px 12px}

/* INLINE filter inputs */
.fin-sm{background:#141414;border:1px solid #2A2A2A;color:#F0F2F5;padding:7px 11px;border-radius:6px;font-size:.82rem;outline:none}
.fin-sm:focus{border-color:#C9A84C}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:900;display:none}
.overlay.show{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1A1A1A;border:1px solid #333;border-radius:12px;padding:28px 28px 22px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;z-index:901;display:none}
.modal.show{display:block}
.modal-title{font-size:1rem;font-weight:700;color:#F0F2F5;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #262626}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid #262626}

/* CHART BAR */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bar-lbl{font-size:.65rem;color:#6B7280;margin-top:2px}
.bar-val{font-size:.66rem;color:#9CA3AF}
.bar-fill{width:100%;background:linear-gradient(0deg,#A8862A,#E8C97A);border-radius:3px 3px 0 0;transition:height .4s}

/* EMPTY */
.empty{text-align:center;padding:50px;color:#6B7280;font-size:.88rem}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:#1C1C1C;border:1px solid #C9A84C;color:#F0F2F5;padding:10px 22px;border-radius:8px;font-size:.85rem;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
const API = 'https://api.meatbonga.com/api';
let TOKEN = '';
let _modalOkFn = null;

/* ─── UTILS ─── */
function go(u){ location.href = u; }
function fmt(n){ return Number(n||0).toLocaleString('ko-KR'); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('ko-KR') : '–'; }
function fmtDT(d){ return d ? new Date(d).toLocaleString('ko-KR') : '–'; }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2700);
}

function hdrs(){ return { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' }; }

async function api(path, opts = {}){
  const r = await fetch(API + path, { headers: hdrs(), ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || d.message || 'API 오류 ' + r.status);
  return d;
}

function openModal(title, bodyHtml, okLabel, okFn){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const okBtn = document.getElementById('modal-ok');
  okBtn.textContent = okLabel || '확인';
  okBtn.style.display = okFn ? '' : 'none';
  document.getElementById('modal-cancel').textContent = okFn ? '취소' : '닫기';
  _modalOkFn = okFn || null;
  okBtn.onclick = () => { if (_modalOkFn) _modalOkFn(); };
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
}

/* ─── AUTH ─── */
async function init(){
  TOKEN = localStorage.getItem('mm_access_token') || '';
  if (!TOKEN){ go('../login.html'); return; }
  try {
    const d = await api('/auth/me');
    if (!d.user?.is_admin){ go('../login.html'); return; }
    localStorage.setItem('mm_user_cache', JSON.stringify(d.user));
    document.getElementById('adm-user').textContent = d.user.name || d.user.email || '관리자';
  } catch(e){ go('../login.html'); return; }
  const _t=new URLSearchParams(location.search).get('tab');
  const _valid=['orders','users','revenue','cs','vendors','autoassign','assignlist','settlements'];
  switchTab(_valid.includes(_t)?_t:'orders');
  loadSummary();
}

// 사이드바 '오늘의 요약' — 주문/회원/매출 요약 로딩 (best-effort)
async function loadSummary(){
  try{
    const [o,u,r] = await Promise.all([
      api('/admin/orders?limit=1').catch(()=>({})),
      api('/admin/users?limit=1').catch(()=>({})),
      api('/admin/revenue').catch(()=>({}))
    ]);
    const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
    set('sum-orders', (o.total!=null? o.total : '–')+'건');
    set('sum-users',  (u.total!=null? u.total : '–')+'명');
    set('sum-revenue',(r.totalRevenue!=null? Number(r.totalRevenue).toLocaleString('ko-KR')+'원' : '–'));
  }catch(e){}
}

function logout(){
  if (!confirm('로그아웃 하시겠습니까?')) return;
  ['mm_access_token','mm_user_cache'].forEach(k => localStorage.removeItem(k));
  sessionStorage.removeItem('mm_admin');
  go('../login.html');
}

/* ─── TAB SWITCH ─── */
function switchTab(name, el){
  document.querySelectorAll('.adm-tab[data-tab]').forEach(t => t.classList.remove('on'));
  const tabEl = el || document.querySelector(`.adm-tab[data-tab="${name}"]`);
  if (tabEl) tabEl.classList.add('on');
  document.getElementById('adm-body').innerHTML = '<div class="empty">🔄 불러오는 중...</div>';
  ({ orders: tabOrders, users: tabUsers, revenue: tabRevenue, cs: tabCS, vendors: tabVendors, autoassign: tabAutoAssign, assignlist: tabAssignList, settlements: tabSettlements }[name] || (() => {}))();
}

      </select>

    <div style="font-size:.72rem;color:#9CA3AF">변경 후 아래 <strong style="color:#C9A84C">저장하기</strong>를 눌러야 반영됩니다. 닫기 시 반영되지 않습니다.</div>

// 모아둔 변경(포인트·등급·활성)을 저장하기 누를 때 한 번에 반영. 닫기/취소 시 미반영.
async function saveUser(id){
  const u=_users.find(x=>x.id===id); if(!u){ closeModal(); return; }
  const grade=document.getElementById('usr-grade').value;
  const active=document.getElementById('usr-active').value==='1';
  const amount=parseInt(document.getElementById('pt-amt').value,10);
  const reason=(document.getElementById('pt-rsn').value||'').trim();
  const wasActive=u.is_active!==false;
  const changes=[];
  try{
    const patch={};
    if(grade!==(u.grade||'normal')) patch.grade=grade;
    if(active!==wasActive) patch.is_active=active;
    if(Object.keys(patch).length){
      await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify(patch)});
      if(patch.grade) changes.push('등급 '+(GRADE_LBL[grade]||grade));
      if('is_active' in patch) changes.push(active?'활성화':'비활성화');
    }
    if(Number.isInteger(amount) && amount!==0){
      const d=await api('/admin/users/'+id+'/points',{method:'POST',body:JSON.stringify({amount,reason})});
      changes.push('포인트 '+(amount>0?'+':'')+amount+'P → '+Number(d.point).toLocaleString('ko-KR')+'P');
    }
    if(!changes.length){ toast('변경 사항이 없습니다'); return; }
    toast('✅ 저장됨 · '+changes.join(' / '));
    closeModal(); tabUsers();
  }catch(e){ toast('❌ '+e.message); }
}

let _tickets = [];
const CS_ST  = { pending:'대기중', in_progress:'처리중', answered:'답변완료', closed:'종료' };
const CS_TYPE = { order:'주문/배송', payment:'결제/환불', product:'상품문의', subscribe:'정기배송', account:'회원정보', other:'기타' };

async function tabCS(){

  catch(e){ _tickets = []; }
  renderCSTab();
}

function renderCSTab(){
  const pending = _tickets.filter(t => t.status === 'pending').length;
  document.getElementById('adm-body').innerHTML = `
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">CS 문의 목록</div>
        ${pending > 0 ? `<div class="card-sub" style="color:#EF4444">미답변 ${pending}건 처리 필요</div>` : '<div class="card-sub">미답변 없음</div>'}
      </div>
      <div class="fbar" style="margin-bottom:0">
        <select class="fin-sm" id="cs-sf" onchange="filterCS()" style="width:130px">
          <option value="">전체</option>
          <option value="pending">대기중</option>
          <option value="in_progress">처리중</option>
          <option value="answered">답변완료</option>
          <option value="closed">종료</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="tabCS()">새로고침</button>
      </div>
    </div>
    <table>
      <thead><tr><th>상태</th><th>유형</th><th>제목</th><th>고객</th><th>연락처</th><th>접수일</th><th>액션</th></tr></thead>
      <tbody id="cs-tbody">${csRows(_tickets)}</tbody>
    </table>
  </div>`;
}

function csRows(list){
  if (!list.length) return '<tr><td colspan="7" class="empty">문의 없음</td></tr>';
  return list.map(t => `
  <tr>
    <td><span class="bdg ${t.status==='pending'?'bdg-pending':t.status==='answered'?'bdg-delivered':'bdg-preparing'}">${CS_ST[t.status]||t.status}</span></td>
    <td style="font-size:.78rem">${CS_TYPE[t.type] || t.type || '–'}</td>
    <td>${t.status==='pending'?'🔴 ':''}<span style="font-weight:500">${t.title}</span></td>
    <td>${t.users?.name || '비회원'}</td>
    <td style="font-size:.8rem">${t.users?.phone || '–'}</td>
    <td style="font-size:.78rem">${fmtDate(t.created_at)}</td>
    <td><button class="btn btn-sm btn-outline" onclick="openCSDetail('${t.id}')">처리</button></td>
  </tr>`).join('');
}

function filterCS(){
  const s = document.getElementById('cs-sf').value;
  document.getElementById('cs-tbody').innerHTML = csRows(s ? _tickets.filter(t => t.status === s) : _tickets);
}

function openCSDetail(id){
  const t = _tickets.find(x => x.id === id); if (!t) return;
  openModal('CS 문의 처리', `
  <div style="background:#141414;border-radius:8px;padding:14px;margin-bottom:14px;font-size:.88rem;line-height:1.7">

  </div>
  ${t.answer ? `<div style="background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:12px;margin-bottom:12px;font-size:.84rem;color:#86EFAC"><strong>기존 답변:</strong><br>${t.answer}</div>` : ''}
  <div class="fgrp">
    <label class="flbl">${t.answer ? '답변 수정' : '답변 작성'}</label>
    <textarea class="finput" id="cs-ans" rows="4" placeholder="고객에게 보낼 답변을 입력하세요...">${t.answer||''}</textarea>
  </div>`, '답변 전송', async () => {
    const ans = document.getElementById('cs-ans').value.trim();
    if (!ans){ toast('답변을 입력해주세요'); return; }
    try {
      await api('/admin/cs/' + id, { method: 'PATCH', body: JSON.stringify({ answer: ans, status: 'answered' }) });
      toast('✅ 답변이 전송됐습니다'); closeModal(); tabCS();
    } catch(e){ toast('❌ ' + e.message); }
  });

// 주소검색(Daum) → 시/구/동 자동 파싱·입력
function vendorAddrSearch(){
  if (typeof daum === 'undefined' || !daum.Postcode){ toast('주소검색 모듈 로딩 중입니다. 잠시 후 다시 시도해주세요'); return; }
  new daum.Postcode({ oncomplete: function(d){
    const addr = d.roadAddress || d.jibunAddress || '';
    const sido = d.sido || '';          // 서울 / 경기 ...
    const sigungu = d.sigungu || '';    // 강남구  또는  안산시 단원구
    const dong = d.bname || '';         // 고잔동 (법정동)
    let city = '', district = '';
    const parts = sigungu.split(' ').filter(Boolean);
    if (parts.length >= 2) {            // 도 지역: 'OO시 OO구'
      city = parts[0]; district = parts.slice(1).join(' ');
    } else if (parts.length === 1) {    // 광역시/특별시: sigungu='OO구' → 시=sido
      city = sido; district = parts[0];
    } else { city = sido; }
    const set = (id2, val) => { const el = document.getElementById(id2); if (el) el.value = val; };
    set('vf-addr', addr); set('vf-city', city); set('vf-district', district); set('vf-dong', dong);
  }}).open();
}

    <div style="margin-bottom:14px"><div class="flbl" style="margin-bottom:6px">연결된 계정</div>${listHtml}</div>
    <div class="fgrp"><label class="flbl">회원 이메일</label><input class="finput" id="vlink-email" placeholder="vendor@example.com"></div>
  `, '연결', async () => {
    const email = document.getElementById('vlink-email').value.trim();
    if (!email){ toast('이메일을 입력해주세요'); return; }
    try {
      await api('/admin/vendors/' + vendorId + '/link-account', { method: 'POST', body: JSON.stringify({ email }) });
      toast('✅ 계정이 연결됐습니다'); closeModal();
    } catch(e){ toast('❌ ' + e.message); }
  });
}
async function unlinkVendorAccount(vendorId, userId, vendorName){
  if (!confirm('이 계정의 벤더 권한을 해제하시겠습니까?')) return;
  try {
    await api('/admin/vendors/' + vendorId + '/unlink-account', { method: 'POST', body: JSON.stringify({ user_id: userId }) });
    toast('✅ 연결이 해제됐습니다'); closeModal(); openVendorAccountForm(vendorId, vendorName);
  } catch(e){ toast('❌ ' + e.message); }
}

/* ══════════════════════════════════════════════
   TAB 5 — 자동배정
   POST /api/admin/assignments  (자동배정 실행)
   GET  /api/admin/assignments/stats
══════════════════════════════════════════════ */
async function tabAutoAssign(){
  let stats = { total: 0, auto: 0, manual: 0, accepted: 0, rejected: 0, completed: 0 };
  try { const d = await api('/admin/assignments/stats'); Object.assign(stats, d.stats || d); } catch(e){}

  document.getElementById('adm-body').innerHTML = `
  <div class="stat-row">
    <div class="stat-card"><div class="stat-lbl">총 배정건수</div><div class="stat-val">${stats.total}</div><div class="stat-sub">건</div></div>
    <div class="stat-card"><div class="stat-lbl">자동 / 수동</div><div class="stat-val" style="font-size:1.4rem">${stats.auto} <span style="color:#6B7280;font-size:1rem">/</span> ${stats.manual}</div></div>
    <div class="stat-card"><div class="stat-lbl">수락 / 거절</div><div class="stat-val" style="font-size:1.4rem">${stats.accepted} <span style="color:#6B7280;font-size:1rem">/</span> <span style="color:#EF4444">${stats.rejected}</span></div></div>
    <div class="stat-card"><div class="stat-lbl">완료</div><div class="stat-val" style="color:#22C55E">${stats.completed}</div><div class="stat-sub">건</div></div>
  </div>
  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title">자동배정 실행</div>
        <div class="card-sub">결제 완료된 미배정 주문을 거래처에 자동으로 배정합니다</div>
      </div>
      <button class="btn btn-gold" id="aa-btn" onclick="runAutoAssign()" style="padding:12px 28px;font-size:.9rem">🤖 자동배정 실행</button>
    </div>
    <div id="aa-result" style="font-size:.88rem;color:#6B7280;padding:6px 0">실행 버튼을 누르면 결과가 여기 표시됩니다.</div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="card-title">거래처별 배정 현황</div>
      <button class="btn btn-outline btn-sm" onclick="tabAutoAssign()">새로고침</button>
    </div>
    <div id="vendor-stats">
      ${(stats.vendor_stats ? Object.entries(stats.vendor_stats) : []).length ? `
      <table>
        <thead><tr><th>거래처</th><th>오늘 배정</th><th>완료</th><th>진행중</th><th>거절</th></tr></thead>
        <tbody>
          ${Object.entries(stats.vendor_stats || {}).map(([name, v]) => `
          <tr>
            <td style="font-weight:600">${name}</td>
            <td style="font-weight:700;color:#C9A84C">${v.total||0}</td>
            <td style="color:#22C55E">${v.completed||0}</td>
            <td style="color:#F59E0B">${v.in_progress||0}</td>
            <td style="color:#EF4444">${v.rejected||0}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty" style="padding:30px">배정 데이터 없음</div>'}
    </div>
  </div>`;
}

async function runAutoAssign(){
  const btn = document.getElementById('aa-btn');
  const res = document.getElementById('aa-result');
  btn.disabled = true; btn.textContent = '🔄 배정 중...';
  res.innerHTML = '<span style="color:#C9A84C">배정 처리 중...</span>';
  try {
    const d = await api('/admin/assignments', { method: 'POST', body: JSON.stringify({}) });
    const msg = d.message || ((d.assigned || 0) + '건 배정 완료' + (d.failed > 0 ? `, ${d.failed}건 실패` : ''));
    res.innerHTML = `<span style="color:#22C55E">✅ ${msg}</span>`;
    toast('✅ 자동배정 완료');
  } catch(e){
    res.innerHTML = `<span style="color:#EF4444">❌ ${e.message}</span>`;
    toast('❌ ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '🤖 자동배정 실행';
  }
}

/* ══════════════════════════════════════════════
   TAB 6 — 배정현황
   GET /api/admin/assignments
   PUT /api/admin/assignments/:id/accept
   PUT /api/admin/assignments/:id/reject
══════════════════════════════════════════════ */
let _assigns = [];

async function tabAssignList(){
  try { const d = await api('/admin/assignments'); _assigns = d.assignments || []; }
  catch(e){ _assigns = []; }
  renderAssignTab();
}

function renderAssignTab(){
  document.getElementById('adm-body').innerHTML = `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">배정 현황</div><div class="card-sub">총 ${_assigns.length}건</div></div>
      <div class="fbar" style="margin-bottom:0">
        <select class="fin-sm" id="asf" onchange="filterAssigns()" style="width:130px">
          <option value="">전체</option>
          <option value="pending">대기</option>
          <option value="accepted">수락</option>
          <option value="rejected">거절</option>
          <option value="completed">완료</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="tabAssignList()">🔄 새로고침</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>주문번호</th><th>배정 거래처</th><th>배정 유형</th><th>배정 점수</th><th>상태</th><th>배정일</th><th>액션</th></tr></thead>
        <tbody id="assign-tbody">${assignRows(_assigns)}</tbody>
      </table>
    </div>
  </div>`;
}

function assignRows(list){
  if (!list.length) return '<tr><td colspan="7" class="empty">배정 내역 없음</td></tr>';
  return list.map(a => {
    const st = a.assignment_status;
    const stMap = { pending:'대기', accepted:'수락', rejected:'거절', completed:'완료', cancelled:'취소' };
    const stCls = { pending:'bdg-pending', accepted:'bdg-accepted', rejected:'bdg-rejected', completed:'bdg-completed', cancelled:'bdg-cancelled' };
    return `
    <tr>
      <td><span style="font-family:monospace;font-size:.78rem;color:#C9A84C">${a.orders?.order_number || a.order_number || '–'}</span></td>
      <td style="font-weight:500">${a.vendors?.vendor_name || a.vendor_name || '–'}</td>
      <td style="font-size:.8rem">${a.assign_type === 'auto' ? '🤖 자동' : '✋ 수동'}</td>
      <td style="color:#C9A84C">${a.score != null ? a.score : '–'}</td>
      <td><span class="bdg ${stCls[st] || 'bdg-pending'}">${stMap[st] || st}</span></td>
      <td style="font-size:.78rem">${fmtDate(a.assigned_at || a.created_at)}</td>
      <td>
        ${st === 'pending' ? `
        <div style="display:flex;gap:5px">
          <button class="btn btn-sm btn-success" onclick="acceptAssign('${a.id}')">수락</button>
          <button class="btn btn-sm btn-danger"  onclick="rejectAssign('${a.id}')">거절</button>
        </div>` : '–'}
      </td>
    </tr>`;
  }).join('');
}

function filterAssigns(){
  const s = document.getElementById('asf').value;
  document.getElementById('assign-tbody').innerHTML = assignRows(s ? _assigns.filter(a => a.assignment_status === s) : _assigns);
}

async function acceptAssign(id){
  try {
    await api('/admin/assignments/' + id + '/accept', { method: 'PUT', body: JSON.stringify({}) });
    toast('✅ 수락 처리됐습니다'); tabAssignList();
  } catch(e){ toast('❌ ' + e.message); }
}

async function rejectAssign(id){
  const reason = prompt('거절 사유 (선택사항)');
  if (reason === null) return;
  try {
    await api('/admin/assignments/' + id + '/reject', { method: 'PUT', body: JSON.stringify({ reason }) });
    toast('거절 처리됐습니다'); tabAssignList();
  } catch(e){ toast('❌ ' + e.message); }
}

init();
</script>
</body>
</html>
