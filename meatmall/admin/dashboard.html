<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>관리자 대시보드 · 정육본가</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
body{background:#0F0F0F}.app-wrap{background:var(--onyx)!important}

:root{--max-w:480px}
body{background:#0F0F0F}
.admin-header{background:linear-gradient(180deg,#1C1A12,#0F0F0F);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;width:100%;box-sizing:border-box;border-bottom:2px solid #C9A84C;box-shadow:0 2px 12px rgba(201,168,76,.15)}
.admin-logo{font-family:var(--font-display);font-size:1rem;font-weight:700;color:#fff}
.admin-logo small{font-size:.68rem;font-weight:400;opacity:.7;margin-left:6px}
.admin-hbtn{width:36px;height:36px;border-radius:50%;background:rgba(201,168,76,.12);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;cursor:pointer;border:none}
.admin-tabs{display:flex;background:linear-gradient(180deg,#1C1A12,#111);overflow-x:auto;scrollbar-width:none;width:100%;box-sizing:border-box;border-bottom:2px solid #C9A84C}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex-shrink:0;padding:10px 14px;font-size:.8rem;font-weight:600;color:rgba(201,168,76,.45);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .2s}
.admin-tab.active{color:#C9A84C;border-bottom-color:#C9A84C;font-weight:800}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.kpi-card{background:#1C1C1C;border:1.5px solid rgba(201,168,76,.3);border-radius:var(--radius-md);padding:16px;box-shadow:0 2px 12px rgba(201,168,76,.1)}
.kpi-label{font-size:.74rem;color:rgba(201,168,76,.6);margin-bottom:6px}
.kpi-value{font-size:1.3rem;font-weight:800;color:#fff}
.kpi-delta{font-size:.74rem;font-weight:700;margin-top:4px}
.up{color:#EF4444}.down{color:var(--blue)}

/* 알림 배너 */
.alert-bar{margin:0 14px 10px;border-radius:var(--radius-md);padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:.82rem}
.alert-urgent{background:rgba(239,68,68,.1);border-left:3px solid #EF4444}
.alert-warn{background:rgba(201,168,76,.1);border-left:3px solid var(--gold,#C9A84C)}
.alert-text{flex:1;color:rgba(255,255,255,.8);line-height:1.4}
.alert-text strong{font-weight:700}
.alert-btn{font-size:.74rem;font-weight:700;color:var(--gold,#C9A84C);cursor:pointer;padding:4px 8px;border:1px solid var(--gold,#C9A84C);border-radius:var(--radius-sm);white-space:nowrap;background:none}

/* 섹션 카드 */
.admin-section{background:#1C1C1C;margin:0 14px 12px;border:1.5px solid rgba(201,168,76,.25);border-radius:var(--radius-md);overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px;border-bottom:1px solid rgba(201,168,76,.15)}
.section-title{font-size:.9rem;font-weight:700;color:var(--gold,#C9A84C)}
.section-action{font-size:.76rem;color:var(--gold,#C9A84C);font-weight:600;cursor:pointer;background:none;border:none}

/* 매출 차트 */
.chart-wrap{padding:14px 16px;overflow-x:auto}
.rev-bars{display:flex;gap:6px;align-items:flex-end;height:100px}
.rev-bar-w{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:28px}
.rev-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(0deg,#A8862A,#E8C97A);transition:height .4s;cursor:pointer;min-height:4px}
.rev-bar:hover{background:var(--gold,#C9A84C)}
.rev-label{font-size:.62rem;color:rgba(201,168,76,.55)}
.rev-value{font-size:.65rem;font-weight:700;color:#fff}

/* 주문 목록 */
.order-row{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid rgba(201,168,76,.1);font-size:.8rem;cursor:pointer;transition:background .1s}
.order-row:last-child{border-bottom:none}
.order-row:active{background:rgba(201,168,76,.05)}
.order-id{font-weight:700;color:#fff;min-width:80px;font-size:.76rem}
.order-buyer{color:rgba(255,255,255,.65);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.order-amt{font-weight:700;color:#fff;white-space:nowrap}

/* 재고 목록 */
.stock-row{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(201,168,76,.12);font-size:.82rem}
.stock-row:last-child{border-bottom:none}
.stock-emo{font-size:1.3rem;flex-shrink:0}
.stock-name{flex:1;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:130px}
.stock-bar-bg{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;width:70px}
.stock-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.stock-qty{font-size:.76rem;color:rgba(201,168,76,.55);min-width:36px;text-align:right}
.stock-status{font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:999px}
.s-ok{background:rgba(34,197,94,.12);color:#86EFAC}
.s-warn{background:#FEF3C7;color:#92400E}
.s-low{background:var(--red-light);color:#EF4444}
.s-out{background:#1C1C1C;color:rgba(201,168,76,.55)}

/* 매출 테이블 */
.rev-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(201,168,76,.12);font-size:.82rem}
.rev-row:last-child{border-bottom:none}
.rev-pg{flex:1;font-weight:600;color:#fff}
.rev-fee{color:#EF4444;margin-right:8px;font-size:.76rem}
.rev-amt{font-weight:800;color:#fff}
.rev-pct-bar{height:5px;border-radius:3px;margin-top:3px}

/* CS 티켓 */
.ticket-row{padding:12px 16px;border-bottom:1px solid rgba(201,168,76,.12);cursor:pointer}
.ticket-row:last-child{border-bottom:none}
.ticket-row:active{background:#1C1C1C}
.ticket-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ticket-title{font-size:.88rem;font-weight:600;color:#fff;flex:1}
.ticket-meta{font-size:.74rem;color:rgba(201,168,76,.55);display:flex;gap:8px}

/* 빠른 액션 */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.qa-btn{background:#1C1C1C;border:1.5px solid rgba(201,168,76,.35);border-radius:var(--radius-md);padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s}
.qa-btn:active{transform:scale(.95)}
.qa-ico{font-size:1.5rem;margin-bottom:6px}
.qa-lbl{font-size:.68rem;font-weight:700;color:rgba(201,168,76,.8)}

/* 로그인 */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#0F0F0F,#1C1A12)}
.login-box{background:#1C1C1C;border:1.5px solid rgba(201,168,76,.3);border-radius:var(--radius-lg);padding:32px 24px;width:100%;max-width:360px}

/* 주문 상세 바텀시트 */
.order-detail-content{padding:16px;font-size:.88rem;line-height:1.8;color:#fff}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(201,168,76,.12)}
.detail-row:last-child{border-bottom:none}
.detail-key{color:rgba(255,255,255,.5)}
.detail-val{font-weight:600;color:#fff}
/* 시트 다크테마 오버라이드 */
#detail-sheet{background:#1C1C1C}
#detail-sheet .sheet-head{border-bottom:1px solid rgba(201,168,76,.2)}
#detail-sheet .sheet-title{color:#fff}
#detail-sheet .sheet-close{color:rgba(255,255,255,.5)}

/* 로딩 스켈레톤 */
.skel{background:linear-gradient(90deg,var(--gray-100) 25%,#ece9e6 50%,var(--gray-100) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
<script>
// 뒤로가기 캐시(BFCache) 방지 - 뒤로가기 시 항상 새로고침
window.addEventListener('pageshow', function(e){
  if(e.persisted){ window.location.reload(); }
});
</script>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;min-height:100vh;background:#0F0F0F">
  <div style="text-align:center;padding:60px 24px;color:rgba(255,255,255,.3)">🔄 로딩 중...</div>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="detail-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheet-title">상세 정보</div>
    <span class="sheet-close" onclick="closeSheet()">✕</span>
  </div>
  <div id="sheet-body" style="max-height:60vh;overflow-y:auto"></div>
</div>
<div id="toast-global" class="toast"></div>
<script src="../js/app.js"></script>
<script>
const API = 'https://meatmall.vercel.app/api';
let adminToken  = null;
let activeTab   = 'dashboard';
let allOrders   = [];   // 주문 목록 캐시 (showOrderDetail 재사용)
let allTickets  = [];   // CS 목록 캐시 (showCSDetail 재사용)

function tabEl(name){ return document.querySelector(`.admin-tab[data-tab="${name}"]`); }

function go(url){ window.location.href=url; }
function fmt(n){ return Number(n).toLocaleString('ko-KR'); }
function toast(msg){
  const el=document.getElementById('toast-global');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}
function openSheet(title, html){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detail-sheet').classList.remove('open');
  document.body.style.overflow='';
}

// ── 인증 ────────────────────────────────────────────────
function init(){
  adminToken = localStorage.getItem('mm_access_token');
  const user = JSON.parse(localStorage.getItem('mm_user_cache')||'{}');
  const sessionAdmin = sessionStorage.getItem('mm_admin')==='true';

  if (sessionAdmin || user.is_admin) {
    renderDashboard();
  } else {
    renderLogin();
  }
}

// ── 로그인 ───────────────────────────────────────────────
function renderLogin(){
  document.getElementById('app').innerHTML=`
  <div class="login-wrap" style="background:linear-gradient(160deg,#0F0F0F,#1C1A12)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:3rem;margin-bottom:10px">🥩</div>
      <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:#fff">정육본가</div>
      <div style="font-size:.85rem;color:rgba(255,255,255,.7);margin-top:4px">관리자 시스템</div>
    </div>
    <div class="login-box">
      <div style="font-size:1rem;font-weight:800;color:#fff;margin-bottom:20px">🔐 관리자 로그인</div>
      <div class="form-group" style="margin-bottom:12px">
        <div class="form-label">이메일</div>
        <input class="form-input" id="aid" type="email" placeholder="admin@meatmall.co.kr">
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <div class="form-label">비밀번호</div>
        <input class="form-input" id="apw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="adminLogin()">로그인</button>
      <div style="margin-top:14px;text-align:center;font-size:.76rem;color:rgba(255,255,255,.3)">
        정육본가 관리자 전용 시스템
      </div>
    </div>
  </div>`;
}

async function adminLogin(){
  const email = document.getElementById('aid').value.trim();
  const pw    = document.getElementById('apw').value;
  if (!email||!pw){ toast('이메일과 비밀번호를 입력해주세요'); return; }

  const btn = document.getElementById('login-btn');
  btn.innerHTML='<div class="spinner"></div>'; btn.disabled=true;

  try {
    const r = await fetch(API+'/auth/login',{
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pw})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||'로그인 실패');
    if (!d.user?.is_admin) throw new Error('관리자 권한이 없습니다');

    localStorage.setItem('mm_access_token', d.accessToken);
    localStorage.setItem('mm_user_cache', JSON.stringify(d.user));
    sessionStorage.setItem('mm_admin','true');
    adminToken = d.accessToken;
    toast('관리자로 로그인했습니다');
    setTimeout(()=>renderDashboard(), 400);
  } catch(e){
    btn.innerHTML='로그인'; btn.disabled=false;
    toast('❌ '+e.message);
  }
}

// ── 대시보드 렌더 ────────────────────────────────────────
function renderDashboard(){
  document.getElementById('app').innerHTML=`
  <div class="admin-header">
    <div class="admin-logo" style="font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:700;color:#C9A84C;letter-spacing:.06em;cursor:pointer" onclick="window.open('../index.html','_blank')">정육본가<small style="font-size:.58rem;color:rgba(201,168,76,.55);letter-spacing:.14em;display:block;font-family:sans-serif;font-weight:400">관리자</small></div>
    <div style="display:flex;gap:6px">
      <div class="admin-hbtn" onclick="window.open('../index.html','_blank')" title="쇼핑몰 보기" style="font-size:.8rem;width:auto;padding:0 8px;border-radius:var(--radius-sm)">🛍️ 쇼핑몰</div>
      <div class="admin-hbtn" onclick="go('products.html')" title="상품관리">📦</div>
      <div class="admin-hbtn" onclick="adminLogout()" title="로그아웃">🚪</div>
    </div>
  </div>
  <div class="admin-tabs" id="admin-tabs">
    <div class="admin-tab" onclick="go('products.html')" style="color:#F59E0B;font-weight:800">➕ 상품등록</div>
    <div class="admin-tab active" data-tab="dashboard" onclick="switchTab('dashboard',this)">📊 대시보드</div>
    <div class="admin-tab" data-tab="orders" onclick="switchTab('orders',this)">📦 주문관리</div>
    <div class="admin-tab" data-tab="inventory" onclick="switchTab('inventory',this)">🗄️ 재고관리</div>
    <div class="admin-tab" data-tab="categories" onclick="switchTab('categories',this)">🏷️ 카테고리</div>
    <div class="admin-tab" data-tab="revenue" onclick="switchTab('revenue',this)">💰 매출정산</div>
    <div class="admin-tab" data-tab="cs" onclick="switchTab('cs',this)">💬 CS관리</div>
    <div class="admin-tab" onclick="go('payment-settings.html')">💳 결제설정</div>
    <div class="admin-tab" onclick="window.open('../index.html','_blank')">🛍️ 쇼핑몰</div>
  </div>
  <div id="tab-content" style="min-height:80vh;padding-bottom:32px">
    <div style="text-align:center;padding:40px;color:rgba(255,255,255,.3)">🔄 로딩 중...</div>
  </div>`;
  switchTab('dashboard', document.querySelector('.admin-tab[data-tab="dashboard"]'));
}

async function switchTab(name, el){
  activeTab = name;
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  const content = document.getElementById('tab-content');
  content.innerHTML='<div style="text-align:center;padding:40px;color:rgba(255,255,255,.3)">🔄 불러오는 중...</div>';

  const renders = {
    dashboard:  renderTabDashboard,
    orders:     renderTabOrders,
    inventory:  renderTabInventory,
    categories: renderTabCategories,
    revenue:    renderTabRevenue,
    cs:         renderTabCS,
  };
  if(renders[name]) await renders[name]();
}

// ── 대시보드 탭 ──────────────────────────────────────────
async function renderTabDashboard(){
  let kpi={}, alerts={};
  try {
    // 3초 타임아웃 설정
    const controller = new AbortController();
    const tid = setTimeout(()=>controller.abort(), 3000);
    const r = await fetch(API+'/admin/dashboard',{
      headers:{Authorization:'Bearer '+adminToken},
      signal: controller.signal
    });
    clearTimeout(tid);
    if(r.ok){ const d=await r.json(); kpi=d.kpi||{}; alerts=d.alerts||{}; }
  } catch(e){ console.log('대시보드 API 없음, 기본값 사용'); }

  const content = document.getElementById('tab-content');
  content.innerHTML=`
  ${alerts.pendingCS > 0 ? `
  <div class="alert-bar alert-urgent" style="margin-top:14px">
    <span style="font-size:1.2rem">🚨</span>
    <div class="alert-text"><strong>미답변 CS ${alerts.pendingCS}건</strong> 처리가 필요합니다</div>
    <button class="alert-btn" onclick="switchTab('cs',tabEl('cs'))">처리</button>
  </div>` : ''}
  ${(alerts.lowStock||[]).length > 0 ? `
  <div class="alert-bar alert-warn">
    <span style="font-size:1.2rem">⚠️</span>
    <div class="alert-text"><strong>재고 부족 ${alerts.lowStock.length}개 상품</strong></div>
    <button class="alert-btn" onclick="switchTab('inventory',tabEl('inventory'))">확인</button>
  </div>` : ''}

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">오늘 매출</div>
      <div class="kpi-value" style="font-size:1.1rem">${fmt(kpi.todayRevenue||0)}원</div>
      <div class="kpi-delta" style="color:rgba(201,168,76,.55)">${kpi.todayOrders||0}건</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">이번달 매출</div>
      <div class="kpi-value" style="font-size:1rem">${fmt(kpi.monthRevenue||0)}원</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">미처리 주문</div>
      <div class="kpi-value" style="color:${(kpi.pendingOrders||0)>0?'var(--red)':'var(--dark)'}">${kpi.pendingOrders||0}건</div>
      <div class="kpi-delta" style="color:rgba(201,168,76,.55)">처리 필요</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">활성 구독자</div>
      <div class="kpi-value">${kpi.activeSubscribers||0}명</div>
    </div>
  </div>

  <!-- 빠른 액션 -->
  <div class="quick-grid">
    <div class="qa-btn" onclick="window.open('../index.html','_blank')">
      <div class="qa-ico">🛍️</div><div class="qa-lbl">쇼핑몰</div>
    </div>
    <div class="qa-btn" onclick="go('products.html')">
      <div class="qa-ico">📦</div><div class="qa-lbl">상품관리</div>
    </div>
    <div class="qa-btn" onclick="switchTab('categories',tabEl('categories'))">
      <div class="qa-ico">🏷️</div><div class="qa-lbl">카테고리</div>
    </div>
    <div class="qa-btn" onclick="switchTab('orders',tabEl('orders'))">
      <div class="qa-ico">🧾</div><div class="qa-lbl">주문처리</div>
    </div>
  </div>`;
}

// ── 주문관리 탭 ──────────────────────────────────────────
async function renderTabOrders(){
  let orders=[], total=0;
  try {
    const ctrl2 = new AbortController();
    const t2 = setTimeout(()=>ctrl2.abort(), 5000);
    const r = await fetch(API+'/admin/orders?limit=30',{
      headers:{Authorization:'Bearer '+adminToken}, signal:ctrl2.signal
    });
    clearTimeout(t2);
    if(r.ok){ const d=await r.json(); orders=d.orders||[]; total=d.total||0; allOrders=orders; }
  } catch(e){}

  const statusLabel = {pending:'결제대기',pending_deposit:'입금대기🏦',preparing:'준비중',shipping:'배송중',delivered:'완료',cancelled:'취소',refund_req:'환불요청',refunded:'환불완료'};
  const statusClass = {pending:'status-pending',pending_deposit:'status-pending',preparing:'status-preparing',shipping:'status-shipping',delivered:'status-done',cancelled:'status-cancel',refund_req:'status-cancel',refunded:'status-cancel'};

  document.getElementById('tab-content').innerHTML=`
  <div style="padding:12px 14px 6px;display:flex;gap:8px;align-items:center">

async function updateOrderStatus(id){

  if(!status){ toast('상태 값을 선택해주세요'); return; }
  try {
    const r = await fetch(API+'/admin/orders/'+id,{
      method:'PATCH', credentials:'include',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+adminToken},
      body: JSON.stringify({status, tracking_number:tracking||undefined, carrier:carrier||undefined})

    closeSheet();
    switchTab('orders', tabEl('orders'));
  } catch(e){ toast('❌ 상태 변경 실패'); }

      <div style="padding:14px;display:flex;gap:8px">
        <input id="new-cat-name" style="flex:1;height:40px;border:1px solid rgba(201,168,76,.3);border-radius:var(--radius-md);padding:0 12px;font-size:.88rem;background:#111;color:#fff;outline:none" placeholder="카테고리 이름 입력 (예: 항정살)" onkeydown="if(event.key==='Enter')addCategory()">
        <button onclick="addCategory()" style="height:40px;padding:0 18px;background:linear-gradient(135deg,#A8862A,#E8C97A);color:#0F0F0F;border:none;border-radius:var(--radius-md);font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0">+ 추가</button>
      </div>
    </div>

    <!-- 목록 테이블 -->
    <div class="admin-section">
      <div class="section-head">
        <div class="section-title">카테고리 목록</div>
        <span style="font-size:.76rem;color:rgba(201,168,76,.55)">총 ${cats.length}개</span>
      </div>
      <div style="display:flex;padding:8px 16px;font-size:.72rem;color:rgba(201,168,76,.4);border-bottom:1px solid rgba(201,168,76,.12)">
        <div style="flex:1">카테고리명</div>
        <div style="width:56px;text-align:center">상품수</div>
        <div style="width:44px;text-align:center">삭제</div>
      </div>
      ${cats.length===0
        ? '<div style="padding:36px;text-align:center;color:rgba(255,255,255,.3)">카테고리가 없습니다</div>'
        : cats.map(c=>`
        <div style="display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(201,168,76,.1)">
          <div style="flex:1;font-size:.9rem;font-weight:600;color:#fff">🥩 ${c.name}</div>
          <div style="width:56px;text-align:center;font-size:.84rem;font-weight:700;color:${c.product_count>0?'#C9A84C':'rgba(255,255,255,.3)'}">${c.product_count}개</div>
          <div style="width:44px;text-align:center">
            <button onclick="deleteCategory(${c.id},'${c.name.replace(/'/g,'&#39;')}')" style="width:28px;height:28px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius-sm);color:#EF4444;font-size:.8rem;cursor:pointer;line-height:1">✕</button>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

async function addCategory(){
  const name=document.getElementById('new-cat-name').value.trim();
  if(!name){toast('카테고리 이름을 입력해주세요');return;}
  try{
    const r=await fetch(API+'/admin/categories',{
      method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+adminToken},
      body:JSON.stringify({name})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||d.error||'추가 실패');
    toast('✅ 카테고리가 추가됐습니다');
    await renderTabCategories();
  }catch(e){toast('❌ '+e.message);}
}

async function deleteCategory(id,name){
  if(!confirm('"'+name+'" 카테고리를 삭제하시겠습니까?\n\n해당 카테고리의 상품이 있으면 삭제할 수 없습니다.'))return;
  try{
    const r=await fetch(API+'/admin/categories/'+id,{
      method:'DELETE',credentials:'include',
      headers:{Authorization:'Bearer '+adminToken}
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||d.error||'삭제 실패');
    toast('✅ 삭제됐습니다');
    await renderTabCategories();
  }catch(e){toast('❌ '+e.message);}
}

async function confirmVbank(orderId){
  const depositorName  = document.getElementById('depositor-name')?.value || '';
  const depositAmount  = document.getElementById('deposit-amount')?.value || '';
  if (!confirm(`입금자: ${depositorName || '미확인'}\n금액: ${depositAmount}원\n\n입금 확인 처리하시겠습니까?`)) return;
  try {
    const r = await fetch(API+'/payment/vbank-confirm',{
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+adminToken},
      body: JSON.stringify({ orderId, depositorName, depositAmount:Number(depositAmount) })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error);
    toast('✅ 입금 확인 완료! 주문이 준비중으로 변경됐습니다.');
    closeSheet();
    switchTab('orders', tabEl('orders'));
  } catch(e){ toast('❌ '+e.message); }
}

function adminLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  sessionStorage.removeItem('mm_admin');
  localStorage.removeItem('mm_access_token');
  localStorage.removeItem('mm_user_cache');
  localStorage.removeItem('mm_token');
  // 일반 로그인 페이지로 이동
  window.location.href = '../login.html';
}

// 페이지 떠날 때 탭 상태 초기화
window.addEventListener('beforeunload', function(){ activeTab = 'dashboard'; });
init();
</script>
